<title>Snowghost Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one expandable map. Each row reads left to right: what a step needs, the step, what it makes. Opening a row or a datum grows it in place. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --sunk: #eaedf1;
  --ink: #141920;
  --muted: #5b6672;
  --faint: #8c96a1;
  --line: #d9dee4;
  --accent: #2456d6;
  --accent-soft: #e3eafb;
  --read: #13808a;
  --write: #b25f0a;
  --hand: #6b4fc2;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --s-1: 0.75rem;
  --s0: 0.875rem;
  --s1: 1rem;
  --s2: 1.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1014; --panel: #141920; --sunk: #1b222b; --ink: #e2e7ec; --muted: #94a0ab; --faint: #66717c;
    --line: #262e37; --accent: #82a5ff; --accent-soft: #1c2740; --read: #4fbcc4; --write: #e5a04f; --hand: #ab97f5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1014; --panel: #141920; --sunk: #1b222b; --ink: #e2e7ec; --muted: #94a0ab; --faint: #66717c;
  --line: #262e37; --accent: #82a5ff; --accent-soft: #1c2740; --read: #4fbcc4; --write: #e5a04f; --hand: #ab97f5; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--s0); line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }

.page { max-width: 72rem; margin-inline: auto; padding-inline: 1.25rem; padding-block: 2rem 4rem; display: flex; flex-direction: column; gap: 2.25rem; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--s2); letter-spacing: 0.01em; }
.top p { margin: 0.25rem 0 0; font-size: var(--s1); color: var(--muted); max-width: 60ch; }
.hand::after { content: "\25E6"; color: var(--hand); font-size: 0.8em; margin-left: 0.15em; vertical-align: super; line-height: 0; font-style: normal; font-weight: 400; }

#map { display: flex; flex-direction: column; gap: 2.25rem; }
.path { display: flex; flex-direction: column; gap: 0.5rem; }
.path > h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); }
.heads, .line { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) minmax(0, 13rem); gap: 0.75rem; align-items: start; }
.heads { font-size: var(--s-1); color: var(--faint); padding-inline: 0.75rem; }
.heads span:last-child { text-align: right; }
.rows { display: flex; flex-direction: column; gap: 0.375rem; }

.row { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.row.open { border-color: var(--faint); }
.row .row { background: var(--bg); }
.row .row .row { background: var(--panel); }
.row .row .row .row { background: var(--bg); }
.row .row .row .row .row { background: var(--panel); }
.line { padding: 0.5rem 0.75rem; }
.in, .out { display: flex; flex-wrap: wrap; gap: 0.25rem; padding-top: 0.125rem; }
.out { justify-content: flex-end; }
.step { display: grid; grid-template-columns: 1rem minmax(0, 1fr); gap: 0.25rem; width: 100%; }
.step .tw { color: var(--faint); font-family: var(--font-mono); }
.step .name { font-weight: 600; font-size: var(--s1); }
.step .name.mono { font-size: var(--s0); font-weight: 500; }
.step .mod { color: var(--faint); font-family: var(--font-mono); font-size: var(--s-1); font-weight: 400; margin-left: 0.375rem; }
.step .sum { display: block; color: var(--muted); }
.step:hover .name { color: var(--accent); }
.loop { color: var(--faint); font-size: var(--s-1); }

.pill { font-family: var(--font-mono); font-size: var(--s-1); line-height: 1.6; padding: 0 0.4rem; border-radius: 3px; border: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.pill.reads { border-color: var(--read); color: var(--read); background: none; }
.pill.writes { border-color: var(--write); color: var(--write); background: none; border-style: dashed; }
.pill.makes { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.pill.raw { color: var(--muted); font-style: italic; cursor: default; }
.pill.hl { box-shadow: 0 0 0 2px var(--accent); }
.pill.on { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent); }

.body { padding: 0 0.75rem 0.75rem 1.75rem; display: flex; flex-direction: column; gap: 0.375rem; }
.more { color: var(--muted); font-size: var(--s-1); padding: 0.125rem 0; }
.more:hover { color: var(--accent); }
.detail { display: flex; flex-direction: column; gap: 0.625rem; border-left: 2px solid var(--line); padding: 0.25rem 0 0.25rem 0.75rem; }
.detail h4 { margin: 0 0 0.125rem; font-family: var(--font-display); font-weight: 600; font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.detail p { margin: 0; max-width: 75ch; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.125rem 0.75rem; font-family: var(--font-mono); font-size: var(--s-1); }
.kv > :nth-child(odd) { color: var(--muted); }
.kv > * { overflow-wrap: anywhere; }
.eff { color: var(--faint); }
.eff.reads { color: var(--read); } .eff.writes { color: var(--write); }
.where { font-family: var(--font-mono); font-size: var(--s-1); color: var(--faint); overflow-wrap: anywhere; }

.datum { margin: 0 0.75rem 0.75rem; border: 1px solid var(--accent); border-radius: 4px; background: var(--panel); padding: 0.625rem 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
.datum .datum { margin: 0.25rem 0 0.25rem 0.5rem; border-color: var(--line); }
.dhead { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.dhead b { font-family: var(--font-mono); font-weight: 600; }
.dhead .x { margin-left: auto; color: var(--faint); font-family: var(--font-mono); }
.dhead .x:hover { color: var(--accent); }
.ddoc { margin: 0; color: var(--muted); max-width: 80ch; }
.ddoc.none { color: var(--faint); font-style: italic; }
.fields { display: flex; flex-direction: column; }
.f { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 0.75rem; padding: 0.125rem 0; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: var(--s-1); }
.f > * { overflow-wrap: anywhere; }
.f .ty { color: var(--muted); }
.f .ty button { color: var(--accent); }
.f .ty button:hover { text-decoration: underline; }
.f .to { color: var(--hand); margin-left: 0.5rem; }
.sub { grid-column: 1 / -1; }

.foot { color: var(--faint); font-size: var(--s-1); display: flex; flex-direction: column; gap: 0.25rem; max-width: 75ch; }
.foot .key { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }

@media (max-width: 720px) {
  .heads { display: none; }
  .line { grid-template-columns: minmax(0, 1fr); gap: 0.375rem; }
  .line .step { order: -1; }
  .out { justify-content: flex-start; }
  .body { padding-left: 0.75rem; }
  .f { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
</style>

<div class="page">
  <header class="top">
    <h1>Snowghost</h1>
    <p id="sentence"></p>
  </header>
  <main id="map"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const ATLAS = /*ATLAS_DATA*/null;
const T = ATLAS.types, F = ATLAS.fns, A = ATLAS.annotations, TOUR = A.tour;
const INDEX_NOTES = Object.fromEntries(A.indexes.map(n => [n.at, n]));
const HAND = 'Not in the source: written by hand for this prototype';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const short = id => id.split('::').pop();
const modOf = id => id.split('::').slice(0, -1).join('::').replace(/^pkg::/, '');
function firstSentence(s) { if (!s) return ''; const m = s.match(/^.*?[.;:](\s|$)/); return (m ? m[0] : s).trim(); }
function brief(s, n = 110) { s = firstSentence(s); if (s.length <= n) return s; return s.slice(0, s.lastIndexOf(' ', n)) + ' …'; }

// ---------- what a function reads, writes and makes ----------
function effectOf(fn, param) { for (const e of fn.effects) if (e.places && e.places.some(p => p.split('.')[0] === param)) return e.kind; return null; }
function resultMain(fn) {
  const r = fn.result.replace(/^\w+:\s*/, '');
  let main = r; const m = r.match(/^Result<(.*)>$/);
  if (m) { let depth = 0, cut = m[1].length; for (let i = 0; i < m[1].length; i++) { const c = m[1][i]; if (c === '<') depth++; else if (c === '>') depth--; else if (c === ',' && depth === 0) { cut = i; break; } } main = m[1].slice(0, cut); }
  return fn.result_refs.filter(r => new RegExp('\\b' + short(r) + '\\b').test(main));
}
function ioOf(id) {
  const f = F[id], ins = [], outs = [];
  for (const p of f.params) {
    const isRef = p.type.startsWith('&'), eff = effectOf(f, p.name);
    if (!isRef) continue;
    if (p.refs.length) { const item = {key: p.refs[0], label: short(p.refs[0]), type: p.refs[0]}; if (eff === 'writes') outs.push({...item, kind: 'writes'}); else ins.push({...item, kind: 'reads'}); }
    else if (isRef) { const item = {key: 'raw:' + p.name, label: p.name, title: p.type}; if (eff === 'writes') outs.push({...item, kind: 'writes'}); else ins.push({...item, kind: 'raw'}); }
  }
  for (const t of resultMain(f)) outs.push({key: t, label: short(t), type: t, kind: 'makes'});
  return {ins, outs};
}
function dedupe(list) { const seen = new Map(); for (const x of list) { const old = seen.get(x.key); if (!old || (x.kind === 'makes' && old.kind !== 'makes')) seen.set(x.key, x); } return [...seen.values()]; }

// ---------- the tree ----------
function leafFns(node) { return node.fns ? node.fns : node.nodes.flatMap(leafFns); }
function groupIo(node, pathLeaves) {
  const mine = leafFns(node), made = new Set(), ins = [], outs = [];
  for (const id of mine) {
    const io = ioOf(id);
    for (const x of io.ins) if (!made.has(x.key)) ins.push(x);
    for (const x of io.outs) {
      if (x.kind === 'writes' && !made.has(x.key)) ins.push({...x, kind: x.type ? 'reads' : 'raw'});
      if (x.kind === 'makes') made.add(x.key);
      outs.push(x.kind === 'writes' && made.has(x.key) ? {...x, kind: 'makes'} : x);
    }
  }
  const others = pathLeaves.filter(id => !mine.includes(id));
  const usedOutside = new Set(others.flatMap(id => { const io = ioOf(id); return [...io.ins, ...io.outs.filter(o => o.kind === 'writes')].map(x => x.key); }));
  let o = dedupe(outs); const kept = o.filter(x => usedOutside.has(x.key)); if (kept.length) o = kept;
  return {ins: dedupe(ins).filter(x => !made.has(x.key)), outs: o};
}
function isStep(id) { const g = F[id]; return g.calls.length > 0 && g.callers.length <= 4; }

// ---------- state ----------
const open = new Set();
let lastKey = null;
function toggle(key) { if (open.has(key)) open.delete(key); else open.add(key); lastKey = key; render(); }

// ---------- rendering ----------
function pills(list, rowKey) {
  return list.map(x => x.type
    ? `<button class="pill ${x.kind}${open.has('d:' + rowKey + '|' + x.type) ? ' on' : ''}" data-type="${esc(x.type)}" data-key="d:${esc(rowKey)}|${esc(x.type)}" title="${x.kind} ${esc(x.type)}">${esc(x.label)}</button>`
    : `<span class="pill ${x.kind === 'writes' ? 'writes' : 'raw'}" title="${esc(x.title || '')}">${esc(x.label)}</span>`).join('');
}
function dataBlocks(rowKey, io) {
  const seen = new Set();
  return [...io.ins, ...io.outs].filter(x => x.type && !seen.has(x.type) && seen.add(x.type) && open.has('d:' + rowKey + '|' + x.type)).map(x => typeBlock(x.type, 'd:' + rowKey + '|' + x.type)).join('');
}
function line(key, isOpen, io, nameHtml, sumHtml) {
  return `<div class="line"><div class="in">${pills(io.ins, key)}</div>
    <button class="step" data-key="n:${esc(key)}" aria-expanded="${isOpen}"><span class="tw">${isOpen ? '▾' : '▸'}</span><span><span>${nameHtml}</span><span class="sum">${sumHtml}</span></span></button>
    <div class="out">${pills(io.outs, key)}</div></div>`;
}
function fnDetail(id) {
  const f = F[id];
  const params = f.params.map(p => { const e = effectOf(f, p.name); return `<span>${esc(p.name)}</span><span>${esc(p.type)} <span class="eff ${e || ''}">${e || (p.type.startsWith('&') ? '' : 'by value')}</span></span>`; }).join('');
  return `<div class="detail">
    <div class="where">${esc(f.id)} · ${esc(f.file)}:${f.line}</div>
    <div><h4>Takes and returns</h4><div class="kv">${params}<span>returns</span><span>${esc(f.result.replace(/^\w+:\s*/, ''))}</span></div></div>
    ${f.contract.length ? `<div><h4>Contract</h4><div class="kv">${f.contract.map(c => `<span></span><span>${esc(c)}</span>`).join('')}</div></div>` : ''}
    ${f.doc_interface ? `<div><h4>What it promises</h4><p>${esc(f.doc_interface)}</p></div>` : ''}
    ${f.doc_body ? `<div><h4>How it does it</h4><p>${esc(f.doc_body)}</p></div>` : ''}
  </div>`;
}
function fnRow(id, key, ancestors, title, summary) {
  const f = F[id], io = ioOf(id), isOpen = open.has('n:' + key);
  const name = title
    ? `<span class="name hand" title="${HAND}">${esc(title)}</span><span class="mod">${esc(short(id))}</span>`
    : `<span class="name mono">${esc(short(id))}</span>${ancestors.length && modOf(id) !== modOf(ancestors[ancestors.length - 1]) ? `<span class="mod">${esc(modOf(id))}</span>` : ''}`;
  const sum = summary ? `<span class="hand" title="${HAND}">${esc(summary)}</span>` : esc(brief(f.doc_interface || f.doc_body));
  let body = '';
  if (isOpen) {
    const callees = f.calls.filter(c => F[c]);
    const steps = callees.filter(isStep), helpers = callees.filter(c => !isStep(c));
    const chain = [...ancestors, id];
    const rows = list => list.map(c => chain.includes(c)
      ? `<div class="row"><div class="line"><div class="in"></div><div class="loop"><span class="mono">${esc(short(c))}</span> · the same step as the one above: the work recurses here</div><div class="out"></div></div></div>`
      : fnRow(c, key + '/' + c, chain)).join('');
    const hKey = 'h:' + key, dKey = 'x:' + key;
    body = `<div class="body">${rows(steps)}
      ${helpers.length ? `<button class="more" data-key="${esc(hKey)}">${open.has(hKey) ? '▾' : '▸'} ${helpers.length} small helper${helpers.length > 1 ? 's' : ''} it also calls</button>${open.has(hKey) ? rows(helpers) : ''}` : ''}
      ${steps.length ? `<button class="more" data-key="${esc(dKey)}">${open.has(dKey) ? '▾' : '▸'} Contract and full doc</button>${open.has(dKey) ? fnDetail(id) : ''}` : fnDetail(id)}
    </div>`;
  }
  return `<div class="row${isOpen ? ' open' : ''}">${line(key, isOpen, io, name, sum)}${dataBlocks(key, io)}${body}</div>`;
}
function groupRow(node, key, pathLeaves) {
  if (node.fns && node.fns.length === 1) return fnRow(node.fns[0], key, [], node.title, node.summary);
  const io = groupIo(node, pathLeaves), isOpen = open.has('n:' + key);
  const name = `<span class="name hand" title="${HAND}">${esc(node.title)}</span>`;
  const sum = `<span class="hand" title="${HAND}">${esc(node.summary)}</span>`;
  let body = '';
  if (isOpen) body = `<div class="body">${node.fns ? node.fns.map(id => fnRow(id, key + '/' + id, [])).join('') : node.nodes.map((n, i) => groupRow(n, key + '/' + i, pathLeaves)).join('')}</div>`;
  return `<div class="row${isOpen ? ' open' : ''}">${line(key, isOpen, io, name, sum)}${dataBlocks(key, io)}${body}</div>`;
}

// ---------- data ----------
function parseVField(vf) { const [n, ...rest] = vf.replace(/^public\s+/, '').split(':'); return {name: n.trim(), type: rest.join(':').trim()}; }
function target(noteKey) {
  const n = INDEX_NOTES[noteKey]; if (!n) return '';
  return `<span class="to hand" title="${HAND}: ${esc(n.source)}">${n.key ? 'indexed by ' + esc(n.key) + (n.space ? ', ' : '') : ''}${n.space ? '→ ' + esc(n.space) : ''}${n.sentinel ? ' (' + esc(n.sentinel) + ')' : ''}</span>`;
}
function typeText(text, refs, key) {
  let html = esc(text);
  for (const r of refs || []) { const n = short(r), k = key + '/' + r; html = html.replace(new RegExp('\\b' + n + '\\b'), `<button data-key="${esc(k)}" aria-expanded="${open.has(k)}">${n}</button>`); }
  return html;
}
function typeBlock(id, key) {
  const t = T[id]; if (!t) return '';
  const docKey = 'doc:' + key, plainKey = 'plain:' + key;
  const doc = t.doc ? (open.has(docKey) || firstSentence(t.doc).length === t.doc.length ? esc(t.doc) : esc(firstSentence(t.doc)) + ` <button class="more" data-key="${esc(docKey)}">more</button>`) : '';
  let rows;
  if (t.fields) {
    const row = f => { const subs = f.refs.filter(r => open.has(key + '/' + f.name + '/' + r)); return `<div class="f"><span>${esc(f.name)}</span><span class="ty">${typeText(f.type, f.refs, key + '/' + f.name)}${target(id + '.' + f.name)}</span>${subs.map(r => `<div class="sub">${typeBlock(r, key + '/' + f.name + '/' + r)}</div>`).join('')}</div>`; };
    const shown = t.fields.filter(f => f.refs.length || INDEX_NOTES[id + '.' + f.name]), plain = t.fields.filter(f => !shown.includes(f));
    const all = plain.length <= 6 || open.has(plainKey);
    rows = (all ? t.fields : shown).map(row).join('') + (plain.length > 6 ? `<button class="more" data-key="${esc(plainKey)}">${all ? '▾ Hide' : '▸ Show'} ${plain.length} plain values (numbers and flags)</button>` : '');
  } else {
    rows = t.variants.map(v => { const subs = v.refs.filter(r => open.has(key + '/' + v.name + '/' + r)); const notes = v.fields.map(parseVField).map(vf => INDEX_NOTES[id + '.' + v.name + '.' + vf.name] ? `<br>${esc(vf.name)}${target(id + '.' + v.name + '.' + vf.name)}` : '').join(''); return `<div class="f"><span>${esc(v.name)}</span><span class="ty">${typeText(v.fields.join(', ') || '—', v.refs, key + '/' + v.name)}${notes}</span>${subs.map(r => `<div class="sub">${typeBlock(r, key + '/' + v.name + '/' + r)}</div>`).join('')}</div>`; }).join('');
  }
  return `<div class="datum"><div class="dhead"><b>${esc(t.name)}</b><span class="where">${t.kind} in ${esc(modOf(id))} · ${esc(t.file)}:${t.line}</span><button class="x" data-key="${esc(key)}" aria-label="Close ${esc(t.name)}">×</button></div>
    ${doc ? `<p class="ddoc">${doc}</p>` : `<p class="ddoc none">The source gives this ${t.kind} no doc.</p>`}
    <div class="fields">${rows}</div></div>`;
}

function render() {
  const y = window.scrollY;
  document.getElementById('map').innerHTML = TOUR.paths.map(p => {
    const leaves = p.nodes.flatMap(leafFns);
    return `<section class="path"><h2 class="hand" title="${HAND}">${esc(p.title)}</h2>
      <div class="heads"><span>needs</span><span>step</span><span>makes or changes</span></div>
      <div class="rows">${p.nodes.map((n, i) => groupRow(n, p.id + '/' + i, leaves)).join('')}</div></section>`;
  }).join('');
  window.scrollTo(0, y);
  if (lastKey) { const el = [...document.querySelectorAll('[data-key]')].find(e => e.dataset.key === lastKey); if (el) el.focus({preventScroll: true}); }
}
document.getElementById('sentence').innerHTML = `<span class="hand" title="${HAND}">${esc(TOUR.sentence)}</span>`;
document.getElementById('foot').innerHTML = `
  <div class="key"><span class="pill reads">reads</span><span class="pill writes">changes in place</span><span class="pill makes">makes</span><span class="pill raw">plain bytes</span></div>
  <div>Open a step to see the steps inside it. Open a named datum to see what it holds.</div>
  <div>Text marked <span class="hand"></span> is not in the source; it was written by hand. Everything else is read from the declarations, their docs and effect rows, and the order of calls.</div>
  <div class="hand" title="${HAND}">${esc(TOUR.unbuilt)}</div>`;
document.addEventListener('click', ev => { const el = ev.target.closest('[data-key]'); if (el) toggle(el.dataset.key); });
document.addEventListener('mouseover', ev => { const el = ev.target.closest('.pill[data-type]'); document.querySelectorAll('.pill.hl').forEach(p => p.classList.remove('hl')); if (el) document.querySelectorAll('.pill[data-type]').forEach(p => { if (p.dataset.type === el.dataset.type) p.classList.add('hl'); }); });
render();
</script>
