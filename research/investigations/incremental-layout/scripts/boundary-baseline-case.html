<!doctype html>
<html>
<head>
<title>boundary baselines</title>
<style>
body { width: 400px; }
p { margin: 0; line-height: 40px; }
.boundary-large { font-size: 24px; }
.box { display: inline-block; vertical-align: baseline; width: 300px; }
</style>
</head>
<body>
<div>Before <span class="box"><div><div><p>Nested two blocks deep.</p></div></div></span> after the box.</div>
<div><div><p>A paragraph two blocks deep in ordinary flow, long enough to wrap.</p></div></div>
</body>
</html>
