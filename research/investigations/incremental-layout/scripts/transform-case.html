<!doctype html><html><head><title>Retained translation geometry</title><style>
body { margin:0; width:400px; font:16px/20px sans-serif }
div,p { margin:0; padding:0; border:0 }
.outer { width:80px; transform:translate(25%,-50%) }
.child { width:40px; height:20px; transform:translate(3px,4px) }
.float { float:left; width:80px; height:40px; transform:translate(5px,6px) }
.beside { overflow:hidden }
.clear { clear:both; height:80px }
.changed { transform:translate(10px,20px) }
.size { width:160px; padding:4px; border:2px solid }
.mixed { transform:translateX(10px) rotate(10deg) }
.individual { translate:4px 8px }
.colour { color:red }
.clipper { height:20px }
.moved { height:20px; transform:translateY(500px) }
.clip { overflow:hidden }
.shift { width:60px; transform:translateY(-50%) }
</style></head><body><div class="outer"><div class="child"></div><p>Editable translated text.</p></div><p>Untranslated sibling.</p><div class="float"></div><p class="beside">Beside the untranslated float exclusion.</p><div class="clear"></div><div class="clipper"><div class="moved"></div></div><p class="shift">Shifted by half its height.</p></body></html>
