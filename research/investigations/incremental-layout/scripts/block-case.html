<!doctype html>
<html>
<head>
<title>structural updates</title>
<style>
body { width: 400px; }
.box { overflow: hidden; }
.fixed { height: 80px; }
.cnt { counter-reset: c 6; }
.cnt p { counter-increment: c; }
.cnt .show::before { content: counter(c) ". "; }
</style>
</head>
<body>
<div class="box"><p>First paragraph in a box.</p><p>Second paragraph in the same box.</p></div>
<div class="box">Text before <span>an inline span</span> and text after it, long enough to wrap onto a second line inside the box.</div>
<div class="cnt"><div class="box"><p>One</p><p>Two</p></div><div class="box"><p class="show">Three</p></div></div>
<p>Last paragraph of the page.</p>
<div class="box fixed"><p>Inside a box of fixed height, long enough to wrap onto a second line.</p></div>
</body>
</html>
