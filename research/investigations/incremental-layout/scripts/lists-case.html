<!doctype html>
<html>
<head>
<title>lists</title>
<style>
.g { display: grid; grid-template-columns: 1em repeat(2, [a] 2em) [end]; grid-template-rows: auto 3ex; grid-template-areas: "h h" "m s"; grid-auto-columns: minmax(1em, 2fr); }
.g2 { display: grid; grid-template-columns: [x] 10px [y] 20px; grid-auto-rows: 4em; }
.q { quotes: "<" ">" "[" "]"; }
.q2 { quotes: none; }
.c::before { content: "a" counter(n) " b"; counter-increment: n 2; }
.c2::after { content: open-quote "z" close-quote; counter-reset: n 3 m; }
.c3::before { content: none; }
.s1 { counter-set: n 5; }
.e1::before { content: "x"; }
.e2 { quotes: "(" ")"; }
.e3 { grid-template-columns: 2em 1em; }
.e4 { grid-template-areas: "a b" "c d"; }
.e5 { font-size: 20px; }
.e6::before { counter-increment: n 7; }
.e7 { counter-reset: x; }
.e8 { grid-template-rows: 1fr 2fr; grid-auto-columns: auto; }
.e9 { content: "t"; }
</style>
</head>
<body>
<div class="g"><span>one</span><span class="c">two</span><span class="c2">three</span></div>
<div class="g2"><span class="q">alpha <q>beta <q>gamma</q></q></span><span class="q2"><q>delta</q></span></div>
<p class="c s1">Counter <span class="c3">none</span> and <em>emphasis</em> text.</p>
<p class="c2 q">Quote <q>one</q> and <q>two <q>three</q></q> done.</p>
<div class="g"><div class="g2"><span class="c">x</span><span>y</span></div><span class="c2">z</span></div>
<ul><li class="c">item</li><li class="c2">item</li><li>item</li></ul>
</body>
</html>
