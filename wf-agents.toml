# Snowghost-wf's declaration for the engine of wf-agents, read from main as the engine starts: what is Snowghost's own,
# which the agents of its works are given and the engine runs. A path is from the root of Snowghost's checkout.

# The directory that holds Snowghost's design tree, which the engine looks at on each work's branch: its decisions under
# design/decisions/, and the owner's principles under design/principles/ once there are any. design/log.md is the record
# of the changes of the tree's older form (Design-skill's nodes), kept as it was; it is not part of the tree.
tree = "design/"

# Snowghost's guide for its agents: its goal and first priorities, its references and its checks.
[files.guide]
path = "AGENTS.md"

# Snowghost's constitution, which every agent's session holds after the guide and which decides between designs.
[files.constitution]
path = "design/constitution.md"

[project]
# Where an agent keeps what it makes for research, committed: research/investigations/<name>/.
research = "research/"
# How an agent names a test to `run_tests`, as check.yml, design-readiness.yml and fast.yml name it in their JUnit.
test_names = "a test of Snowghost by its target in TESTS of the Makefile: `renderer`, `static-atoms-check`, `dom-selftest`, `binary-size-check`, `design-lint`, `design-ready` or `pin-ready`; the `make oracle-*` comparisons are not tests of the gate and cannot be named"

# Where Snowghost's tests are, as git pathspecs, which are all a line that changes only the tests may change: the
# oracles' runners and case pages under tests/, and the oracle drivers under renderer/oracle/, the document arena's
# self-test among them; a new driver's entry in renderer/modules.wfg is code. The data its tests expect: the HTML tree
# cases of Snowghost's own.
[tests]
paths = ["tests/", "renderer/oracle/"]
expected = ["tests/html/tree-local.dat"]

# Snowghost's workflows, which the engine runs by hand on main's file with a commit given. Each reports every test as
# JUnit XML, named by its target, in the artifact `test-results`; each test runs by itself through
# whitefoot-kit/ci/run-tests.py.
[ci.fast]
# Runs only the tests it is given, after the compiler and its LLVM where they need it.
workflow = "fast.yml"
# The owner's own machine, the self-hosted runner 14900k: an agent waits for this workflow each time it asks for tests,
# and that machine keeps the checkout and the compiler's cache between runs, so a run checks and compiles again only
# what an edit reaches. Every test runs there; none needs root.
runner = "14900k"
# check.yml and fast.yml give their one job 30 minutes; a run not complete by then is cancelled, and said as what it
# found.
too_long = "1h"

[ci.full]
# Every check a merge needs, run once before the merge: the gate (check.yml), and the design tree's change log and the
# pin of a main release (design-readiness.yml). check.yml also checks every push but those to the engine's branches,
# and design-readiness.yml every pull request that is ready and every push to main.
workflows = ["check.yml", "design-readiness.yml"]
runner = "github"
too_long = "1h"

# Snowghost merges its pull requests with a merge commit, as all of them so far. A work's branch is deleted once merged,
# its commits being in main.
[pull_request]
merge_method = "merge"
delete_branch = true

# The paths that govern Snowghost's agents, which the owner changes: a work's change to one asks the owner whether it
# stays. The review checklist is what a work's review holds it to. The declaration is listed, since it names commands
# the engine runs.
[protected]
paths = [
  "AGENTS.md",
  "docs/review-checklist.md",
  "design/constitution.md",
  "design/principles/",
  ".github/workflows/",
  "wf-agents.toml",
]

# Snowghost's heavy commands, which no agent runs: builds, tests and measurements run in CI, never on the machine the
# agents run on (whitefoot-kit/README.md). `make` reaches every build, check and oracle; the others are the compilers,
# Chromium's drivers and the investigations' scripts that build and time the renderer, as the Makefile, the workflows
# and the research records run them.
[heavy]
commands = [
  "make",
  "whitefootc",
  "clang",
  "cc",
  "gcc",
  "ld.lld",
  "node",
  "npx",
  "sh tests/oracle-data.sh",
  "tests/oracle-data.sh",
  "sh research/investigations/style/run.sh",
  "research/investigations/style/run.sh",
  "sh research/investigations/layout/run.sh",
  "research/investigations/layout/run.sh",
  "sh research/investigations/concurrency/run.sh",
  "research/investigations/concurrency/run.sh",
  "sh research/investigations/incremental-layout/run.sh",
  "research/investigations/incremental-layout/run.sh",
  "whitefoot-kit/ci/run-tests.py",
  "python3 whitefoot-kit/ci/run-tests.py",
]

# The variables every agent's command line of Snowghost's works is given beside the engine's own: none. No command an
# agent may run reads a variable that would take it beyond its worktree; the compiler, its cache and Chromium are
# reached only through the heavy commands above.
[environment]
