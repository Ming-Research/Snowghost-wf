# Temporary, for M2's layout branch: applies each falsifier of the current
# step to a copy of the sources, builds it, and requires the oracles to see a
# difference: a full-build dump against the unmutated build, or an X5 case
# page's incremental edit against its rebuild. A job passes when its mutation
# is detected. Runs only for a head commit that asks ([falsify]). Removed
# before the branch is ready. Certificate-equality mutations independently omit
# travel, natural_floor, float_reach, free_transfer and motion_known; each must
# trip boundary_transfer_check before any fixture edit.
name: falsify-m2

on:
  push:
    branches: [research/m2-layout, research/m2-edit-cost, research/m2-frag-a, research/m2-frag-b]

jobs:
  check-machinery:
    if: contains(github.event.head_commit.message, '[falsify]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Oracle assertions reject each violated condition inside a loop
        run: |
          python3 - <<'PYEOF'
          import os
          import subprocess
          from pathlib import Path
          lines = Path('.github/workflows/oracles-m2.yml').read_text().splitlines()
          groups = []
          for index, line in enumerate(lines):
              if line.strip().startswith('test "$differs"'):
                  group = []
                  for following in lines[index:]:
                      if not following.strip().startswith('test '):
                          break
                      group.append(following.strip())
                  groups.append('\n'.join(group))
          assert len(groups) >= 3, 'missing oracle assertion groups'
          for index, group in enumerate(groups, 1):
              command = 'for build in seq par; do\n' + group + '\ndone\necho survived'
              values = dict(os.environ, differs='0', refused='2', allowed='2', same='8')
              good = subprocess.run(['bash', '-e', '-c', command], env=values, capture_output=True)
              assert good.returncode == 0, (index, good.stderr)
              for name, wrong in [('differs', '1'), ('refused', '3'), ('same', '0')]:
                  if '$' + name not in group:
                      continue
                  bad = subprocess.run(['bash', '-e', '-c', command], env=dict(values, **{name: wrong}), capture_output=True)
                  assert bad.returncode == 1 and b'survived' not in bad.stdout, (index, name, bad.stdout)
                  print('detected assertion group', index, name, wrong)
          PYEOF
      - name: Mutated driver failures distinguish expected assertions from unrelated errors
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import tempfile
          from pathlib import Path
          workflow = Path('.github/workflows/falsify-m2.yml').read_text()
          lines = workflow.splitlines()
          start = lines.index('            status=$?')
          end = next(index for index in range(start, len(lines)) if lines[index].startswith('            elif ! python3'))
          handler = '\n'.join(lines[start:end]) + '\n            fi\necho reached-end'
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / 'build').mkdir()
              error = root / 'build/probe.mutated.err'
              for status, diagnostic, expected in [(9, 'unrelated driver error', 9), (2, 'boundary transfer check failed', 0), (0, '', 0)]:
                  error.write_text(diagnostic)
                  command = 'name=probe\n(exit ' + str(status) + ')\n' + handler
                  result = subprocess.run(['bash', '-c', command], cwd=root, capture_output=True, text=True)
                  assert result.returncode == expected, (status, diagnostic, result)
                  assert ('reached-end' in result.stdout) == (expected == 0), result
                  assert ('detected:' in result.stdout) == ('boundary transfer check failed' in diagnostic), result
                  print('driver status', status, diagnostic or 'success', 'handled as', expected)
          PYEOF
      - name: Path-log falsifiers reject missing and contradictory rows
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import tempfile
          from pathlib import Path
          checker = 'research/investigations/incremental-layout/scripts/inctime.py'
          rows = ['base hash 0000000000000000 bytes 1', 'created 10',
                  'structure path 1 splice 1 reason 0', 'edit 1 hash 0000000000000001 bytes 2 inc same',
                  'structure path 2 splice 1 reason 0', 'edit 2 hash 0000000000000000 bytes 1 inc same']
          with tempfile.TemporaryDirectory() as directory:
              script = Path(directory) / 'case.edits'
              script.write_text('B 1 - Text\nX 10\n')
              raw = Path(directory) / 'case.raw'
              def check(lines):
                  raw.write_text('\n'.join(lines) + '\n')
                  return subprocess.run(['python3', checker, '--check', str(script), str(raw)], capture_output=True, text=True)
              good = check(rows)
              assert good.returncode == 0, good.stderr
              completed_fallback = [row.replace('splice 1 reason 0', 'splice 0 reason 10') for row in rows]
              accepted_fallback = check(completed_fallback)
              assert accepted_fallback.returncode == 0, accepted_fallback.stderr
              faults = {
                  'unknown fallback reason': ([row.replace('splice 1 reason 0', 'splice 0 reason 11') for row in rows], 'inconsistent splice/fallback reason'),
                  'success with completed fallback reason': ([row.replace('splice 1 reason 0', 'splice 1 reason 10') for row in rows], 'inconsistent splice/fallback reason'),
                  'one missing path': ([row for row in rows if not row.startswith('structure path 1 ')], 'partial structural path records'),
                  'all missing paths': ([row for row in rows if not row.startswith('structure path ')], 'partial structural path records'),
                  'splice zero reason zero': ([row.replace('splice 1 reason 0', 'splice 0 reason 0') for row in rows], 'inconsistent splice/fallback reason'),
                  'splice one reason nonzero': ([row.replace('splice 1 reason 0', 'splice 1 reason 5') for row in rows], 'inconsistent splice/fallback reason'),
              }
              for name, (mutated, diagnostic) in faults.items():
                  result = check(mutated)
                  assert result.returncode != 0 and diagnostic in result.stderr, (name, result.stdout, result.stderr)
                  print('detected', name, diagnostic)
              assert check(rows).returncode == 0
          PYEOF
      - name: Semantic mutation detection requires valid identity evidence
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          lines = Path('.github/workflows/falsify-m2.yml').read_text().splitlines()
          start = lines.index("          cat > build/semantic-falsify.py <<'PYEOF'") + 1
          end = lines.index('          PYEOF', start)
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          rows = ['base hash 0000000000000000 bytes 1', 'created 10',
                  'structure path 1 splice 1 reason 0', 'edit 1 hash 0000000000000001 bytes 2 inc same',
                  'structure path 2 splice 1 reason 0', 'edit 2 hash 0000000000000000 bytes 1 inc same']
          good = '\n'.join(rows) + '\n'
          different = good.replace('bytes 2 inc same', 'bytes 2 inc DIFF')
          cases = [
              ('baseline negative control', good, '', 0, 1),
              ('actual incremental difference', different, '', 0, 0),
              ('valid path change alone', good.replace('splice 1 reason 0', 'splice 0 reason 7'), '', 0, 1),
              ('unrelated crash', '', 'unrelated driver error', 9, 2),
              ('intended boundary assertion', '', 'boundary transfer check failed\n', 2, 0),
              ('wrong boundary exit', '', 'boundary transfer check failed\n', 9, 2),
              ('mixed boundary diagnostic', '', 'boundary transfer check failed\nunrelated error', 2, 2),
              ('late boundary diagnostic', good, 'boundary transfer check failed\n', 2, 2),
              ('unexpected successful stderr', good, 'unrelated diagnostic', 0, 2),
              ('empty output', '', '', 0, 2),
              ('malformed after difference', different + 'not a protocol record\n', '', 0, 2),
              ('incomplete after difference', different.replace(rows[-1] + '\n', ''), '', 0, 2),
              ('missing paths after difference', different.replace(rows[2] + '\n', ''), '', 0, 2),
              ('contradictory path', different.replace('splice 1 reason 0', 'splice 0 reason 0'), '', 0, 2),
              ('refused edit', good.replace('bytes 2 inc same', 'bytes 2 inc refused'), '', 0, 2),
          ]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              helper = root / 'semantic-falsify.py'
              helper.write_text(source)
              script = root / 'case.edits'
              script.write_text('B 1 - Text\nX 10\n')
              raw = root / 'case.raw'
              error = root / 'case.err'
              for name, output, diagnostic, status, expected in cases:
                  raw.write_text(output)
                  error.write_text(diagnostic)
                  result = subprocess.run([sys.executable, str(helper), str(script), str(raw), str(error), str(status), name], capture_output=True, text=True)
                  assert result.returncode == expected, (name, result.returncode, result.stdout, result.stderr)
                  assert ('detected:' in result.stdout) == (expected == 0), (name, result.stdout)
                  print(name, 'classified as', expected)
              required = Path(str(script) + '.paths')
              required.write_text(rows[2] + '\n' + rows[4] + '\n')
              for name, output, expected_status in [
                  ('path negative control', good, 1),
                  ('required path changed', good.replace('splice 1 reason 0', 'splice 0 reason 3'), 0),
                  ('malformed path protocol', good.replace(rows[2] + '\n', ''), 2),
              ]:
                  raw.write_text(output)
                  error.write_text('')
                  result = subprocess.run([sys.executable, str(helper), str(script), str(raw), str(error), '0', name, 'path'], capture_output=True, text=True)
                  assert result.returncode == expected_status, (name, result.stdout, result.stderr)
                  print(name, 'classified as', expected_status)
              for name, contents in [('missing required paths', None), ('invalid required path', 'malformed\n'), ('duplicate required path', rows[2] + '\n' + rows[2] + '\n')]:
                  if contents is None:
                      required.unlink()
                  else:
                      required.write_text(contents)
                  raw.write_text(good)
                  error.write_text('')
                  result = subprocess.run([sys.executable, str(helper), str(script), str(raw), str(error), '0', name, 'path'], capture_output=True, text=True)
                  assert result.returncode == 2, (name, result.stdout, result.stderr)
                  print(name, 'rejected')
              for name, output, diagnostic, status, expected in [
                  ('certificate assertion', '', 'boundary transfer check failed\n', 2, 0),
                  ('certificate mutation with unchanged output', good, '', 0, 2),
                  ('certificate mutation with only an identity difference', different, '', 0, 2),
                  ('certificate mutation with unrelated crash', '', 'unrelated driver error', 9, 2),
              ]:
                  raw.write_text(output)
                  error.write_text(diagnostic)
                  result = subprocess.run([sys.executable, str(helper), str(script), str(raw), str(error), str(status), name, 'boundary'], capture_output=True, text=True)
                  assert result.returncode == expected, (name, result.returncode, result.stdout, result.stderr)
                  assert ('detected:' in result.stdout) == (expected == 0), (name, result.stdout)
                  print(name, 'classified as', expected)
          PYEOF
      - name: Fixture path expectations reject every wrong row
        run: |
          python3 -B - <<'PYEOF'
          import importlib.util
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace

          scripts = Path('research/investigations/incremental-layout/scripts').resolve()
          sys.path.insert(0, str(scripts))
          spec = importlib.util.spec_from_file_location('splice_cases', scripts / 'splice-cases.py')
          fixture = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixture)
          def verify(kind):
              texts, elements = [], {}
              for index, case in enumerate(fixture.CASES[kind], 1):
                  base = index * 10
                  texts.extend((dict(node=base + 1, parent=base + 2, data=('M2 retained %s.' % case).encode()),
                                dict(node=base + 3, parent=base + 4, data=('M2 probe %s.' % case).encode())))
                  elements[base + 2] = dict(name='p', parent=base + 5, node=base + 2)
                  if case in fixture.INITIAL_REMOVALS:
                      texts.append(dict(node=base + 6, parent=base + 7, data=('M2 remove %s.' % case).encode()))
                      elements[base + 7] = dict(name=fixture.INITIAL_REMOVALS[case][0], parent=base + 5, node=base + 7)
              tree = SimpleNamespace(texts=texts, by_node=elements, arena=1000)
              edits, paths = fixture.generate(tree, kind)
              rows = paths.splitlines()
              selected = set(fixture.CASES[kind]) & fixture.EXPECTED_PATHS.keys()
              initial = set(fixture.CASES[kind]) & fixture.INITIAL_REMOVALS.keys()
              assert len(rows) == 2 * len(selected) + len(initial)
              commands = [line for line in edits.splitlines() if line.split()[0] in ('T', 'D', 'C', 'K', 'B', 'X')]
              for row in rows:
                  operation = int(row.split()[2])
                  assert commands[operation - 1][0] in ('B', 'X'), row
              for case in initial:
                  removal = fixture.marker(tree, case, 'remove')
                  target = tree.by_node[removal['parent']]
                  operation = commands.index('X %d' % target['node']) + 1
                  _, splice, reason = fixture.INITIAL_REMOVALS[case]
                  assert 'structure path %d splice %d reason %d' % (operation, splice, reason) in rows
                  for field, wrong in [('name', 'span'), ('parent', None)]:
                      saved = target[field]
                      target[field] = wrong
                      try:
                          fixture.generate(tree, kind)
                      except ValueError as error:
                          assert 'removal marker must be a sibling' in str(error)
                      else:
                          raise AssertionError('invalid removal target accepted: ' + field)
                      finally:
                          target[field] = saved
              original = fixture.text_pair
              def extra_pair(lines, node):
                  original(lines, node)
                  original(lines, node)
              fixture.text_pair = extra_pair
              longer_edits, longer_paths = fixture.generate(tree, kind)
              assert longer_paths != paths
              longer_commands = [line for line in longer_edits.splitlines() if line.split()[0] in ('T', 'D', 'C', 'K', 'B', 'X')]
              for row in longer_paths.splitlines():
                  operation = int(row.split()[2])
                  assert longer_commands[operation - 1][0] in ('B', 'X'), row
              fixture.text_pair = original
              with tempfile.TemporaryDirectory() as directory:
                  expected = Path(directory) / 'case.edits.paths'
                  raw = Path(directory) / 'case.raw'
                  expected.write_text(paths)
                  def check(content):
                      raw.write_text(content)
                      return subprocess.run([sys.executable, str(scripts / 'splice-cases.py'), '--check-paths', str(expected), str(raw)], capture_output=True, text=True)
                  good = check(paths)
                  assert good.returncode == 0, good.stderr
                  faults = {
                      'missing required row': paths.replace(rows[0] + '\n', ''),
                      'duplicate required row': paths + rows[0] + '\n',
                      'wrong splice': paths.replace(rows[0], rows[0].replace('splice ' + rows[0].split()[4], 'splice ' + str(1 - int(rows[0].split()[4])))),
                      'wrong reason': paths.replace(rows[0], rows[0].replace('reason ' + rows[0].split()[6], 'reason ' + str(1 + int(rows[0].split()[6])))),
                  }
                  for row in rows:
                      fields = row.split()
                      wrong_splice = str(1 - int(fields[4]))
                      wrong_reason = str(int(fields[6]) + 1)
                      for label, changed in [('splice', row.replace('splice ' + fields[4], 'splice ' + wrong_splice)), ('reason', row.replace('reason ' + fields[6], 'reason ' + wrong_reason))]:
                          result = check(paths.replace(row, changed))
                          assert result.returncode != 0 and 'expected exactly one' in result.stderr, (label, row, result)
                  for name, content in faults.items():
                      result = check(content)
                      assert result.returncode != 0 and 'expected exactly one' in result.stderr, (name, result)
                      print('detected', name)
                  for invalid in (paths + rows[0] + '\n', 'malformed\n'):
                      expected.write_text(invalid)
                      result = check(paths)
                      assert result.returncode != 0 and 'malformed or duplicate expectation' in result.stderr, result
                  expected.write_text('')
                  assert check('unrelated records are checked by inctime\n').returncode == 0
              print(kind, 'Required paths follow generated operation positions; good and empty expectations pass; every violated condition fails')
          for kind in ('positioned', 'positioned-isolated', 'flex', 'transfer'):
              verify(kind)
          PYEOF
  falsify:
    if: contains(github.event.head_commit.message, '[falsify]') || contains(github.event.head_commit.message, '[stationary]') || contains(github.event.head_commit.message, '[reference]') || contains(github.event.head_commit.message, '[fragment]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # reassociate-saturation is out until docs/todo.md's item on it is resolved.
        # Step 4's descendant-scan mutation waits for the visit sentinels (docs/todo.md).
        mutation: ${{ contains(github.event.head_commit.message, '[fragment]') && !contains(github.event.head_commit.message, '[falsify]') && fromJSON('["no-anchored-fragment-repair","no-following-fragment-translation","no-split-anchor","no-split-line-refresh","stale-split-ranks"]') || fromJSON('["no-anchored-fragment-repair","no-following-fragment-translation","reference-origin","reference-suffix","reference-sentinel","reference-dense","stationary-height","stationary-baseline","omit-ancestor","relative-twice","shift-table-descendants","column-map-early","collapse-strut","clear-floats-at-close","stop-on-height","unchecked-baseline","omit-ancestor-height","skip-seam","omit-edge","no-sibling-move","live-count-insert","live-count-remove","lose-text-route","synthetic-checkpoint","stale-class-frontier","unsafe-admission","no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins","omit-transfer-travel","omit-transfer-natural-floor","omit-transfer-float-reach","omit-transfer-free-transfer","omit-transfer-motion-known","no-moving-float-anchor","no-positioned-retirement","no-atomic-retirement","no-split-anchor","no-split-line-refresh","stale-split-ranks","omit-transfer-fragment-sources","omit-transfer-fragment-first","omit-transfer-fragment-last"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain and fonts
        run: |
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
      - name: Unmutated driver
        run: |
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          echo "WFC=$wfc" >> "$GITHUB_ENV"
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_base)
          if [ "${{ matrix.mutation }}" = no-split-line-refresh ]; then
            (cd renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o ../build/layout_base_par)
          fi
      - name: Apply the mutation
        run: |
          python3 - "${{ matrix.mutation }}" <<'PYEOF'
          import sys
          from pathlib import Path
          m = sys.argv[1]
          def swap(path, old, new):
              p = Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old, t.count(old))
              p.write_text(t.replace(old, new))
          if m in ("stationary-height", "stationary-baseline"):
              field = "advance" if m == "stationary-height" else "last_baseline"
              swap("renderer/layout/boundary.wf", f"if output.{field} != old_output.{field} {{", f"if output.{field} != output.{field} {{")
          elif m == "reference-origin":
              swap("renderer/layout/geometry.wf", "  let child_slot = no_index;\n  match item {", "  if context^.local_geometry {\n  } else {\n    return unit;\n  }\n  let child_slot = no_index;\n  match item {")
          elif m == "reference-dense":
              swap("renderer/layout/reference.wf", "    shift_paragraph(paragraph: paragraph, delta: delta);", "    shift_paragraph(paragraph: paragraph, delta: 0_i32);")
          elif m == "reference-sentinel":
              swap("renderer/layout/reference.wf", "  let fits = bound < 2147483647_i64;", "  let fits = bound <= 2147483647_i64;")
          elif m == "reference-suffix":
              swap("renderer/layout/reference.wf", "basis_height: basis_height, first: suffix, count: count);", "basis_height: basis_height, first: count, count: count);")
          elif m == "omit-ancestor":
              swap("renderer/layout/geometry.wf", "let normal_y = owner.y +sat local.y;", "let normal_y = local.y;")
          elif m == "relative-twice":
              swap("renderer/layout/geometry.wf", "  let wide_y = value.y +sat value.dy;\n", "  let wide_y = value.y +sat value.dy;\n  set wide_y = wide_y +sat value.dy;\n")
          elif m == "shift-table-descendants":
              swap("renderer/layout/table.wf", "  set cell^.content_dy = cell^.content_dy +sat dy;\n", "  set cell^.content_dy = cell^.content_dy +sat dy;\n  let mutation_shift = cvt::<i32, i64>(dy);\n  let mutation_blocks = cell^.blocks.inner.len;\n  for (b in 0_u64..mutation_blocks) {\n    set cell^.blocks.inner[b].y = cell^.blocks.inner[b].y +sat mutation_shift;\n  }\n")
          elif m == "column-map-early":
              swap("renderer/layout/flow.wf", "let local_top = top -sat map_y;", "let local_top = fragment.y;")
          elif m == "reassociate-saturation":
              swap("renderer/layout/flow.wf", "      let y_shifted = geometry_read_9.y +sat frame.dy;\n      set context^.blocks.inner[at].resolved_x = content_left +sat x_shifted;", "      let y_shifted = geometry_read_9.y +sat frame.dy;\n      set context^.blocks.inner[at].resolved_x = context^.blocks.inner[at].normal_x +sat frame.dx;")
              swap("renderer/layout/flow.wf", "            let y_shifted = geometry_read_15.y +sat dy;\n            set context^.blocks.inner[at].resolved_x = content_left +sat x_shifted;", "            let y_shifted = geometry_read_15.y +sat dy;\n            set context^.blocks.inner[at].resolved_x = context^.blocks.inner[at].normal_x +sat dx;")
          elif m == "collapse-strut":
              swap("renderer/layout/sequence.wf", "    set joined.leading_negative = composed_4;\n", "    set joined.leading_negative = composed_4;\n    set joined.leading_positive = joined.leading_positive +sat joined.leading_negative;\n    set joined.leading_negative = 0_i32;\n")
          elif m == "clear-floats-at-close":
              swap("renderer/layout/flow.wf", "      Close(block: b) => {\n        let depth = frames.inner.len;\n", "      Close(block: b) => {\n        let cleared_floats = box_slots_new::<Exclusion>(capacity: 0_u64);\n        set stack.floats = move cleared_floats;\n        set stack.reach = -2147483647_i32;\n        let depth = frames.inner.len;\n")
          elif m == "stop-on-height":
              swap("renderer/layout/boundary.wf", "let stable = band(same, size_same);", "let stable = size_same;")
          elif m == "unchecked-baseline":
              swap("renderer/layout/boundary.wf", "  if first.first_baseline != second.first_baseline {\n    return False();\n  }\n  if first.last_baseline != second.last_baseline {\n    return False();\n  }\n", "")
          elif m == "omit-ancestor-height":
              swap("renderer/layout/boundary.wf", "      set context^.blocks.inner[at].height = height;\n", "")
          elif m == "skip-seam":
              swap("renderer/layout/splice_boundary.wf", "    let reason = splice_boundary(context: context, item: preceding_item, removing: no, visits: visits);\n", "    let checked_preceding = splice_boundary(context: context, item: preceding_item, removing: no, visits: visits);\n    let reason = 0_u32;\n")
              swap("renderer/layout/splice_boundary.wf", "    let reason = splice_boundary(context: context, item: following_item, removing: no, visits: visits);\n", "    let checked_following = splice_boundary(context: context, item: following_item, removing: no, visits: visits);\n    let reason = 0_u32;\n")
          elif m == "omit-edge":
              swap("renderer/layout/splice_sequence.wf", "let gap = wide_positive +sat wide_negative;", "let gap = 0_i64;")
          elif m == "no-sibling-move":
              swap("renderer/layout/splice_boundary.wf", "let move_y = new_y -sat old_y;", "let move_y = 0_i64;")
          elif m == "live-count-insert":
              swap("renderer/layout/splice.wf", "set layout^.paragraphs = kept_paragraphs +sat added_paragraphs;", "set layout^.paragraphs = kept_paragraphs;")
          elif m == "live-count-remove":
              swap("renderer/layout/splice.wf", "let kept_paragraphs = layout^.paragraphs -sat lost_paragraphs;", "let kept_paragraphs = layout^.paragraphs;")
          elif m == "lose-text-route":
              swap("renderer/layout/splice_publish.wf", "route_write::<TextUnit>(table: &layout^.text_units, at: at, value: text);", "route_write::<TextUnit>(table: &layout^.text_units, at: at, value: absent_text);")
          elif m == "synthetic-checkpoint":
              swap("renderer/layout/splice.wf", "set context^.walk_exact = False();", "set context^.walk_exact = True();")
          elif m == "stale-class-frontier":
              swap("renderer/style/restyle.wf", "let full = unbounded;", "let full = bor(unbounded, traversal^.stale);")
          elif m == "unsafe-admission":
              swap("renderer/layout/boundary.wf", "let fits = bound <= 2147483647_i64;", "let fits = bound <= 68719476735_i64;")
          elif m == "no-positioned-anchor":
              swap("renderer/layout/boundary.wf", "        set context^.children.inner[out_at].anchor.y = context^.children.inner[out_at].anchor.y +sat translation.delta;\n", "")
          elif m == "no-moving-float-anchor":
              swap("renderer/layout/boundary.wf", "        set context^.children.inner[float_at].anchor.y = context^.children.inner[float_at].anchor.y +sat translation.delta;\n", "")
          elif m == "no-positioned-retirement":
              old = "      Out(context: c) => {\n        let at = cvt::<u32, u64>(c);\n        if at < context^.children.inner.len {\n          let (removed_contexts, removed_paragraphs) = retire_splice_child(child: &context^.children.inner[at], paths: paths);\n          set contexts = contexts +sat removed_contexts;\n          set paragraphs = paragraphs +sat removed_paragraphs;\n        }\n      }\n"
              swap("renderer/layout/splice_publish.wf", old, "      Out(..) => {\n      }\n")
          elif m == "no-atomic-retirement":
              old = "          let children = context^.children.inner.len;\n          let (removed_contexts, removed_paragraphs) = retire_splice_atomics(paragraph: &context^.paragraphs.inner[at], children: &context^.children.inner[0_u64..children], paths: paths);\n          set contexts = contexts +sat removed_contexts;\n          set paragraphs = paragraphs +sat removed_paragraphs;\n"
              swap("renderer/layout/splice_publish.wf", old, "")
          elif m == "no-anchored-fragment-repair":
              swap("renderer/layout/fragment_repair.wf", '        repair_fragment_cell(context: context, styles: styles, content_left: content_left, fragment: &fragments^[0_u64], anchor: &anchors^[0_u64]);\n', "")
          elif m == "no-following-fragment-translation":
              swap("renderer/layout/fragment_geometry.wf", "    set fragment.y = top;\n    set fragment.height = bottom -sat top;", "    set fragment.height = bottom -sat top;")
          elif m == "no-split-anchor":
              swap("renderer/layout/fragment_geometry.wf", "  let use_anchor = band(context^.local_geometry, context^.fragments_valid);\n  if context^.fragments_anchored {\n    set use_anchor = context^.fragments_valid;\n  }", "  let use_anchor = False();")
          elif m == "no-split-line-refresh":
              swap("renderer/layout/fragment_geometry.wf", "      let line = wide +sat context^.splits.inner[split].line_offset;", "      let line = cvt::<i32, i64>(context^.splits.inner[split].line);")
          elif m == "stale-split-ranks":
              swap("renderer/layout/fragment_geometry.wf", "      set split.open = opening;\n      set split.close = closing;\n", "")
          elif m == "no-stretch":
              p = Path("renderer/layout/flex.wf")
              source = p.read_text()
              start = source.index("fn flex_stretch(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              old = "  let counted = no_updates();\n"
              assert body.count(old) == 1
              body = body.replace(old, old + "  if setup.updating {\n    return counted;\n  }\n")
              p.write_text(source[:start] + body + source[end:])
          elif m == "no-free-space":
              swap("renderer/layout/flex.wf", "    flex_resolve(lanes: &lanes, first: first, end: end, space: main_inner, gap: main_gap);", "    if setup.updating {\n    } else {\n      flex_resolve(lanes: &lanes, first: first, end: end, space: main_inner, gap: main_gap);\n    }")
          elif m == "no-wrap-rebreak":
              swap("renderer/layout/flex.wf", "  let lines = flex_build_lines(lanes: &lanes, wrapping: wrapping, available: available, gap: main_gap);", "  let line_wrapping = if setup.updating {\n    give False();\n  } else {\n    give wrapping;\n  }\n  let lines = flex_build_lines(lanes: &lanes, wrapping: line_wrapping, available: available, gap: main_gap);")
          elif m == "no-float-floor":
              p = Path("renderer/layout/splice_motion.wf")
              source = p.read_text()
              start = source.index("fn motion_above(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              doc_end = body.index(';') + 1
              p.write_text(source[:start] + body[:doc_end] + "\n  return True();\n}\n" + source[end:])
          elif m == "stale-intrinsic-margins":
              p = Path("renderer/layout/flow.wf")
              source = p.read_text()
              start = source.index("fn intrinsic_flow(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              old = "    let (least, most) = intrinsic_sizes(context: &context^.children.inner[c], styles: styles, document: document, fonts: fonts, picks: picks, viewport: viewport);\n"
              assert body.count(old) == 1
              body = body.replace(old, old + "    let measured_style = context^.children.inner[c].style;\n    let measured_margins = margin_edges(styles: styles, style: measured_style, basis: 0_i32);\n    set context^.children.inner[c].margin_left = measured_margins.left;\n    set context^.children.inner[c].margin_right = measured_margins.right;\n")
              p.write_text(source[:start] + body + source[end:])
          elif m.startswith("omit-transfer-"):
              field = m.removeprefix("omit-transfer-").replace("-", "_")
              if field in ("travel", "natural_floor", "float_reach", "fragment_sources", "fragment_first", "fragment_last"):
                  old = "  if first." + field + " != second." + field + " {\n    return False();\n  }\n"
              elif field in ("free_transfer", "motion_known"):
                  local = "free_same" if field == "free_transfer" else "motion_same"
                  old = "  let " + local + " = eeq(first." + field + ", second." + field + ");\n  if " + local + " {\n  } else {\n    return False();\n  }\n"
              else:
                  raise AssertionError(m)
              p = Path("renderer/layout/boundary.wf")
              source = p.read_text()
              start = source.index("fn same_transfer(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              assert body.count(old) == 1, (m, old)
              p.write_text(source[:start] + body.replace(old, "") + source[end:])
          print("applied", m)
          PYEOF
          git diff --stat
      - name: Mutated driver
        run: (cd renderer && "$WFC" --graph modules.wfg --entry layout_oracle -o ../build/layout_mutated)
      - name: Near-limit unsafe-admission falsifier
        if: matrix.mutation == 'unsafe-admission'
        run: |
          python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_base build/near-limit-base
          if python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_base build/near-limit-negative --unsafe > build/near-limit-negative.log 2>&1; then
            echo 'the unsafe-mutation check accepted an unmutated renderer' >&2
            exit 1
          fi
          grep 'unsafe arithmetic admission produced no rebuild difference' build/near-limit-negative.log
          python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_mutated build/near-limit-unsafe --unsafe
      - name: Detect semantic extension mutations
        if: contains(fromJSON('["no-anchored-fragment-repair","no-following-fragment-translation","no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins","omit-transfer-travel","omit-transfer-natural-floor","omit-transfer-float-reach","omit-transfer-free-transfer","omit-transfer-motion-known","no-moving-float-anchor","no-positioned-retirement","no-atomic-retirement","no-split-anchor","no-split-line-refresh","stale-split-ranks","omit-transfer-fragment-sources","omit-transfer-fragment-first","omit-transfer-fragment-last"]'), matrix.mutation)
        run: |
          set -euo pipefail
          cat > build/semantic-falsify.py <<'PYEOF'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          script, raw, error, status, label = sys.argv[1:6]
          mode = sys.argv[6] if len(sys.argv) == 7 else "identity"
          status = int(status)
          output = Path(raw).read_text()
          diagnostic = Path(error).read_text()
          if status == 2 and diagnostic.strip() == 'boundary transfer check failed' and not output:
              print('detected:', label, 'boundary transfer check failed')
              raise SystemExit(0)
          if mode == 'boundary':
              print('INVALID:', label, 'required boundary assertion did not fail', file=sys.stderr)
              raise SystemExit(2)
          if status != 0 or diagnostic:
              print('INVALID:', label, 'driver status', status, diagnostic, file=sys.stderr)
              raise SystemExit(2)
          pattern = r'^(edit \d+ hash [0-9a-f]{16} bytes \d+ inc )DIFF$'
          normalized, differences = re.subn(pattern, r'\1same', output, flags=re.M)
          with tempfile.TemporaryDirectory() as directory:
              checked = Path(directory) / 'normalized.raw'
              checked.write_text(normalized)
              result = subprocess.run([sys.executable, 'research/investigations/incremental-layout/scripts/inctime.py', '--check', script, str(checked)], capture_output=True, text=True)
          if result.returncode != 0:
              print('INVALID:', label, 'oracle protocol', result.stderr, file=sys.stderr)
              raise SystemExit(2)
          if differences:
              print('detected:', label, differences, 'incremental rebuild differences')
              raise SystemExit(0)
          if mode == 'path':
              try:
                  expected_rows = Path(script + '.paths').read_text().splitlines()
                  expected = {}
                  for row in expected_rows:
                      match = re.fullmatch(r'structure path (\d+) splice ([01]) reason (\d+)', row)
                      if not match or match[1] in expected:
                          raise ValueError('malformed or duplicate required path')
                      expected[match[1]] = row
              except (OSError, ValueError) as failure:
                  print('INVALID:', label, str(failure), file=sys.stderr)
                  raise SystemExit(2)
              actual = {match[1]: match[0] for match in re.finditer(r'^structure path (\d+) splice [01] reason \d+$', output, re.M)}
              changed = [number for number, row in expected.items() if actual.get(number) != row]
              if changed:
                  print('detected:', label, 'required structural paths changed', ','.join(changed))
                  raise SystemExit(0)
          print('NOT DETECTED:', label)
          raise SystemExit(1)
          PYEOF
          s=research/investigations/incremental-layout/scripts
          detection_mode=identity
          case "${{ matrix.mutation }}" in
            omit-transfer-*)
              detection_mode=boundary
              pairs="splice-route-case:block-case"
              cp "$s/splice-route-case.edits" build/splice-route-case.edits
              : > build/splice-route-case.edits.paths
              ;;
            *)
              pairs="positioned-case:positioned-case positioned-isolated-case:positioned-case flex-case:flex-case transfer-case:transfer-case edit-cost-case:transfer-case edit-baseline-case:style-case edit-height-case:style-case edit-cascade-case:transfer-case"
              for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height edit-cascade; do
                python3 "$s/splice-cases.py" build/layout_base "$kind" "build/$kind-case.edits"
              done
              ;;
          esac
          if [ "${{ matrix.mutation }}" = no-split-line-refresh ]; then
            detection_mode=path
            WF_WORKERS=4 build/layout_base_par edit build/transfer-case.edits "$s/transfer-case.html" renderer/style/ua.css > build/transfer-case.par.raw
            python3 "$s/inctime.py" --check build/transfer-case.edits build/transfer-case.par.raw
            python3 "$s/splice-cases.py" --check-paths build/transfer-case.edits.paths build/transfer-case.par.raw
          fi
          detected=no
          for pair in $pairs; do
            name=${pair%%:*} html=${pair#*:}
            script="build/$name.edits"
            base_status=0
            build/layout_base edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.base.raw" 2> "build/$name.base.err" || base_status=$?
            negative_status=0
            python3 build/semantic-falsify.py "$script" "build/$name.base.raw" "build/$name.base.err" "$base_status" "$name baseline" > "build/$name.negative.log" 2>&1 || negative_status=$?
            cat "build/$name.negative.log"
            if [ "$negative_status" -ne 1 ]; then
              echo "baseline failed or was accepted as mutation detection: $name" >&2
              exit 1
            fi
            python3 "$s/splice-cases.py" --check-paths "$script.paths" "build/$name.base.raw"
            mutant_status=0
            build/layout_mutated edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.mutated.raw" 2> "build/$name.mutated.err" || mutant_status=$?
            detection_status=0
            python3 build/semantic-falsify.py "$script" "build/$name.mutated.raw" "build/$name.mutated.err" "$mutant_status" "$name ${{ matrix.mutation }}" "$detection_mode" || detection_status=$?
            if [ "$detection_status" -eq 0 ]; then
              detected=yes
            elif [ "$detection_status" -ne 1 ]; then
              exit "$detection_status"
            fi
          done
          if [ "$detected" != yes ]; then
            echo "NOT DETECTED: ${{ matrix.mutation }}" >&2
            exit 1
          fi
      - name: Detect
        if: matrix.mutation != 'unsafe-admission' && !contains(fromJSON('["no-anchored-fragment-repair","no-following-fragment-translation","no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins","omit-transfer-travel","omit-transfer-natural-floor","omit-transfer-float-reach","omit-transfer-free-transfer","omit-transfer-motion-known","no-moving-float-anchor","no-positioned-retirement","no-atomic-retirement","no-split-anchor","no-split-line-refresh","stale-split-ranks","omit-transfer-fragment-sources","omit-transfer-fragment-first","omit-transfer-fragment-last"]'), matrix.mutation)
        run: |
          set +e
          detected=""
          sh research/investigations/concurrency/run.sh fetch >/dev/null 2>&1
          d=build/research/concurrency
          for page in tests/layout/*-cases.html research/investigations/structure-edits/scripts/saturation-case.html "$d/ecma262.html"; do
            sheets=""
            [ "$page" = "$d/ecma262.html" ] && sheets="assets/css/ecmarkup.css=$d/ecma262-ecmarkup.css assets/css/print.css=$d/ecma262-print.css"
            build/layout_base dump 1 "$page" renderer/style/ua.css $sheets > build/a.dump 2>/dev/null
            build/layout_mutated dump 1 "$page" renderer/style/ua.css $sheets > build/b.dump 2>/dev/null
            if ! cmp -s build/a.dump build/b.dump; then echo "detected: $page full-build dump differs"; detected=yes; fi
          done
          s=research/investigations/incremental-layout/scripts
          sh "$s/checkpoint-case.sh" build/layout_base build/checkpoint-case.edits
          for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height edit-cascade; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            html=${html/edit-cascade/transfer}
            html=${html/positioned-isolated/positioned}
            python3 "$s/splice-cases.py" build/layout_base "$kind" "build/$kind-case.edits" || exit 1
          done
          for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case positioned-case:positioned-case positioned-isolated-case:positioned-case flex-case:flex-case transfer-case:transfer-case edit-cost-case:transfer-case edit-baseline-case:style-case edit-height-case:style-case edit-cascade-case:transfer-case; do
            name=${pair%%:*} html=${pair#*:}
            script="$s/$name.edits"
            if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
            case "$name" in positioned-case|positioned-isolated-case|flex-case|transfer-case|edit-cost-case|edit-baseline-case|edit-height-case|edit-cascade-case) script="build/$name.edits";; esac
            build/layout_base edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.base.raw" || exit 1
            python3 "$s/inctime.py" --check "$script" "build/$name.base.raw" || exit 1
            case "$name" in
              positioned-case|flex-case|transfer-case)
                python3 "$s/splice-cases.py" --check-paths "$script.paths" "build/$name.base.raw" || exit 1
                ;;
            esac
            build/layout_mutated edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.mutated.raw" 2> "build/$name.mutated.err"
            status=$?
            if grep -q 'boundary transfer check failed' "build/$name.mutated.err"; then
              echo "detected: $name boundary transfer check failed"
              detected=yes
            elif [ "$status" -ne 0 ]; then
              cat "build/$name.mutated.err" >&2
              exit "$status"
            elif ! python3 "$s/inctime.py" --check "$script" "build/$name.mutated.raw"; then
              echo "detected: $name incremental identity or path check"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.mutated.raw"
              detected=yes
            fi
          done
          for pair in block-case:block-case style-case:style-case boundary-case:block-case boundary-baseline-case:boundary-baseline-case; do
            name=${pair%%:*} html=${pair#*:}
            build/layout_mutated edit "$s/$name.edits" "$s/$html.html" renderer/style/ua.css > build/m.raw 2> build/m.err
            differs=$(grep -c ' inc DIFF$' build/m.raw)
            [ "$differs" -gt 0 ] && { echo "detected: $name has $differs incremental differences"; detected=yes; }
            grep -q 'boundary transfer check failed' build/m.err && { echo "detected: $name: boundary transfer check failed"; detected=yes; }
          done
          build/layout_base edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css 2>/dev/null | grep -E 'structure path| inc (same|DIFF|refused)$' > build/base.paths
          build/layout_mutated edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css 2>/dev/null | grep -E 'structure path| inc (same|DIFF|refused)$' > build/mutated.paths
          if ! cmp -s build/base.paths build/mutated.paths; then echo "detected: block-case structure paths or edit outcomes differ"; diff build/base.paths build/mutated.paths | head -6; detected=yes; fi
          if [ -z "$detected" ]; then echo "NOT DETECTED: ${{ matrix.mutation }}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mutation == 'unsafe-admission'
        with:
          name: unsafe-admission-evidence
          path: |
            build/near-limit-*/
            build/near-limit-negative.log
      - uses: actions/upload-artifact@v4
        if: always() && contains(fromJSON('["no-anchored-fragment-repair","no-following-fragment-translation","no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins","omit-transfer-travel","omit-transfer-natural-floor","omit-transfer-float-reach","omit-transfer-free-transfer","omit-transfer-motion-known","no-moving-float-anchor","no-positioned-retirement","no-atomic-retirement","no-split-anchor","no-split-line-refresh","stale-split-ranks","omit-transfer-fragment-sources","omit-transfer-fragment-first","omit-transfer-fragment-last"]'), matrix.mutation)
        with:
          name: semantic-${{ matrix.mutation }}
          path: |
            build/*-case.edits*
            build/*-case.*.raw
            build/*-case.*.err
            build/*-case.negative.log

      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.mutation, 'stationary-')
        with:
          name: ${{ matrix.mutation }}-evidence
          path: |
            build/edit-baseline-case.*
            build/edit-height-case.*
            build/edit-cascade-case.*
            build/positioned-isolated-case.*
            build/edit-cost-case.*

      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.mutation, 'reference-')
        with:
          name: ${{ matrix.mutation }}-evidence
          path: |
            build/*-case.edits*
            build/*-case.*.raw
            build/*-case.*.err

  numeric-suffix:
    if: contains(github.event.head_commit.message, '[falsify]') || contains(github.event.head_commit.message, '[numeric]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler and fonts
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          echo "WFC=$wfc" >> "$GITHUB_ENV"
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_numeric_base)
      - name: Unmutated identity and detector negative control
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          python3 "$s/split-limit.py" build/layout_numeric_base build/split-limit-base
          if python3 "$s/split-limit.py" build/layout_numeric_base build/split-limit-negative --detect-omission > build/split-limit-negative.log 2> build/split-limit-negative.err; then
            echo "unmutated boundary output was accepted as omission detection" >&2
            exit 1
          fi
          grep -Fx 'AssertionError: omitted numeric suffix admission produced no high-origin difference' build/split-limit-negative.err
      - name: Omit each numeric admission independently
        run: |
          set -euo pipefail
          for route in in-place convergence; do
            git restore renderer/layout/update.wf renderer/layout/flow.wf
            python3 - "$route" <<'PYEOF'
          import sys
          from pathlib import Path
          if sys.argv[1] == 'in-place':
              path = Path('renderer/layout/update.wf')
              old = '    let exact_motion = reference_motion_fits(origin: frame.content_top, travel: old_output.travel, delta: change.delta);'
              new = '    let exact_motion = True();'
          else:
              path = Path('renderer/layout/flow.wf')
              old = '  let exact_suffix = reference_motion_fits(origin: content_top, travel: old_travel, delta: delta);'
              new = '  let exact_suffix = True();'
          text = path.read_text()
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PYEOF
            (cd renderer && "$WFC" --graph modules.wfg --entry layout_oracle -o "../build/layout_numeric_$route")
            python3 research/investigations/incremental-layout/scripts/split-limit.py "build/layout_numeric_$route" "build/split-limit-$route" --detect-omission
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-suffix-evidence
          path: |
            build/split-limit-*/
            build/split-limit-negative.log
            build/split-limit-negative.err
