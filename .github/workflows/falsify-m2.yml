# Temporary, for M2's layout branch: applies each falsifier of the current
# step to a copy of the sources, builds it, and requires the oracles to see a
# difference: a full-build dump against the unmutated build, or an X5 case
# page's incremental edit against its rebuild. A job passes when its mutation
# is detected. Runs only for a head commit that asks ([falsify]). Removed
# before the branch is ready.
name: falsify-m2

on:
  push:
    branches: [research/m2-layout, research/m2-edit-cost]

jobs:
  check-machinery:
    if: contains(github.event.head_commit.message, '[falsify]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Oracle assertions reject each violated condition inside a loop
        run: |
          python3 - <<'PYEOF'
          import os
          import subprocess
          from pathlib import Path
          lines = Path('.github/workflows/oracles-m2.yml').read_text().splitlines()
          groups = []
          for index, line in enumerate(lines):
              if line.strip().startswith('test "$differs"'):
                  group = []
                  for following in lines[index:]:
                      if not following.strip().startswith('test '):
                          break
                      group.append(following.strip())
                  groups.append('\n'.join(group))
          assert len(groups) >= 3, 'missing oracle assertion groups'
          for index, group in enumerate(groups, 1):
              command = 'for build in seq par; do\n' + group + '\ndone\necho survived'
              values = dict(os.environ, differs='0', refused='2', allowed='2', same='8')
              good = subprocess.run(['bash', '-e', '-c', command], env=values, capture_output=True)
              assert good.returncode == 0, (index, good.stderr)
              for name, wrong in [('differs', '1'), ('refused', '3'), ('same', '0')]:
                  if '$' + name not in group:
                      continue
                  bad = subprocess.run(['bash', '-e', '-c', command], env=dict(values, **{name: wrong}), capture_output=True)
                  assert bad.returncode == 1 and b'survived' not in bad.stdout, (index, name, bad.stdout)
                  print('detected assertion group', index, name, wrong)
          PYEOF
      - name: Mutated driver failures distinguish expected assertions from unrelated errors
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import tempfile
          from pathlib import Path
          workflow = Path('.github/workflows/falsify-m2.yml').read_text()
          lines = workflow.splitlines()
          start = lines.index('            status=$?')
          end = next(index for index in range(start, len(lines)) if lines[index].startswith('            elif ! python3'))
          handler = '\n'.join(lines[start:end]) + '\n            fi\necho reached-end'
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / 'build').mkdir()
              error = root / 'build/probe.mutated.err'
              for status, diagnostic, expected in [(9, 'unrelated driver error', 9), (2, 'boundary transfer check failed', 0), (0, '', 0)]:
                  error.write_text(diagnostic)
                  command = 'name=probe\n(exit ' + str(status) + ')\n' + handler
                  result = subprocess.run(['bash', '-c', command], cwd=root, capture_output=True, text=True)
                  assert result.returncode == expected, (status, diagnostic, result)
                  assert ('reached-end' in result.stdout) == (expected == 0), result
                  assert ('detected:' in result.stdout) == ('boundary transfer check failed' in diagnostic), result
                  print('driver status', status, diagnostic or 'success', 'handled as', expected)
          PYEOF
      - name: Path-log falsifiers reject missing and contradictory rows
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import tempfile
          from pathlib import Path
          checker = 'research/investigations/incremental-layout/scripts/inctime.py'
          rows = ['base hash 0000000000000000 bytes 1', 'created 10',
                  'structure path 1 splice 1 reason 0', 'edit 1 hash 0000000000000001 bytes 2 inc same',
                  'structure path 2 splice 1 reason 0', 'edit 2 hash 0000000000000000 bytes 1 inc same']
          with tempfile.TemporaryDirectory() as directory:
              script = Path(directory) / 'case.edits'
              script.write_text('B 1 - Text\nX 10\n')
              raw = Path(directory) / 'case.raw'
              def check(lines):
                  raw.write_text('\n'.join(lines) + '\n')
                  return subprocess.run(['python3', checker, '--check', str(script), str(raw)], capture_output=True, text=True)
              good = check(rows)
              assert good.returncode == 0, good.stderr
              faults = {
                  'one missing path': ([row for row in rows if not row.startswith('structure path 1 ')], 'partial structural path records'),
                  'all missing paths': ([row for row in rows if not row.startswith('structure path ')], 'partial structural path records'),
                  'splice zero reason zero': ([row.replace('splice 1 reason 0', 'splice 0 reason 0') for row in rows], 'inconsistent splice/fallback reason'),
                  'splice one reason nonzero': ([row.replace('splice 1 reason 0', 'splice 1 reason 5') for row in rows], 'inconsistent splice/fallback reason'),
              }
              for name, (mutated, diagnostic) in faults.items():
                  result = check(mutated)
                  assert result.returncode != 0 and diagnostic in result.stderr, (name, result.stdout, result.stderr)
                  print('detected', name, diagnostic)
              assert check(rows).returncode == 0
          PYEOF
      - name: Semantic mutation detection requires valid identity evidence
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          lines = Path('.github/workflows/falsify-m2.yml').read_text().splitlines()
          start = lines.index("          cat > build/semantic-falsify.py <<'PYEOF'") + 1
          end = lines.index('          PYEOF', start)
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          rows = ['base hash 0000000000000000 bytes 1', 'created 10',
                  'structure path 1 splice 1 reason 0', 'edit 1 hash 0000000000000001 bytes 2 inc same',
                  'structure path 2 splice 1 reason 0', 'edit 2 hash 0000000000000000 bytes 1 inc same']
          good = '\n'.join(rows) + '\n'
          different = good.replace('bytes 2 inc same', 'bytes 2 inc DIFF')
          cases = [
              ('baseline negative control', good, '', 0, 1),
              ('actual incremental difference', different, '', 0, 0),
              ('valid path change alone', good.replace('splice 1 reason 0', 'splice 0 reason 7'), '', 0, 1),
              ('unrelated crash', '', 'unrelated driver error', 9, 2),
              ('intended boundary assertion', '', 'boundary transfer check failed\n', 2, 0),
              ('wrong boundary exit', '', 'boundary transfer check failed\n', 9, 2),
              ('mixed boundary diagnostic', '', 'boundary transfer check failed\nunrelated error', 2, 2),
              ('late boundary diagnostic', good, 'boundary transfer check failed\n', 2, 2),
              ('unexpected successful stderr', good, 'unrelated diagnostic', 0, 2),
              ('empty output', '', '', 0, 2),
              ('malformed after difference', different + 'not a protocol record\n', '', 0, 2),
              ('incomplete after difference', different.replace(rows[-1] + '\n', ''), '', 0, 2),
              ('missing paths after difference', different.replace(rows[2] + '\n', ''), '', 0, 2),
              ('contradictory path', different.replace('splice 1 reason 0', 'splice 0 reason 0'), '', 0, 2),
              ('refused edit', good.replace('bytes 2 inc same', 'bytes 2 inc refused'), '', 0, 2),
          ]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              helper = root / 'semantic-falsify.py'
              helper.write_text(source)
              script = root / 'case.edits'
              script.write_text('B 1 - Text\nX 10\n')
              raw = root / 'case.raw'
              error = root / 'case.err'
              for name, output, diagnostic, status, expected in cases:
                  raw.write_text(output)
                  error.write_text(diagnostic)
                  result = subprocess.run([sys.executable, str(helper), str(script), str(raw), str(error), str(status), name], capture_output=True, text=True)
                  assert result.returncode == expected, (name, result.returncode, result.stdout, result.stderr)
                  assert ('detected:' in result.stdout) == (expected == 0), (name, result.stdout)
                  print(name, 'classified as', expected)
          PYEOF
  falsify:
    if: contains(github.event.head_commit.message, '[falsify]') || contains(github.event.head_commit.message, '[stationary]') || contains(github.event.head_commit.message, '[reference]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # reassociate-saturation is out until docs/todo.md's item on it is resolved.
        # Step 4's descendant-scan mutation waits for the visit sentinels (docs/todo.md).
        mutation: ${{ fromJSON((contains(github.event.head_commit.message, '[reference]') && !contains(github.event.head_commit.message, '[falsify]')) && '["reference-origin","reference-suffix","reference-sentinel"]' || (contains(github.event.head_commit.message, '[stationary]') && !contains(github.event.head_commit.message, '[falsify]')) && '["stationary-height","stationary-baseline","no-positioned-anchor"]' || '["reference-origin","reference-suffix","reference-sentinel","stationary-height","stationary-baseline","omit-ancestor","relative-twice","shift-table-descendants","column-map-early","collapse-strut","clear-floats-at-close","stop-on-height","unchecked-baseline","omit-ancestor-height","skip-seam","omit-edge","no-sibling-move","live-count-insert","live-count-remove","lose-text-route","synthetic-checkpoint","stale-class-frontier","unsafe-admission","no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
      - name: Unmutated driver
        run: |
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          echo "WFC=$wfc" >> "$GITHUB_ENV"
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_base)
      - name: Apply the mutation
        run: |
          python3 - "${{ matrix.mutation }}" <<'PYEOF'
          import sys
          from pathlib import Path
          m = sys.argv[1]
          def swap(path, old, new):
              p = Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old, t.count(old))
              p.write_text(t.replace(old, new))
          if m in ("stationary-height", "stationary-baseline"):
              field = "advance" if m == "stationary-height" else "last_baseline"
              swap("renderer/layout/boundary.wf", f"if output.{field} != old_output.{field} {{", f"if output.{field} != output.{field} {{")
          elif m == "reference-origin":
              swap("renderer/layout/geometry.wf", "  let child_slot = no_index;\n  match item {", "  if context^.local_geometry {\n  } else {\n    return unit;\n  }\n  let child_slot = no_index;\n  match item {")
          elif m == "reference-sentinel":
              swap("renderer/layout/reference.wf", "  let fits = bound < 2147483647_i64;", "  let fits = bound <= 2147483647_i64;")
          elif m == "reference-suffix":
              swap("renderer/layout/reference.wf", "basis_height: basis_height, first: suffix, count: count);", "basis_height: basis_height, first: count, count: count);")
          elif m == "omit-ancestor":
              swap("renderer/layout/geometry.wf", "let normal_y = owner.y +sat local.y;", "let normal_y = local.y;")
          elif m == "relative-twice":
              swap("renderer/layout/geometry.wf", "  let wide_y = value.y +sat value.dy;\n", "  let wide_y = value.y +sat value.dy;\n  set wide_y = wide_y +sat value.dy;\n")
          elif m == "shift-table-descendants":
              swap("renderer/layout/table.wf", "  set cell^.content_dy = cell^.content_dy +sat dy;\n", "  set cell^.content_dy = cell^.content_dy +sat dy;\n  let mutation_shift = cvt::<i32, i64>(dy);\n  let mutation_blocks = cell^.blocks.inner.len;\n  for (b in 0_u64..mutation_blocks) {\n    set cell^.blocks.inner[b].y = cell^.blocks.inner[b].y +sat mutation_shift;\n  }\n")
          elif m == "column-map-early":
              swap("renderer/layout/flow.wf", "let local_top = top -sat map_y;", "let local_top = fragment.y;")
          elif m == "reassociate-saturation":
              swap("renderer/layout/flow.wf", "      let y_shifted = geometry_read_9.y +sat frame.dy;\n      set context^.blocks.inner[at].resolved_x = content_left +sat x_shifted;", "      let y_shifted = geometry_read_9.y +sat frame.dy;\n      set context^.blocks.inner[at].resolved_x = context^.blocks.inner[at].normal_x +sat frame.dx;")
              swap("renderer/layout/flow.wf", "            let y_shifted = geometry_read_15.y +sat dy;\n            set context^.blocks.inner[at].resolved_x = content_left +sat x_shifted;", "            let y_shifted = geometry_read_15.y +sat dy;\n            set context^.blocks.inner[at].resolved_x = context^.blocks.inner[at].normal_x +sat dx;")
          elif m == "collapse-strut":
              swap("renderer/layout/sequence.wf", "    set joined.leading_negative = composed_4;\n", "    set joined.leading_negative = composed_4;\n    set joined.leading_positive = joined.leading_positive +sat joined.leading_negative;\n    set joined.leading_negative = 0_i32;\n")
          elif m == "clear-floats-at-close":
              swap("renderer/layout/flow.wf", "      Close(block: b) => {\n        let depth = frames.inner.len;\n", "      Close(block: b) => {\n        let cleared_floats = box_slots_new::<Exclusion>(capacity: 0_u64);\n        set stack.floats = move cleared_floats;\n        set stack.reach = -2147483647_i32;\n        let depth = frames.inner.len;\n")
          elif m == "stop-on-height":
              swap("renderer/layout/boundary.wf", "let stable = band(same, size_same);", "let stable = size_same;")
          elif m == "unchecked-baseline":
              swap("renderer/layout/boundary.wf", "  if first.first_baseline != second.first_baseline {\n    return False();\n  }\n  if first.last_baseline != second.last_baseline {\n    return False();\n  }\n", "")
          elif m == "omit-ancestor-height":
              swap("renderer/layout/boundary.wf", "      set context^.blocks.inner[at].height = height;\n", "")
          elif m == "skip-seam":
              swap("renderer/layout/splice_boundary.wf", "    let reason = splice_boundary(context: context, item: preceding_item, removing: no, visits: visits);\n", "    let checked_preceding = splice_boundary(context: context, item: preceding_item, removing: no, visits: visits);\n    let reason = 0_u32;\n")
              swap("renderer/layout/splice_boundary.wf", "    let reason = splice_boundary(context: context, item: following_item, removing: no, visits: visits);\n", "    let checked_following = splice_boundary(context: context, item: following_item, removing: no, visits: visits);\n    let reason = 0_u32;\n")
          elif m == "omit-edge":
              swap("renderer/layout/splice_sequence.wf", "let gap = wide_positive +sat wide_negative;", "let gap = 0_i64;")
          elif m == "no-sibling-move":
              swap("renderer/layout/splice_boundary.wf", "let move_y = new_y -sat old_y;", "let move_y = 0_i64;")
          elif m == "live-count-insert":
              swap("renderer/layout/splice.wf", "set layout^.paragraphs = kept_paragraphs +sat added_paragraphs;", "set layout^.paragraphs = kept_paragraphs;")
          elif m == "live-count-remove":
              swap("renderer/layout/splice.wf", "let kept_paragraphs = layout^.paragraphs -sat lost_paragraphs;", "let kept_paragraphs = layout^.paragraphs;")
          elif m == "lose-text-route":
              swap("renderer/layout/splice_publish.wf", "route_write::<TextUnit>(table: &layout^.text_units, at: at, value: text);", "route_write::<TextUnit>(table: &layout^.text_units, at: at, value: absent_text);")
          elif m == "synthetic-checkpoint":
              swap("renderer/layout/splice.wf", "set context^.walk_exact = False();", "set context^.walk_exact = True();")
          elif m == "stale-class-frontier":
              swap("renderer/style/restyle.wf", "let full = unbounded;", "let full = bor(unbounded, traversal^.stale);")
          elif m == "unsafe-admission":
              swap("renderer/layout/boundary.wf", "let fits = bound <= 2147483647_i64;", "let fits = bound <= 68719476735_i64;")
          elif m == "no-positioned-anchor":
              swap("renderer/layout/boundary.wf", "        set context^.children.inner[out_at].anchor.y = context^.children.inner[out_at].anchor.y +sat translation.delta;\n", "")
          elif m == "no-stretch":
              p = Path("renderer/layout/flex.wf")
              source = p.read_text()
              start = source.index("fn flex_stretch(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              old = "  let counted = no_updates();\n"
              assert body.count(old) == 1
              body = body.replace(old, old + "  if setup.updating {\n    return counted;\n  }\n")
              p.write_text(source[:start] + body + source[end:])
          elif m == "no-free-space":
              swap("renderer/layout/flex.wf", "    flex_resolve(lanes: &lanes, first: first, end: end, space: main_inner, gap: main_gap);", "    if setup.updating {\n    } else {\n      flex_resolve(lanes: &lanes, first: first, end: end, space: main_inner, gap: main_gap);\n    }")
          elif m == "no-wrap-rebreak":
              swap("renderer/layout/flex.wf", "  let lines = flex_build_lines(lanes: &lanes, wrapping: wrapping, available: available, gap: main_gap);", "  let line_wrapping = if setup.updating {\n    give False();\n  } else {\n    give wrapping;\n  }\n  let lines = flex_build_lines(lanes: &lanes, wrapping: line_wrapping, available: available, gap: main_gap);")
          elif m == "no-float-floor":
              p = Path("renderer/layout/splice_motion.wf")
              source = p.read_text()
              start = source.index("fn motion_above(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              doc_end = body.index(';') + 1
              p.write_text(source[:start] + body[:doc_end] + "\n  return True();\n}\n" + source[end:])
          elif m == "stale-intrinsic-margins":
              p = Path("renderer/layout/flow.wf")
              source = p.read_text()
              start = source.index("fn intrinsic_flow(")
              end = source.index("\nfn ", start + 1)
              body = source[start:end]
              old = "    let (least, most) = intrinsic_sizes(context: &context^.children.inner[c], styles: styles, document: document, fonts: fonts, picks: picks, viewport: viewport);\n"
              assert body.count(old) == 1
              body = body.replace(old, old + "    let measured_style = context^.children.inner[c].style;\n    let measured_margins = margin_edges(styles: styles, style: measured_style, basis: 0_i32);\n    set context^.children.inner[c].margin_left = measured_margins.left;\n    set context^.children.inner[c].margin_right = measured_margins.right;\n")
              p.write_text(source[:start] + body + source[end:])
          print("applied", m)
          PYEOF
          git diff --stat
      - name: Mutated driver
        run: (cd renderer && "$WFC" --graph modules.wfg --entry layout_oracle -o ../build/layout_mutated)
      - name: Near-limit unsafe-admission falsifier
        if: matrix.mutation == 'unsafe-admission'
        run: |
          python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_base build/near-limit-base
          if python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_base build/near-limit-negative --unsafe > build/near-limit-negative.log 2>&1; then
            echo 'the unsafe-mutation check accepted an unmutated renderer' >&2
            exit 1
          fi
          grep 'unsafe arithmetic admission produced no rebuild difference' build/near-limit-negative.log
          python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_mutated build/near-limit-unsafe --unsafe
      - name: Detect semantic extension mutations
        if: contains(fromJSON('["no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins"]'), matrix.mutation)
        run: |
          set -euo pipefail
          cat > build/semantic-falsify.py <<'PYEOF'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          script, raw, error, status, label = sys.argv[1:]
          status = int(status)
          output = Path(raw).read_text()
          diagnostic = Path(error).read_text()
          if status == 2 and diagnostic.strip() == 'boundary transfer check failed' and not output:
              print('detected:', label, 'boundary transfer check failed')
              raise SystemExit(0)
          if status != 0 or diagnostic:
              print('INVALID:', label, 'driver status', status, diagnostic, file=sys.stderr)
              raise SystemExit(2)
          pattern = r'^(edit \d+ hash [0-9a-f]{16} bytes \d+ inc )DIFF$'
          normalized, differences = re.subn(pattern, r'\1same', output, flags=re.M)
          with tempfile.TemporaryDirectory() as directory:
              checked = Path(directory) / 'normalized.raw'
              checked.write_text(normalized)
              result = subprocess.run([sys.executable, 'research/investigations/incremental-layout/scripts/inctime.py', '--check', script, str(checked)], capture_output=True, text=True)
          if result.returncode != 0:
              print('INVALID:', label, 'oracle protocol', result.stderr, file=sys.stderr)
              raise SystemExit(2)
          if differences:
              print('detected:', label, differences, 'incremental rebuild differences')
              raise SystemExit(0)
          print('NOT DETECTED:', label)
          raise SystemExit(1)
          PYEOF
          s=research/investigations/incremental-layout/scripts
          for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            html=${html/positioned-isolated/positioned}
            python3 "$s/splice-cases.py" build/layout_base "$kind" "build/$kind-case.edits"
          done
          detected=no
          for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            html=${html/positioned-isolated/positioned}
            name="$kind-case"
            script="build/$name.edits"
            base_status=0
            build/layout_base edit "$script" "$s/${html}-case.html" renderer/style/ua.css > "build/$name.base.raw" 2> "build/$name.base.err" || base_status=$?
            negative_status=0
            python3 build/semantic-falsify.py "$script" "build/$name.base.raw" "build/$name.base.err" "$base_status" "$name baseline" > "build/$name.negative.log" 2>&1 || negative_status=$?
            cat "build/$name.negative.log"
            if [ "$negative_status" -ne 1 ]; then
              echo "baseline failed or was accepted as mutation detection: $name" >&2
              exit 1
            fi
            mutant_status=0
            build/layout_mutated edit "$script" "$s/${html}-case.html" renderer/style/ua.css > "build/$name.mutated.raw" 2> "build/$name.mutated.err" || mutant_status=$?
            detection_status=0
            python3 build/semantic-falsify.py "$script" "build/$name.mutated.raw" "build/$name.mutated.err" "$mutant_status" "$name ${{ matrix.mutation }}" || detection_status=$?
            if [ "$detection_status" -eq 0 ]; then
              detected=yes
            elif [ "$detection_status" -ne 1 ]; then
              exit "$detection_status"
            fi
          done
          if [ "$detected" != yes ]; then
            echo "NOT DETECTED: ${{ matrix.mutation }}" >&2
            exit 1
          fi
      - name: Detect
        if: matrix.mutation != 'unsafe-admission' && !contains(fromJSON('["no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins"]'), matrix.mutation)
        run: |
          set +e
          detected=""
          sh research/investigations/concurrency/run.sh fetch >/dev/null 2>&1
          d=build/research/concurrency
          for page in tests/layout/*-cases.html research/investigations/structure-edits/scripts/saturation-case.html "$d/ecma262.html"; do
            sheets=""
            [ "$page" = "$d/ecma262.html" ] && sheets="assets/css/ecmarkup.css=$d/ecma262-ecmarkup.css assets/css/print.css=$d/ecma262-print.css"
            build/layout_base dump 1 "$page" renderer/style/ua.css $sheets > build/a.dump 2>/dev/null
            build/layout_mutated dump 1 "$page" renderer/style/ua.css $sheets > build/b.dump 2>/dev/null
            if ! cmp -s build/a.dump build/b.dump; then echo "detected: $page full-build dump differs"; detected=yes; fi
          done
          s=research/investigations/incremental-layout/scripts
          sh "$s/checkpoint-case.sh" build/layout_base build/checkpoint-case.edits
          for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            html=${html/positioned-isolated/positioned}
            python3 "$s/splice-cases.py" build/layout_base "$kind" "build/$kind-case.edits" || exit 1
          done
          for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case positioned-case:positioned-case positioned-isolated-case:positioned-case flex-case:flex-case transfer-case:transfer-case edit-cost-case:transfer-case edit-baseline-case:style-case edit-height-case:style-case; do
            name=${pair%%:*} html=${pair#*:}
            script="$s/$name.edits"
            if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
            case "$name" in positioned-case|positioned-isolated-case|flex-case|transfer-case|edit-cost-case|edit-baseline-case|edit-height-case) script="build/$name.edits";; esac
            build/layout_base edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.base.raw" || exit 1
            python3 "$s/inctime.py" --check "$script" "build/$name.base.raw" || exit 1
            build/layout_mutated edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.mutated.raw" 2> "build/$name.mutated.err"
            status=$?
            if grep -q 'boundary transfer check failed' "build/$name.mutated.err"; then
              echo "detected: $name boundary transfer check failed"
              detected=yes
            elif [ "$status" -ne 0 ]; then
              cat "build/$name.mutated.err" >&2
              exit "$status"
            elif ! python3 "$s/inctime.py" --check "$script" "build/$name.mutated.raw"; then
              echo "detected: $name incremental identity or path check"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.mutated.raw"
              detected=yes
            fi
          done
          for pair in block-case:block-case style-case:style-case boundary-case:block-case boundary-baseline-case:boundary-baseline-case; do
            name=${pair%%:*} html=${pair#*:}
            build/layout_mutated edit "$s/$name.edits" "$s/$html.html" renderer/style/ua.css > build/m.raw 2> build/m.err
            differs=$(grep -c ' inc DIFF$' build/m.raw)
            [ "$differs" -gt 0 ] && { echo "detected: $name has $differs incremental differences"; detected=yes; }
            grep -q 'boundary transfer check failed' build/m.err && { echo "detected: $name: boundary transfer check failed"; detected=yes; }
          done
          build/layout_base edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css 2>/dev/null | grep -E 'structure path| inc (same|DIFF|refused)$' > build/base.paths
          build/layout_mutated edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css 2>/dev/null | grep -E 'structure path| inc (same|DIFF|refused)$' > build/mutated.paths
          if ! cmp -s build/base.paths build/mutated.paths; then echo "detected: block-case structure paths or edit outcomes differ"; diff build/base.paths build/mutated.paths | head -6; detected=yes; fi
          if [ -z "$detected" ]; then echo "NOT DETECTED: ${{ matrix.mutation }}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mutation == 'unsafe-admission'
        with:
          name: unsafe-admission-evidence
          path: |
            build/near-limit-*/
            build/near-limit-negative.log
      - uses: actions/upload-artifact@v4
        if: always() && contains(fromJSON('["no-positioned-anchor","no-stretch","no-free-space","no-wrap-rebreak","no-float-floor","stale-intrinsic-margins"]'), matrix.mutation)
        with:
          name: semantic-${{ matrix.mutation }}
          path: |
            build/*-case.edits*
            build/*-case.*.raw
            build/*-case.*.err
            build/*-case.negative.log

      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.mutation, 'stationary-')
        with:
          name: ${{ matrix.mutation }}-evidence
          path: |
            build/edit-baseline-case.*
            build/edit-height-case.*
            build/positioned-isolated-case.*
            build/edit-cost-case.*

      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.mutation, 'reference-')
        with:
          name: ${{ matrix.mutation }}-evidence
          path: |
            build/*-case.edits*
            build/*-case.*.raw
            build/*-case.*.err
