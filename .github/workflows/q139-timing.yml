# Temporary Q139 evidence; removed before ready. All measurement runs are hosted.
name: q139-timing
on:
  push:
    branches: [research/m2-q139]
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Summarize an existing evidence artifact without remeasuring
        default: ''
        required: false
      candidate_run:
        description: Current q139-baseline artifact to replace the pilot candidate
        default: ''
        required: false
      driver_run:
        description: Existing hosted driver run for a harness-only retry
        default: ''
        required: false
      count:
        description: Forward edits per kind; begin with one before scaling
        default: '1'
        required: true
      rounds:
        description: Interleaved rounds, alternating build order
        default: '2'
        required: true
      profile_run:
        description: Hosted driver run whose m2 and head drivers are profiled instead of timed
        default: ''
        required: false
jobs:
  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.driver_run == '' && inputs.evidence_run == '' && inputs.profile_run == '') || contains(github.event.head_commit.message, '[q139-timing]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build: [main=8fbc1601785cee70265da1eac4d99589fc6fb67c, m2=95ea4a10832257d0563d2410565900e5d2981118, twin=95ea4a10832257d0563d2410565900e5d2981118, head=HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Drivers with one compiler and toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          make -s compiler
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          pair='${{ matrix.build }}'
          name=${pair%%=*} ref=${pair#*=}
          git worktree add --detach build/tree "$ref"
          (cd build/tree && git submodule update --init)
          (cd build/tree/renderer && "$wfc" --cache "$GITHUB_WORKSPACE/build/timing-cache" --fragments function --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_seq")
          (cd build/tree/renderer && "$wfc" --cache "$GITHUB_WORKSPACE/build/timing-cache" --fragments function --par --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_par")
          echo "$name $(git -C build/tree rev-parse HEAD)" > build/revision.txt
          cat whitefoot.pin >> build/revision.txt
          sha256sum "$wfc" build/layout_oracle_* >> build/revision.txt
          clang --version >> build/revision.txt
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ env.BUILD_NAME }}
          path: |
            build/layout_oracle_seq
            build/layout_oracle_par
            build/revision.txt
  measure:
    needs: build
    if: ${{ !cancelled() && inputs.evidence_run == '' && inputs.profile_run == '' && (needs.build.result == 'success' || inputs.driver_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.driver_run || github.run_id }}
          pattern: driver-*
          path: build/drivers
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37727037303
          name: apollo11-diag-37727037303
          path: build/apollo-archive
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: q139-baseline
          path: build/current
      - name: Adopt the current candidate driver
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/current/layout_base build/drivers/driver-head/layout_oracle_seq
          cp build/current/layout_base_par build/drivers/driver-head/layout_oracle_par
          gh api repos/${{ github.repository }}/actions/runs/${{ inputs.candidate_run }} --jq .head_sha > build/drivers/driver-head/revision.txt
          cat whitefoot.pin >> build/drivers/driver-head/revision.txt
          sha256sum build/drivers/driver-head/layout_oracle_* >> build/drivers/driver-head/revision.txt
      - name: Shared fonts, captures and edits
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          chmod +x build/drivers/driver-*/layout_oracle_*
          mkdir -p build/evidence
          uname -a > build/evidence/machine.txt
          lscpu >> build/evidence/machine.txt
          sh research/investigations/concurrency/run.sh fetch || true
          cp build/apollo-archive/research/concurrency/apollo11* build/research/concurrency/
          sha256sum -c build/apollo-archive/apollo11-inputs.sha256
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html apollo11.html apollo11-modules.css apollo11-site.css; do
            test -s "build/research/concurrency/$file"
          done
          make -s oracle-fonts
          cp build/drivers/driver-main/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5 apollo11
          for page in ecma262 html5 apollo11; do
            python3 research/investigations/incremental-layout/scripts/edits.py "$page" "build/x5/$page.nodes" build/x5/scripts --dump "build/x5/$page.dump" --count '${{ inputs.count || 1 }}'
          done
          find build/x5/scripts build/research/concurrency build/fonts -type f -exec sha256sum {} + > build/evidence/inputs.sha256
      - name: Interleaved all-kind samples
        env:
          ROUNDS: ${{ inputs.rounds || 2 }}
        run: |
          set -euo pipefail
          for page in ecma262 html5 apollo11; do
            for kind in word sentence colour fontsize rootfont block; do
              for mode in seq par; do
                for ((round=1; round<=ROUNDS; round++)); do
                  names='main m2 twin head'
                  if (( round % 2 == 0 )); then names='head twin m2 main'; fi
                  for name in $names; do
                    cp "build/drivers/driver-$name/layout_oracle_$mode" "build/layout_oracle_$mode"
                    rm -rf build/x5/time
                    prefix="build/evidence/$page-$kind-$mode-r$round-$name"
                    ALONE=1 WF_WORKERS=4 /usr/bin/time -p -o "$prefix.wall" sh research/investigations/incremental-layout/run.sh time "$mode" "$page" "$kind" 1 > "$prefix.summary"
                    cat "$prefix.summary"
                    cp build/x5/time/*.txt "$prefix.raw"
                  done
                done
              done
            done
          done
      - name: Paired whole-edit table and input controls
        run: python3 research/investigations/incremental-layout/scripts/percentage-cost.py build/evidence build/x5/scripts --rounds '${{ inputs.rounds || 2 }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q139-edit-cost
          path: |
            build/evidence/
            build/x5/scripts/
            build/research/concurrency/
            build/drivers/driver-*/revision.txt

  summarize:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run }}
          name: q139-edit-cost
          path: build
      - name: Paired whole-edit table and input controls
        run: python3 research/investigations/incremental-layout/scripts/percentage-cost.py build/evidence build/x5/scripts --rounds '${{ inputs.rounds || 2 }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q139-cost-table
          path: build/evidence/table.*

  profile:
    # Diagnosis of the paired edit-cost regressions: where M2 and the
    # candidate spend the same edits' time. Sampling only; no timing claim.
    if: github.event_name == 'workflow_dispatch' && inputs.profile_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.profile_run }}
          pattern: driver-*
          path: build/drivers
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37727037303
          name: apollo11-diag-37727037303
          path: build/apollo-archive
      - name: Profiler, fonts, captures and edits
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" linux-tools-common || sudo apt-get install -y --no-install-recommends linux-tools-azure linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          chmod +x build/drivers/driver-*/layout_oracle_*
          sh research/investigations/concurrency/run.sh fetch || true
          cp build/apollo-archive/research/concurrency/apollo11* build/research/concurrency/
          sha256sum -c build/apollo-archive/apollo11-inputs.sha256
          make -s oracle-fonts
          cp build/drivers/driver-m2/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 apollo11
          mkdir -p build/profile/scripts
          python3 research/investigations/incremental-layout/scripts/edits.py apollo11 build/x5/apollo11.nodes build/profile/scripts --dump build/x5/apollo11.dump --count 60
          python3 research/investigations/incremental-layout/scripts/edits.py ecma262 build/x5/ecma262.nodes build/profile/scripts --dump build/x5/ecma262.dump --count 2
      - name: Sampled edit profiles, M2 and candidate
        run: |
          set -euo pipefail
          d=build/research/concurrency
          for job in apollo11:sentence apollo11:word apollo11:fontsize ecma262:rootfont; do
            page=${job%%:*} kind=${job#*:}
            sheets=(renderer/style/ua.css)
            if [ "$page" = ecma262 ]; then sheets+=(assets/css/ecmarkup.css=$d/ecma262-ecmarkup.css assets/css/print.css=$d/ecma262-print.css); fi
            if [ "$page" = apollo11 ]; then sheets+=("wikibase.client.init&only=styles&skin=vector-2022=$d/apollo11-modules.css" "modules=site.styles&only=styles&skin=vector-2022=$d/apollo11-site.css"); fi
            for name in m2 head; do
              out=build/profile/$page-$kind-$name
              perf record -F 2500 --call-graph dwarf,65528 -o "$out.data" -- build/drivers/driver-$name/layout_oracle_seq edittime "build/profile/scripts/$page-$kind.edits" "$d/$page.html" "${sheets[@]}" > "$out.raw" || echo "perf record status $? for $out"
              perf script -i "$out.data" -F ip,sym 2>/dev/null | gzip > "$out.stacks.gz" || echo "perf script status $? for $out"
              echo "== $page $kind $name $(zcat "$out.stacks.gz" | wc -l) stack lines"
              rm -f "$out.data"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q139-profile
          path: build/profile/
