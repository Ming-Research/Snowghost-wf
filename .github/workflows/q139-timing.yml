# Temporary Q139 evidence; removed before ready. All measurement runs are hosted.
name: q139-timing
on:
  workflow_dispatch:
    inputs:
      count:
        description: Forward edits per kind; begin with one before scaling
        default: '1'
        required: true
      rounds:
        description: Interleaved rounds, alternating build order
        default: '2'
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build: [main=8fbc1601785cee70265da1eac4d99589fc6fb67c, m2=95ea4a10832257d0563d2410565900e5d2981118, twin=95ea4a10832257d0563d2410565900e5d2981118, head=HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Drivers with one compiler and toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          make -s compiler
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          pair='${{ matrix.build }}'
          name=${pair%%=*} ref=${pair#*=}
          git worktree add --detach build/tree "$ref"
          (cd build/tree && git submodule update --init)
          (cd build/tree/renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_seq")
          (cd build/tree/renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_par")
          echo "$name $(git -C build/tree rev-parse HEAD)" > build/revision.txt
          cat whitefoot.pin >> build/revision.txt
          sha256sum "$wfc" build/layout_oracle_* >> build/revision.txt
          clang --version >> build/revision.txt
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ env.BUILD_NAME }}
          path: |
            build/layout_oracle_seq
            build/layout_oracle_par
            build/revision.txt
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-*
          path: build/drivers
      - name: Shared fonts, captures and edits
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          chmod +x build/drivers/driver-*/layout_oracle_*
          mkdir -p build/evidence
          uname -a > build/evidence/machine.txt
          lscpu >> build/evidence/machine.txt
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html apollo11.html apollo11-modules.css apollo11-site.css; do
            test -s "build/research/concurrency/$file"
          done
          make -s oracle-fonts
          cp build/drivers/driver-main/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5 apollo11
          for page in ecma262 html5 apollo11; do
            python3 research/investigations/incremental-layout/scripts/edits.py "$page" "build/x5/$page.nodes" build/x5/scripts --dump "build/x5/$page.dump" --count '${{ inputs.count }}'
          done
          find build/x5/scripts build/research/concurrency build/fonts -type f -exec sha256sum {} + > build/evidence/inputs.sha256
      - name: Interleaved all-kind samples
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          for page in ecma262 html5 apollo11; do
            for kind in word sentence colour fontsize rootfont block; do
              for mode in seq par; do
                for ((round=1; round<=ROUNDS; round++)); do
                  names='main m2 twin head'
                  if (( round % 2 == 0 )); then names='head twin m2 main'; fi
                  for name in $names; do
                    cp "build/drivers/driver-$name/layout_oracle_$mode" "build/layout_oracle_$mode"
                    rm -rf build/x5/time
                    prefix="build/evidence/$page-$kind-$mode-r$round-$name"
                    ALONE=1 WF_WORKERS=4 /usr/bin/time -p -o "$prefix.wall" sh research/investigations/incremental-layout/run.sh time "$mode" "$page" "$kind" 1 > "$prefix.summary"
                    cat "$prefix.summary"
                    cp build/x5/time/*.txt "$prefix.raw"
                  done
                done
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q139-edit-cost
          path: |
            build/evidence/
            build/x5/scripts/
            build/drivers/driver-*/revision.txt
