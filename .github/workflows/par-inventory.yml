# Temporary layout instruction inventory. Archive the evidence and remove
# this workflow and its profile harness before this investigation is ready.
name: par-inventory

on:
  push:
    branches: [research/layout-par-inventory]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: par-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Shared investigation deadline
        run: echo "LAYOUT_PAR_DEADLINE=$(( $(date +%s) + 40 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pinned compiler toolchain, profiler and oracle fonts
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p build/layout-par
          trap 'setup_exit=$?; echo "$setup_exit" > build/layout-par/setup.exit' EXIT
          {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends valgrind binutils fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
            make -s toolchain compiler oracle-fonts
          } > build/layout-par/setup.log 2>&1

      - name: Instruction parser rejection controls
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py --dry-run

      - name: Fresh builds, zero control and bounded single-pass profiles
        timeout-minutes: 26
        run: python3 -I research/investigations/layout-par/profile.py

      - name: Reconciled instruction and compiler-permission inventory
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py summarize --root . --ledger build/layout-par/par-ledger.log --out build/layout-par

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par/
          if-no-files-found: warn
