# Temporary layout instruction inventory. Archive the evidence and remove
# this workflow and its profile harness before this investigation is ready.
name: par-inventory

on:
  push:
    branches: [research/layout-par-inventory]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: par-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Ledger job deadline
        run: echo "LAYOUT_PAR_DEADLINE=$(( $(date +%s) + 52 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pinned ledger compiler toolchain
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p build/layout-par-ledger
          trap 'setup_exit=$?; echo "$setup_exit" > build/layout-par-ledger/setup.exit' EXIT
          {
            make -s toolchain compiler
          } > build/layout-par-ledger/setup.log 2>&1

      - name: Source and instruction parser rejection controls
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py --dry-run

      - name: Fresh parallel build and complete source-to-ledger coverage
        timeout-minutes: 43
        run: python3 -I research/investigations/layout-par/profile.py ledger

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-ledger-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-ledger/
          if-no-files-found: warn

  profile:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Profiling job deadline
        run: echo "LAYOUT_PAR_DEADLINE=$(( $(date +%s) + 40 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pinned sequential compiler toolchain, profiler and oracle fonts
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p build/layout-par
          trap 'setup_exit=$?; echo "$setup_exit" > build/layout-par/setup.exit' EXIT
          {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends valgrind binutils fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
            make -s toolchain compiler oracle-fonts
          } > build/layout-par/setup.log 2>&1

      - name: Instruction and direct-call parser rejection controls
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I research/investigations/layout-par/inventory.py --dry-run
          python3 -I research/investigations/layout-par/profile.py --dry-run

      - name: Fresh sequential build, direct-call check and bounded profiles
        timeout-minutes: 26
        run: python3 -I research/investigations/layout-par/profile.py profile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-profile-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par/
          if-no-files-found: warn

  summarize:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    needs: [ledger, profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-ledger-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-ledger

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-profile-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par

      - name: Require the same source and pinned compiler before joining
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          profile = Path('build/layout-par')
          ledger = Path('build/layout-par-ledger')
          left = json.loads((profile / 'provenance.json').read_text())
          right = json.loads((ledger / 'provenance.json').read_text())
          spec = importlib.util.spec_from_file_location('profile_harness', 'research/investigations/layout-par/profile.py')
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)
          harness.validate_join(left, right, os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'])
          for folder, name in ((profile, 'seq'), (ledger, 'par')):
              driver = folder / ('layout-' + name)
              recorded = json.loads((folder / 'drivers.json').read_text())[name]['sha256']
              if hashlib.sha256(driver.read_bytes()).hexdigest() != recorded:
                  raise ValueError(('downloaded driver hash differs', name))
          (profile / 'join-provenance.json').write_text(json.dumps({
              'status': 'matched', 'workflow_revision': left['workflow_revision'],
              'compiler_sha256': left['compiler_sha256'], 'whitefoot_pin': left['whitefoot_pin']
          }, indent=2) + '\n')
          PY

      - name: Reconciled instruction and compiler-permission inventory
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py summarize --root . --ledger build/layout-par-ledger/par-ledger.log --out build/layout-par

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-summary-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/layout-par/
            build/layout-par-ledger/
          if-no-files-found: warn
