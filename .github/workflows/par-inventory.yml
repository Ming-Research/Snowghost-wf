# Temporary layout instruction inventory. Archive the evidence and remove
# this workflow and its profile harness before this investigation is ready.
name: par-inventory

on:
  push:
    branches: [research/layout-par-inventory]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: par-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Ledger job deadline
        run: echo "LAYOUT_PAR_DEADLINE=$(( $(date +%s) + 52 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pinned ledger compiler toolchain
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p build/layout-par-ledger
          trap 'setup_exit=$?; echo "$setup_exit" > build/layout-par-ledger/setup.exit' EXIT
          {
            make -s toolchain compiler
          } > build/layout-par-ledger/setup.log 2>&1

      - name: Source and instruction parser rejection controls
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py --dry-run

      - name: Fresh parallel build and complete source-to-ledger coverage
        timeout-minutes: 43
        run: python3 -I research/investigations/layout-par/profile.py ledger

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-ledger-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-ledger/
          if-no-files-found: warn

  profile:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        page: [ecma262, html5, apollo11]
    env:
      LAYOUT_PAR_PAGE: ${{ matrix.page }}
    steps:
      - name: Profiling job deadline
        run: echo "LAYOUT_PAR_DEADLINE=$(( $(date +%s) + 40 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pinned sequential compiler toolchain, profiler and oracle fonts
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p "build/layout-par-pages/$LAYOUT_PAR_PAGE"
          trap 'setup_exit=$?; echo "$setup_exit" > "build/layout-par-pages/$LAYOUT_PAR_PAGE/setup.exit"' EXIT
          {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends valgrind binutils fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
            make -s toolchain compiler oracle-fonts
          } > "build/layout-par-pages/$LAYOUT_PAR_PAGE/setup.log" 2>&1

      - name: Instruction and direct-call parser rejection controls
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I research/investigations/layout-par/inventory.py --dry-run
          python3 -I research/investigations/layout-par/profile.py --dry-run

      - name: Fresh sequential build, direct-call check and bounded profiles
        timeout-minutes: 26
        run: python3 -I research/investigations/layout-par/profile.py profile --page "$LAYOUT_PAR_PAGE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-profile-${{ matrix.page }}-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-pages/${{ matrix.page }}/
          if-no-files-found: warn

  summarize:
    if: github.ref == 'refs/heads/research/layout-par-inventory'
    needs: [ledger, profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-ledger-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-ledger

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-profile-ecma262-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-pages/ecma262

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-profile-html5-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-pages/html5

      - uses: actions/download-artifact@v4
        with:
          name: layout-par-profile-apollo11-${{ github.sha }}-${{ github.run_id }}
          path: build/layout-par-pages/apollo11

      - name: Binutils for raw section and function-table extraction
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p build/layout-par
          {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends binutils
            objdump --version
            objcopy --version
          } > build/layout-par/summary-binutils.log 2>&1

      - name: Require matching provenance, selected section bytes and normalized functions
        timeout-minutes: 3
        run: |
          python3 -I - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import shutil
          from pathlib import Path
          out = Path('build/layout-par')
          profiles = Path('build/layout-par-pages')
          ledger = Path('build/layout-par-ledger')
          right = json.loads((ledger / 'provenance.json').read_text())
          spec = importlib.util.spec_from_file_location('profile_harness', 'research/investigations/layout-par/profile.py')
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)
          ledger_hash = hashlib.sha256((ledger / 'layout-par').read_bytes()).hexdigest()
          if ledger_hash != json.loads((ledger / 'drivers.json').read_text())['par']['sha256']:
              raise ValueError('downloaded ledger driver hash differs')
          reference = json.loads((profiles / 'ecma262/provenance.json').read_text())
          driver_identities = {}
          for page in harness.PAGES:
              folder = profiles / page
              left = json.loads((folder / 'provenance.json').read_text())
              harness.validate_join(left, right, os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], expected_page=page)
              harness.validate_join(left, reference, os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], include_inputs=True)
              actual = hashlib.sha256((folder / 'layout-seq').read_bytes()).hexdigest()
              recorded = json.loads((folder / 'drivers.json').read_text())['seq']['sha256']
              if actual != recorded:
                  raise ValueError(('downloaded sequential driver hash differs', page))
              identity = harness.extract_driver_identity(folder / 'layout-seq', folder)
              if identity['file_sha256'] != actual:
                  raise ValueError(('driver changed between integrity check and extraction', page))
              driver_identities[page] = identity
          common = harness.validate_page_drivers(driver_identities)
          out.mkdir(parents=True, exist_ok=True)
          (out / 'driver-identities.json').write_text(json.dumps(driver_identities, indent=2) + '\n')
          for page in harness.PAGES:
              for name in (page + '.callgrind', page + '.raw', page + '-zero.callgrind', page + '-zero.raw'):
                  shutil.copyfile(profiles / page / name, out / name)
          (out / 'join-provenance.json').write_text(json.dumps({
              'status': 'matched', 'workflow_revision': reference['workflow_revision'],
              'compiler_sha256': reference['compiler_sha256'], 'whitefoot_pin': reference['whitefoot_pin'],
              'driver_identities': driver_identities, **common
          }, indent=2) + '\n')
          PY

      - name: Reconciled instruction and compiler-permission inventory
        timeout-minutes: 1
        run: python3 -I research/investigations/layout-par/inventory.py summarize --root . --ledger build/layout-par-ledger/par-ledger.log --out build/layout-par

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-par-summary-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/layout-par/
            build/layout-par-ledger/
            build/layout-par-pages/
          if-no-files-found: warn
