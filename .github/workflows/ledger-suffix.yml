# Temporary, research branch only: the --par-ledger verdicts for
# layout.translate_reference_owner_suffix (renderer/layout/reference.wf:467)
# at research/m2-layout's head, for the Whitefoot call-grain session.
name: ledger-suffix
on:
  push:
    branches: [research/ledger-suffix]
    paths: [.github/workflows/ledger-suffix.yml]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Ledger and emission for translate_reference_owner_suffix
        run: |
          set -euo pipefail
          make -s compiler
          make -s toolchain
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$PWD/build/whitefoot/$pin/whitefootc
          mkdir -p results
          if ! (cd renderer && "$wfc" --par --par-ledger --emit-llvm --graph modules.wfg --entry layout_oracle -o "$PWD/../results/layout_oracle" > ../results/ledger.txt 2> ../results/stderr.txt); then tail -40 results/stderr.txt; exit 1; fi
          echo "release $pin"
          grep -nE 'reference\.wf:(467|468|469|1[0-9]|2[0-9])' results/ledger.txt | grep -E 'reference\.wf:(467|468|469|470|471|472|473|474|475|476|477|478|479|480|481|482|483|484|485|486|487|488|489|490|491|492|)\b' || true
          grep -n 'translate_reference_owner_suffix' results/ledger.txt || true
          find results -name '*.ll' | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-suffix
          path: results/ledger.txt
