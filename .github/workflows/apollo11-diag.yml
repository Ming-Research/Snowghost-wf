# Temporary diagnosis; remove before integration.
name: apollo11-diag
on:
  push:
    branches: [research/m2-apollo11-fix]
  workflow_dispatch:
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[apollo]') || contains(github.event.head_commit.message, '[apollo-main]')
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ contains(github.event.head_commit.message, '[apollo-main]') && fromJSON('["8fbc160"]') || fromJSON('["head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Select renderer revision
        run: |
          if [ '${{ matrix.revision }}' != head ]; then
            git checkout '${{ matrix.revision }}'
            git submodule update --init
          fi
          git rev-parse HEAD
          cat whitefoot.pin
      - name: Toolchain and fonts
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
      - name: Main pin's LLVM prerequisite
        if: matrix.revision != 'head'
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22 >/dev/null
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          /usr/bin/clang --version
      - uses: actions/download-artifact@v4
        with:
          name: apollo11-diag-37727037303
          run-id: 37727037303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build
      - name: Verify original page and scripts
        run: |
          echo '1405f09a8888e2854ba8785a4da6b50dbd3951fb56ec9eca7f2e20aa3fe78dc4  build/research/concurrency/apollo11.html' | sha256sum -c
          cat > build/apollo-fix-inputs.sha256 <<'HASHES'
          cc2e64f8f1706af7f505ec69b6c9807cb05a743f7887ccbf8c7e104e1f41a9f8  build/research/concurrency/apollo11-modules.css
          a292ccfd0f47accce300fd2febc776a88c2cd18b82f3f4cc8fad01fbdb9ca1d8  build/research/concurrency/apollo11-site.css
          b30996fe56e4323fa7fe442454871ecb599163ab011b94c28fe6c29bb1861e78  build/x5/scripts/apollo11-block.edits
          5b631ea15f6b326db66fa88de8c00c95d89226f338a36f29f0b0f41fe7759196  build/x5/scripts/apollo11-sentence.edits
          HASHES
          sha256sum -c build/apollo-fix-inputs.sha256
      - name: Build pinned drivers
        run: |
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          time (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          time (cd renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par)
      - name: Build the reduced case's pre-fix comparator
        if: matrix.revision == 'head'
        run: |
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cp renderer/layout/reference.wf build/reference.fixed.wf
          git show cf12c609:renderer/layout/reference.wf > renderer/layout/reference.wf
          time (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_before)
          cp build/reference.fixed.wf renderer/layout/reference.wf
      - name: Regression fails before the repair and both fixtures pass after
        if: matrix.revision == 'head'
        env:
          WF_WORKERS: 4
        run: |
          set -euo pipefail
          mkdir -p build/apollo-fix
          s=research/investigations/incremental-layout/scripts
          time build/layout_before edit "$s/sentence-convergence-case.edits" "$s/sentence-convergence-case.html" renderer/style/ua.css > build/apollo-fix/sentence-convergence.before.raw
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          raw = Path('build/apollo-fix/sentence-convergence.before.raw').read_text()
          assert re.findall(r'^edit (\d+) hash [0-9a-f]{16} bytes \d+ inc DIFF$', raw, re.M) == ['1', '2'], raw
          print('Both regression edits reproduce the pre-fix identity failure')
          PYEOF
          for name in sentence-convergence-case sibling-margin-case; do
            for mode in seq par; do
              time build/layout_oracle_$mode edit "$s/$name.edits" "$s/$name.html" renderer/style/ua.css > "build/apollo-fix/$name.$mode.raw"
              python3 "$s/inctime.py" --check "$s/$name.edits" "build/apollo-fix/$name.$mode.raw"
              if [ "$name" = sibling-margin-case ]; then
                python3 "$s/splice-cases.py" --check-paths "$s/$name.edits.paths" "build/apollo-fix/$name.$mode.raw"
              fi
              cat "build/apollo-fix/$name.$mode.raw"
            done
          done
      - name: Sample then complete sentence and block diagnosis
        env:
          WF_WORKERS: 4
        run: |
          set -euo pipefail
          mkdir -p build/apollo-fix
          head -2 build/x5/scripts/apollo11-sentence.edits > build/apollo-fix/sample.edits
          args=(build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css')
          time build/layout_oracle_seq edit build/apollo-fix/sample.edits "${args[@]}" > build/apollo-fix/sample.raw
          python3 research/investigations/incremental-layout/scripts/inctime.py --check build/apollo-fix/sample.edits build/apollo-fix/sample.raw
          status=0
          for kind in sentence block; do
            for mode in seq par; do
              time build/layout_oracle_$mode edit build/x5/scripts/apollo11-$kind.edits "${args[@]}" > build/apollo-fix/$kind.$mode.raw
              python3 research/investigations/incremental-layout/scripts/inctime.py --check build/x5/scripts/apollo11-$kind.edits build/apollo-fix/$kind.$mode.raw || status=1
              grep -E 'structure path| inc (same|DIFF|refused)$' build/apollo-fix/$kind.$mode.raw
            done
          done
          exit "$status"
      - name: Covered sibling frontiers expose the unchanged ancestor refusal
        if: matrix.revision == 'head'
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          for mode in ('seq', 'par'):
              raw = Path(f'build/apollo-fix/block.{mode}.raw').read_text()
              rows = re.findall(r'^structure path (\d+) splice ([01]) reason (\d+)$', raw, re.M)
              assert len(rows) == 60, rows
              paths = {int(number): (int(splice), int(reason)) for number, splice, reason in rows}
              for number in (7, 8, 29, 30, 43, 44):
                  assert paths[number] == (0, 7), (mode, number, paths[number])
              print(mode, 'all six retained sibling frontiers pass; percentage-height preflight remains reason 7')
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apollo-fix-${{ matrix.revision }}-${{ github.run_id }}
          path: |
            build/apollo-fix/
            build/layout_oracle_seq
            build/layout_oracle_par
