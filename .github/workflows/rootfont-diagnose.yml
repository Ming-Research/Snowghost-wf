# Temporary one-edit diagnosis for the HTML5 parallel regression; removed after capture.
name: rootfont-diagnose
on:
  push:
    branches: [research/m2-frag-a]
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed bisect-hosted run supplying the unchanged drivers and script'
        required: true
      builds:
        description: 'Driver names to inspect on one hosted machine'
        default: 'good bad'
        required: true
jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rootfont-profile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '37899580622' }}
          pattern: driver-*
          path: build/drivers
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '37899580622' }}
          name: edit-cost-evidence
          path: build/source-evidence
      - name: Tools, fonts and shared input
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-azure fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          chmod +x build/drivers/driver-*/layout_oracle_*
          mkdir -p build/rootfont-profile
          uname -a > build/rootfont-profile/machine.txt
          lscpu >> build/rootfont-profile/machine.txt
          perf --version >> build/rootfont-profile/machine.txt
          sh research/investigations/concurrency/run.sh fetch || true
          test -s build/research/concurrency/html5.html
          make -s oracle-fonts
          head -n 2 build/source-evidence/x5/scripts/html5-rootfont.edits > build/rootfont-profile/one.edits
          sha256sum build/rootfont-profile/one.edits build/research/concurrency/html5.html renderer/style/ua.css > build/rootfont-profile/inputs.sha256
      - name: Native sample, emitted calls and one-edit four-worker profile
        env:
          PROFILE_BUILDS: ${{ inputs.builds || 'good bad' }}
        run: |
          set -euo pipefail
          out=build/rootfont-profile
          sudo sysctl kernel.perf_event_paranoid=-1
          if ! mountpoint -q /sys/kernel/tracing; then sudo mount -t tracefs tracefs /sys/kernel/tracing; fi
          for name in $PROFILE_BUILDS; do
            exe=$(realpath "build/drivers/driver-$name/layout_oracle_par")
            cp "build/drivers/driver-$name/revision.txt" "$out/$name-revision.txt"
            nm -n "$exe" > "$out/$name-symbols.txt"
            for symbol in $(awk '$3 ~ /frontier_prepare|prepare_marked|break_all|wf__par_recursion_budget|wf__par_split_budget/ {print $3}' "$out/$name-symbols.txt"); do
              objdump -d --no-show-raw-insn --disassemble="$symbol" "$exe" >> "$out/$name-calls.txt"
            done
            for workers in 1 4; do
              WF_WORKERS=$workers /usr/bin/time -p -o "$out/$name-w$workers.time" "$exe" edittime "$out/one.edits" build/research/concurrency/html5.html renderer/style/ua.css > "$out/$name-w$workers.raw"
              python3 research/investigations/incremental-layout/scripts/inctime.py "$out/one.edits" "$out/$name-w$workers.raw"
              cat "$out/$name-w$workers.time"
            done
            sudo perf probe -x "$exe" --add 'rootfont:enter=wf_layout.update' --add 'rootfont:leave=wf_layout.update%return'
            sudo env WF_WORKERS=4 perf record -c 1 -e 'cpu-clock/period=2000000/u' -e rootfont:enter -e rootfont:leave__return -m 4096 -o "$out/$name.perf.data" -- "$exe" edittime "$out/one.edits" build/research/concurrency/html5.html renderer/style/ua.css > "$out/$name-profile.raw" 2> "$out/$name-perf.err"
            sudo perf script --ns -i "$out/$name.perf.data" > "$out/$name-events.txt" 2> "$out/$name-script.err"
            sudo perf script --show-lost-events -D -i "$out/$name.perf.data" > "$out/$name-records.txt" 2> "$out/$name-records.err"
            python3 research/investigations/incremental-layout/scripts/inctime.py "$out/one.edits" "$out/$name-profile.raw"
            sudo perf probe --del 'rootfont:*'
          done
      - name: Make profiler output readable by artifact collection
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build/rootfont-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfont-profile
          path: build/rootfont-profile/
  historical-syntax:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [b4ebd94d13e85e5db9a3d9d585752b7f3a3b2770, a32573fd23d743f86ca279d574360b30ac7dc4dc]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record admission of the intervening historical sources
        env:
          SOURCE_REVISION: ${{ matrix.source }}
        run: |
          set -euo pipefail
          git worktree add --detach build/historical "$SOURCE_REVISION"
          git -C build/historical submodule update --init
          echo 'release = wf-b2209fd31035' > build/historical/whitefoot.pin
          git -C build/historical -c user.name=Claude -c user.email=noreply@anthropic.com commit -am 'Diagnostic compiler pin' -m "$(git log -1 --format='%(trailers:key=Co-Authored-By)')"
          mkdir -p build/historical-evidence
          git -C build/historical show --format=fuller HEAD > build/historical-evidence/pin-only.patch
          make -s -C build/historical compiler
          wfc=$(realpath "$(ls build/historical/build/whitefoot/*/whitefootc)")
          status=0
          (cd build/historical/renderer && "$wfc" --graph modules.wfg --check-module pkg::layout) > build/historical-evidence/admission.txt 2>&1 || status=$?
          printf '%s\n' "$status" > build/historical-evidence/exit-code.txt
          cat build/historical-evidence/admission.txt
          echo "source=$SOURCE_REVISION compiler=wf-b2209fd31035 exit=$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-${{ matrix.source }}
          path: build/historical-evidence/
  emission:
    if: contains(github.event.head_commit.message, '[rootfont-ir]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Reduce the permitted recursive pair and capture unoptimized emission
        run: |
          set -euo pipefail
          git worktree add --detach build/emission HEAD
          git -C build/emission submodule update --init
          echo 'release = wf-b2209fd31035' > build/emission/whitefoot.pin
          git -C build/emission -c user.name=Claude -c user.email=noreply@anthropic.com commit -am 'Diagnostic compiler pin' -m "$(git log -1 --format='%(trailers:key=Co-Authored-By)')"
          make -s -C build/emission compiler
          wfc=$(realpath "$(ls build/emission/build/whitefoot/*/whitefootc)")
          mkdir -p build/emission-evidence
          cat > build/emission-evidence/pair.wf <<'WFEOF'
          enum Frontier {
            doc "A sparse directory over stable element slots.";
            Vacant();
            Mark();
            Fork(left: Box<Frontier>, right: Box<Frontier>);
          }
          fn visit(frontier: &Frontier, values: &[u64], span: u64) -> ok: Bool reads(frontier), writes(values) {
            doc "Visits independent leaves and joins only their completion results.";
            let count = values^.len;
            match frontier^ {
              Vacant() => { return True(); }
              Mark() => {
                if 0_u64 < count {
                  set values^[0_u64] = values^[0_u64] +sat 1_u64;
                  return True();
                }
                return False();
              }
              Fork(left: left_tree, right: right_tree) => {
                let half = span / 2_u64;
                let middle = imin(half, count);
                let left_ok = visit(frontier: &left_tree^.inner, values: &values^[0_u64..middle], span: half);
                let right_ok = visit(frontier: &right_tree^.inner, values: &values^[middle..count], span: half);
                let both_ok = band(left_ok, right_ok);
                return both_ok;
              }
            }
          }
          WFEOF
          "$wfc" --par --par-ledger --emit-llvm -o build/emission-evidence/pair.ll build/emission-evidence/pair.wf > build/emission-evidence/pair-ledger.txt 2>&1
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('build/emission-evidence/pair.wf')
          owning = p.read_text().replace('values: &[u64]', 'values: &[Box<u64>]')
          owning = owning.replace('set values^[0_u64] = values^[0_u64] +sat 1_u64;', 'let fresh = box_new::<u64>(value: 1_u64);\n        set values^[0_u64] = move fresh;')
          p.with_name('owning-pair.wf').write_text(owning)
          PYEOF
          "$wfc" --par --par-ledger --emit-llvm -o build/emission-evidence/owning-pair.ll build/emission-evidence/owning-pair.wf > build/emission-evidence/owning-pair-ledger.txt 2>&1
          (cd build/emission/renderer && "$wfc" --par --par-ledger --emit-llvm --graph modules.wfg --function pkg::layout::frontier_prepare -o "$GITHUB_WORKSPACE/build/emission-evidence/frontier.ll") > build/emission-evidence/frontier-ledger.txt 2>&1
          sha256sum "$wfc" > build/emission-evidence/compiler.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfont-emission
          path: build/emission-evidence/
