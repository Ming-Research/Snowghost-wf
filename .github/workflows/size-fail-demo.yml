# Temporary: shows that binary-size-check fails over its limit. Remove before
# the branch is ready (board item sg-target-binary-size).
name: size-fail-demo

on:
  push:
    branches: [research/binary-size]

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pinned compiler and host toolchain
        run: make -s toolchain compiler
      - name: The check fails with a 1 MB limit
        run: |
          if make binary-size-check BINARY_SIZE_LIMIT=1048576; then
            echo "binary-size-check passed under a 1 MB limit; it cannot detect an oversized binary" >&2
            exit 1
          fi
          echo "binary-size-check failed under a 1 MB limit, as it must"
