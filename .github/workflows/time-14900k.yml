# E1's per-edit timing of Snowghost and Chromium on the owner's i9-14900K
# runner (research/investigations/engine-comparison). Every engine runs on
# the same machine with the same 47 font files. The runner has no sudo, so
# Chromium's libraries and the fonts are unpacked from their Ubuntu packages
# into ~/snowghost-deps, and apollo11 is captured once into ~/snowghost-data
# (Wikimedia serves no revision-stable bytes; concurrency/run.sh). The
# parameters are the env block below, each overridable by the dispatch input
# of the same name in lower case.
name: time-14900k

on:
  workflow_dispatch:
    inputs:
      builds: {type: string, required: false}
      page_list: {type: string, required: false}
      edit_kinds: {type: string, required: false}
      edit_modes: {type: string, required: false}
      chromium: {type: string, required: false}
      full: {type: string, required: false}
      rounds: {type: string, required: false}
      time: {type: string, required: false}
      profile: {type: string, required: false}
      pair: {type: string, required: false}

concurrency:
  group: time-14900k
  cancel-in-progress: false

env:
  # name=ref: each build is compiled from its own checkout of ref.
  BUILDS: ${{ inputs.builds || 'base=bc149ba twin=bc149ba cand=fc391bd' }}
  # The names avoid PAGES, MODES and RUNS, which the run.sh scripts read.
  PAGE_LIST: ${{ inputs.page_list || 'ecma262 html5' }}
  EDIT_KINDS: ${{ inputs.edit_kinds || '' }}
  # seq, or par4: the --par build at WF_WORKERS=4.
  EDIT_MODES: ${{ inputs.edit_modes || 'seq par4' }}
  EDIT_RUNS: "3"
  CHROMIUM: ${{ inputs.chromium || '0' }}
  # 1 also times every build's full style and layout stages (style/run.sh
  # time and layout/run.sh time, par at four workers).
  FULL: ${{ inputs.full || '1' }}
  # Rounds: above 1, each round times every build once in BUILDS order, the
  # full stages with one run each and every edit script with one process run
  # each, so the builds interleave. Two names for one ref give the noise
  # control. A positive integer.
  ROUNDS: ${{ inputs.rounds || '3' }}
  # 0 only builds and keeps the drivers. A build's drivers are kept in
  # ~/snowghost-data/drivers under its commit and pin and reused from there,
  # so a compiler upgrade can be timed after the runner's clang changed:
  # whitefootc runs /usr/bin/clang, which must be its release's LLVM major
  # (whitefoot-kit/downstream.md).
  TIME: ${{ inputs.time || '1' }}
  # Names from BUILDS whose box build on html5 is profiled with perf (temporary).
  PROFILE: ${{ inputs.profile || '' }}
  # C3 attribution (temporary): the full-stage table covers PAGE_LIST at
  # FULL_REPS repetitions and FULL_MODES only, without the style stage, and
  # the profile covers PROFILE_MODES.
  FULL_REPS: "5"
  # The gran session's edit pair (research/gran-diag/pair.edits), timed per
  # build at seq W1 and par W1/W2/W4, interleaved over three rounds (temporary).
  PAIR: ${{ inputs.pair || '0' }}
  FULL_MODES: boxes text layout
  PROFILE_MODES: boxes layout

jobs:
  time:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chromium, its libraries and the fonts, without sudo
        run: |
          set -euo pipefail
          deps=$HOME/snowghost-deps
          mkdir -p "$deps/debs"
          cd "$deps/debs"
          fonts="fonts-dejavu-core fonts-dejavu-mono fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol"
          libs="libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 libfontconfig1 libfreetype6"
          wanted=$(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances $libs | grep -E '^[a-z0-9]' | sort -u)
          for p in $fonts; do
            ls "${p}"_*.deb >/dev/null 2>&1 || apt-get download "$p" >/dev/null 2>&1 || echo "not downloadable: $p"
          done
          for p in $wanted; do
            if dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed'; then continue; fi
            ls "${p}"_*.deb >/dev/null 2>&1 || apt-get download "$p" >/dev/null 2>&1 || echo "not downloadable: $p"
          done
          for d in *.deb; do dpkg -x "$d" "$deps/root"; done
          npx -y playwright@1.56.0 install chromium >/dev/null
          chrome=$(ls -d "$HOME"/.cache/ms-playwright/chromium-1194/chrome-linux*/chrome)
          lib="$deps/root/usr/lib/x86_64-linux-gnu:$deps/root/lib/x86_64-linux-gnu"
          if LD_LIBRARY_PATH=$lib ldd "$chrome" | grep 'not found'; then exit 1; fi
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_LIBS=$lib" >> "$GITHUB_ENV"
          echo "DEPS=$deps" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=$lib "$chrome" --version

      - name: Pages
        run: |
          set -euo pipefail
          data=build/research/concurrency
          sh research/investigations/concurrency/run.sh fetch || true
          for f in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do test -f "$data/$f"; done
          capture=$HOME/snowghost-data/apollo11-capture-1
          if [ ! -f "$capture/SHA256SUMS" ]; then
            mkdir -p "$capture"
            sh research/investigations/concurrency/run.sh fetch 2>/dev/null || true
            sed -n 's/^\(apollo11[^ ]*\) \([^ ]*\) .*/\1 \2/p' research/investigations/concurrency/run.sh | while read -r name url; do
              curl -fsSL --retry 3 -o "$capture/$name" "$url"
            done
            (cd "$capture" && sha256sum apollo11* > SHA256SUMS)
          fi
          (cd "$capture" && sha256sum -c SHA256SUMS)
          cp "$capture"/apollo11* "$data/"
          rm -f "$data"/*.unverified
          echo "pages:"; (cd "$data" && sha256sum ecma262* html5.html apollo11*)

      - name: Build the drivers
        run: |
          set -euo pipefail
          case "$ROUNDS" in ''|*[!0-9]*|0*) echo "ROUNDS must be a positive integer, not '$ROUNDS'" >&2; exit 1 ;; esac
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p build/drivers "$HOME/snowghost-data/wf-cache"
          for pair in $BUILDS; do
            name=${pair%%=*} ref=${pair#*=}
            tree=build/trees/$name
            rm -rf "$tree"; git worktree prune
            git worktree add -q --detach "$tree" "$ref"
            (cd "$tree" && git submodule update -q --init whitefoot-kit design/skill 2>/dev/null || git submodule update -q --init)
            make -s -C "$tree" compiler
            pin=$(sed -n 's/^release = //p' "$tree/whitefoot.pin")
            kept=$HOME/snowghost-data/drivers/$(git -C "$tree" rev-parse --short=12 HEAD)-$pin
            drivers="layout-seq layout-par style_oracle style_oracle_par layout_oracle layout_oracle_par"
            if [ ! -f "$kept/toolchain.txt" ]; then
              if grep -q '^toolchain-check' "$tree/whitefoot-kit/whitefoot.mk"; then make -s -C "$tree" toolchain-check; fi
              wfc=$(realpath "$(ls "$tree"/build/whitefoot/*/whitefootc | head -1)")
              mkdir -p "$kept.tmp"
              (cd "$tree/renderer" && "$wfc" --cache "$HOME/snowghost-data/wf-cache" --fragments function --graph modules.wfg --entry layout_oracle -o "$kept.tmp/layout-seq")
              (cd "$tree/renderer" && "$wfc" --cache "$HOME/snowghost-data/wf-cache" --fragments function --par --graph modules.wfg --entry layout_oracle -o "$kept.tmp/layout-par")
              for entry in style_oracle layout_oracle; do
                (cd "$tree/renderer" && "$wfc" --cache "$HOME/snowghost-data/wf-cache" --fragments function --graph modules.wfg --entry $entry -o "$kept.tmp/$entry")
                (cd "$tree/renderer" && "$wfc" --cache "$HOME/snowghost-data/wf-cache" --fragments function --par --graph modules.wfg --entry $entry -o "$kept.tmp/${entry}_par")
              done
              { /usr/bin/clang --version | head -1; ld.lld --version | head -1; } > "$kept.tmp/toolchain.txt"
              rm -rf "$kept"; mv "$kept.tmp" "$kept"
            fi
            mkdir -p "$tree/build"
            cp "$kept/layout-seq" "build/drivers/$name-seq"
            cp "$kept/layout-par" "build/drivers/$name-par"
            for d in style_oracle style_oracle_par layout_oracle layout_oracle_par; do cp "$kept/$d" "$tree/build/$d"; done
            echo "$name $ref $(git -C "$tree" rev-parse --short HEAD) $pin [$(head -1 "$kept/toolchain.txt")] seq $(sha256sum < build/drivers/$name-seq | cut -c1-16) par $(sha256sum < build/drivers/$name-par | cut -c1-16)"
          done

      - name: Fonts and edit scripts
        if: env.TIME == '1'
        run: |
          set -euo pipefail
          make -s oracle-fonts FONT_ROOT="$DEPS/root"
          ls build/fonts | wc -l
          first=${BUILDS%% *}; first=${first%%=*}
          cp "build/drivers/$first-seq" build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare $PAGE_LIST
          wc -l build/x5/scripts/*.edits

      - name: Time the gran edit pair (temporary)
        if: env.PAIR == '1'
        run: |
          set -euo pipefail
          mkdir -p results/pair
          git fetch -q origin research/gran-diag
          git show origin/research/gran-diag:research/gran-diag/pair.edits > build/pair.edits
          data=build/research/concurrency
          for round in 1 2 3; do
            for pair in $BUILDS; do
              name=${pair%%=*}
              for setting in seq-1 par-1 par-2 par-4; do
                kind=${setting%%-*} workers=${setting#*-}
                WF_WORKERS=$workers "build/drivers/$name-$kind" edittime build/pair.edits "$data/ecma262.html" renderer/style/ua.css "assets/css/ecmarkup.css=$data/ecma262-ecmarkup.css" "assets/css/print.css=$data/ecma262-print.css" > "results/pair/$name-$setting-$round.raw"
              done
            done
          done
          # Scheduler reports come from one extra untimed pass, so they cannot perturb the timed rounds.
          for pair in $BUILDS; do
            name=${pair%%=*}
            for workers in 1 2 4; do
              WF_SCHED_REPORT=2 WF_WORKERS=$workers "build/drivers/$name-par" edittime build/pair.edits "$data/ecma262.html" renderer/style/ua.css "assets/css/ecmarkup.css=$data/ecma262-ecmarkup.css" "assets/css/print.css=$data/ecma262-print.css" > /dev/null 2> "results/pair/$name-par-$workers.sched"
            done
          done
          python3 - <<'PY'
          import glob, re, statistics, collections
          v = collections.defaultdict(list)
          for f in sorted(glob.glob('results/pair/*.raw')):
              name, setting, rnd = re.match(r'.*/(\w+)-(\w+-\d)-(\d)\.raw$', f).groups()
              us = [int(x) for x in re.findall(r'^edit \d+ us (\d+)', open(f).read(), re.M)]
              v[(name, setting)].append(statistics.median(us))
          for k in sorted(v):
              print(k[0], k[1], 'median us/edit per round', v[k], 'best', min(v[k]))
          PY
          for f in results/pair/*.sched; do echo "== $f"; tail -8 "$f"; done

      - name: Time Snowghost
        if: env.TIME == '1'
        run: |
          set -euo pipefail
          mkdir -p results
          # time_one NAME MODE PAGE KIND RUNS OUT: one build's edit script.
          time_one() {
            cp "build/drivers/$1-seq" build/layout_oracle_seq
            cp "build/drivers/$1-par" build/layout_oracle_par
            rm -rf build/x5/time
            if [ "$2" = par4 ]; then
              ALONE=1 WF_WORKERS=4 sh research/investigations/incremental-layout/run.sh time par "$3" "$4" "$5" | tee "$6"
            else
              ALONE=1 sh research/investigations/incremental-layout/run.sh time seq "$3" "$4" "$5" | tee "$6"
            fi
            mkdir -p "results/raw/$1-$2" && cp build/x5/time/* "results/raw/$1-$2/"
          }
          for mode in $EDIT_MODES; do
            for page in $PAGE_LIST; do
              for kind in $EDIT_KINDS; do
                if [ "$ROUNDS" -gt 1 ]; then
                  for round in $(seq "$ROUNDS"); do
                    for pair in $BUILDS; do
                      name=${pair%%=*}
                      time_one "$name" "$mode" "$page" "$kind" 1 "results/$name-$mode-$page-$kind-$round.txt"
                    done
                  done
                else
                  for pair in $BUILDS; do
                    name=${pair%%=*}
                    time_one "$name" "$mode" "$page" "$kind" "$EDIT_RUNS" "results/$name-$mode-$page-$kind.txt"
                  done
                fi
              done
            done
          done

      - name: Time Chromium
        if: env.CHROMIUM == '1' && env.TIME == '1'
        run: |
          set -euo pipefail
          data=build/research/concurrency
          printf '<?xml version="1.0"?>\n<fontconfig><dir>%s</dir><cachedir>%s</cachedir></fontconfig>\n' "$GITHUB_WORKSPACE/build/fonts" "$DEPS/fc-cache" > "$DEPS/fonts.conf"
          export FONTCONFIG_FILE=$DEPS/fonts.conf LD_LIBRARY_PATH=$CHROME_LIBS CHROME_ARGS=--no-sandbox
          for page in $PAGE_LIST; do
            case $page in
              ecma262) sheets="assets/css/ecmarkup.css=$data/ecma262-ecmarkup.css assets/css/print.css=$data/ecma262-print.css" ;;
              html5) sheets="" ;;
              apollo11) sheets="wikibase.client.init&only=styles&skin=vector-2022=$data/apollo11-modules.css modules=site.styles&only=styles&skin=vector-2022=$data/apollo11-site.css" ;;
            esac
            for kind in $EDIT_KINDS; do
              node research/investigations/engine-comparison/chromium.mjs "$data/$page.html" "build/x5/$page.nodes" "build/x5/scripts/$page-$kind.edits" $sheets | tee "results/chromium-$page-$kind.txt" | tail -2
            done
          done

      - name: Profile the box build (perf, temporary)
        if: env.PROFILE != ''
        run: |
          set -euo pipefail
          mkdir -p "$DEPS/perfdebs" && cd "$DEPS/perfdebs"
          k=$(uname -r)
          for p in linux-tools-common "linux-tools-$k" "linux-tools-${k%-generic}"; do ls "${p}"_*.deb >/dev/null 2>&1 || apt-get download "$p" >/dev/null 2>&1 || true; done
          wanted=$(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances "linux-tools-${k%-generic}" 2>/dev/null | grep -E '^[a-z0-9]' | sort -u)
          for p in $wanted; do
            if dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed'; then continue; fi
            ls "${p}"_*.deb >/dev/null 2>&1 || apt-get download "$p" >/dev/null 2>&1 || true
          done
          for d in *.deb; do dpkg -x "$d" "$DEPS/perfroot"; done
          perf=$(find "$DEPS/perfroot" -type f -name perf | head -1)
          lib="$DEPS/perfroot/usr/lib/x86_64-linux-gnu:$DEPS/perfroot/lib/x86_64-linux-gnu"
          cd "$GITHUB_WORKSPACE"
          mkdir -p results
          page=build/research/concurrency/html5.html
          for name in $PROFILE; do
            drv="build/drivers/$name-seq"
            for mode in $PROFILE_MODES; do
              LD_LIBRARY_PATH=$lib "$perf" stat -e task-clock,page-faults -o "results/perf-stat-$mode-$name.txt" "$drv" "$mode" "$FULL_REPS" "$page" renderer/style/ua.css > /dev/null
              LD_LIBRARY_PATH=$lib "$perf" record -F 1999 -g -o "build/$name-$mode.perf" "$drv" "$mode" "$FULL_REPS" "$page" renderer/style/ua.css > /dev/null
              LD_LIBRARY_PATH=$lib "$perf" report -i "build/$name-$mode.perf" --no-children --stdio --percent-limit 0.5 -g none 2>/dev/null | grep -v '^$' | head -70 > "results/perf-$mode-$name.txt"
              LD_LIBRARY_PATH=$lib "$perf" report -i "build/$name-$mode.perf" --children --stdio --percent-limit 2 -g none 2>/dev/null | grep -v '^$' | head -60 > "results/perf-$mode-children-$name.txt"
              echo "== $name $mode"; cat "results/perf-stat-$mode-$name.txt"; head -30 "results/perf-$mode-$name.txt"
            done
          done

      - name: Time the full stages
        if: env.FULL == '1' && env.TIME == '1'
        run: |
          set -euo pipefail
          mkdir -p results
          for pair in $BUILDS; do
            tree=build/trees/${pair%%=*}
            mkdir -p "$tree/build/research" && rm -rf "$tree/build/research/concurrency" "$tree/build/fonts"
            cp -R build/research/concurrency "$tree/build/research/"
            cp -R build/fonts "$tree/build/fonts"
            # A tree from before BUILT existed would rebuild its drivers.
            cp research/investigations/style/run.sh "$tree/research/investigations/style/run.sh"
            cp research/investigations/layout/run.sh "$tree/research/investigations/layout/run.sh"
          done
          runs=5
          if [ "$ROUNDS" -gt 1 ]; then runs=1; fi
          for round in $(seq "$ROUNDS"); do
            for pair in $BUILDS; do
              name=${pair%%=*}
              tree=build/trees/$name
              (cd "$tree" && BUILT=1 RUNS=$runs WORKERS=4 sh research/investigations/style/run.sh time) | tee "results/full-style-$name-$round.txt"
              (cd "$tree" && BUILT=1 RUNS=$runs WORKERS=4 MODES="$FULL_MODES" sh research/investigations/layout/run.sh time "$PAGE_LIST" "$FULL_REPS") | tee "results/full-layout-$name-$round.txt"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-14900k-${{ github.run_id }}
          path: results/
