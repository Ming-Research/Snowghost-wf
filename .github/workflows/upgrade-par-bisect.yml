# Measurement-only check of Whitefoot's grow-copy threshold experiments for the
# four-worker loss #280 introduced (realloc takes glibc's arena lock on every
# growth): baseline wf-87fa2524f4da (always realloc), wf-exp-fe2f48fbd8cc
# (copy below 1 KiB), wf-exp-4d073028396d (copy below 128 KiB), with v0.94 as
# the reference. Reject line set before measuring: ecma262 text ratio above
# 0.55 or more than 10,000 futex calls. Confined to the research branch.
name: upgrade-par-bisect
on:
  push:
    branches: [research/grow-threshold]
    paths:
      - .github/workflows/upgrade-par-bisect.yml
      - .github/timing/upgrade-par-bisect.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Machine and shared fonts
        run: |
          set -euo pipefail
          mkdir -p results
          uname -a > results/machine.txt
          lscpu >> results/machine.txt
          cat /etc/os-release >> results/machine.txt
          cat results/machine.txt
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s oracle-fonts
          sha256sum build/fonts/* > results/fonts.sha256
      - name: Fetch only the four pinned input files used here
        run: |
          set -euo pipefail
          mkdir -p build/research/concurrency
          sed -n '/^ecma262\.html /p; /^ecma262-ecmarkup\.css /p; /^ecma262-print\.css /p; /^html5\.html /p' research/investigations/concurrency/run.sh > results/page-pins.txt
          test "$(wc -l < results/page-pins.txt)" -eq 4
          while read -r name url digest; do
            curl -fsSL --retry 3 -o "build/research/concurrency/$name" "$url"
            printf '%s  %s\n' "$digest" "build/research/concurrency/$name" >> results/pages.sha256
          done < results/page-pins.txt
          sha256sum -c results/pages.sha256
          sha256sum renderer/style/ua.css research/investigations/layout/run.sh > results/harness.sha256
      - name: Build each source and release twice with separate caches
        run: |
          set -euo pipefail
          mkdir -p build/trees results/builds
          printf 'name\trelease\tsource\n' > results/builds.tsv
          installed_major=''
          # v0.94 builds main before the upgrade; the three v0.119 releases build
          # PR #56's head (FN-1 deletions plus cancellation handling), which
          # compiles under v0.119 unchanged.
          for pair in wf-0b7f5c5b9854:9d720c49daf4de746d507f5b1400ea407e3dfc09 wf-87fa2524f4da:bb98d4371d0e148775e232e4d2938ddb9aec3be6 wf-exp-fe2f48fbd8cc:bb98d4371d0e148775e232e4d2938ddb9aec3be6 wf-exp-4d073028396d:bb98d4371d0e148775e232e4d2938ddb9aec3be6; do
            pin=${pair%%:*}
            source=${pair#*:}
            for twin in a b; do
              name=${pin#wf-}-$twin
              tree=$GITHUB_WORKSPACE/build/trees/$name
              evidence=$GITHUB_WORKSPACE/results/builds/$name
              mkdir -p "$evidence"
              git worktree add -q --detach "$tree" "$source"
              git -C "$tree" submodule update -q --init whitefoot-kit
              printf 'release = %s\n' "$pin" > "$tree/whitefoot.pin"
              make -s -C "$tree" compiler
              manifest=$tree/build/whitefoot/$pin/whitefoot-release.json
              major=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["linux_llvm_major"])' "$manifest")
              if [ "$major" != "$installed_major" ]; then
                make -s -C "$tree" toolchain
                installed_major=$major
              fi
              make -s -C "$tree" toolchain-check
              cp "$manifest" "$evidence/"
              /usr/bin/clang --version > "$evidence/toolchain.txt"
              ld.lld --version >> "$evidence/toolchain.txt"
              wfc=$tree/build/whitefoot/$pin/whitefootc
              (cd "$tree/renderer" && /usr/bin/time -p -o "$evidence/seq.time" "$wfc" --cache "$tree/build/cache" --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle > "$evidence/seq.stdout" 2> "$evidence/seq.stderr")
              echo 0 > "$evidence/seq.exit"
              (cd "$tree/renderer" && /usr/bin/time -p -o "$evidence/par.time" "$wfc" --cache "$tree/build/cache" --fragments function --par --par-ledger --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par > "$evidence/par.stdout" 2> "$evidence/par.stderr")
              echo 0 > "$evidence/par.exit"
              sha256sum "$wfc" "$tree/build/layout_oracle" "$tree/build/layout_oracle_par" > "$evidence/binaries.sha256"
              git -C "$tree" rev-parse HEAD > "$evidence/source.txt"
              git -C "$tree" diff -- whitefoot.pin > "$evidence/pin-only.patch"
              printf '%s\t%s\t%s\n' "$name" "$pin" "$source" >> results/builds.tsv
              cat "$evidence/seq.time" "$evidence/par.time"
            done
          done
      - name: Pilot, select bounded rounds, and reverse alternate rounds
        env:
          UPB_VARIANTS: default=
        run: python3 .github/timing/upgrade-par-bisect.py
      - name: Futex calls per build
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends strace
          mkdir -p results/futex
          args="text 3 build/research/concurrency/ecma262.html renderer/style/ua.css assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css"
          for name in 0b7f5c5b9854-a 87fa2524f4da-a exp-fe2f48fbd8cc-a exp-4d073028396d-a; do
            for rep in 1 2; do
              env WF_WORKERS=4 strace -f -c -e trace=futex,mremap -o "results/futex/$name-$rep.txt" "build/trees/$name/build/layout_oracle_par" $args > /dev/null
            done
            echo "== $name"; cat results/futex/$name-*.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-par-bisect-${{ github.run_id }}
          if-no-files-found: error
          path: results/
