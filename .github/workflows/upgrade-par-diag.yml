# Temporary ledger diagnosis; remove when the upgrade investigation closes.
name: upgrade-par-diag
on:
  push:
    branches: [research/upgrade-par-diag]
    paths:
      - .github/workflows/upgrade-par-diag.yml
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [details, examples, drivers]
        default: details
permissions:
  contents: read
env:
  DIAG_MODE: ${{ inputs.mode || 'details' }}
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: old
            revision: 9d720c49daf4de746d507f5b1400ea407e3dfc09
          - side: new
            revision: c3ea1c84ca3a2eca1e4048555d8a7298bd620d00
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          submodules: true
          path: side
      - uses: actions/checkout@v4
        with:
          path: diagnosis
      - name: Install the pinned toolchain
        working-directory: side
        run: make toolchain
      - name: Record revisions and releases
        working-directory: side
        run: |
          set -euo pipefail
          mkdir -p ../results
          git rev-parse HEAD > ../results/revision.txt
          cat whitefoot.pin >> ../results/revision.txt
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          cp "build/whitefoot/$pin/whitefoot-release.json" ../results/
      - name: Compile layout_oracle and retain the full ledger
        if: env.DIAG_MODE == 'drivers'
        working-directory: side
        run: |
          set -uo pipefail
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          cd renderer
          if "$wfc" --cache ../build/par-diag-cache --fragments function \
              --par --par-ledger --graph modules.wfg --entry layout_oracle \
              -o ../build/layout_oracle_par \
              > ../../results/compiler.stdout 2> ../../results/compiler.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../../results/compiler.exit
          exit "$compiler_exit"
      - name: Retain the linked driver without executing it
        if: env.DIAG_MODE == 'drivers' && success()
        working-directory: side
        run: |
          set -euo pipefail
          cp build/layout_oracle_par ../results/
          /usr/lib/llvm-22/bin/llvm-nm build/layout_oracle_par > ../results/driver.symbols
          /usr/lib/llvm-22/bin/llvm-objdump --disassemble --no-show-raw-insn \
            build/layout_oracle_par > ../results/driver.disassembly
      - name: Emit LLVM to inspect actual task publications
        if: env.DIAG_MODE == 'details'
        working-directory: side
        run: |
          set -uo pipefail
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          cd renderer
          if "$wfc" --par --par-ledger --emit-llvm \
              --graph modules.wfg --entry layout_oracle \
              -o ../../results/layout_oracle.ll \
              > ../../results/compiler.stdout 2> ../../results/compiler.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../../results/compiler.exit
          exit "$compiler_exit"
      - name: Compile stand-alone examples with the same compiler
        if: always()
        working-directory: side
        run: |
          set -uo pipefail
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          status=0
          for source in ../diagnosis/research/investigations/layout/upgrade-par-examples/*.wf; do
            [ -f "$source" ] || continue
            name=$(basename "$source" .wf)
            mkdir -p "../results/examples/$name"
            cp "$source" "../results/examples/$name/source.wf"
            if "$wfc" --par --par-ledger "$source" -o "build/$name" \
                > "../results/examples/$name/compiler.stdout" \
                2> "../results/examples/$name/compiler.stderr"; then
              compiler_exit=0
            else
              compiler_exit=$?
              status=1
            fi
            printf '%s\n' "$compiler_exit" > "../results/examples/$name/compiler.exit"
            if [ "$compiler_exit" -eq 0 ]; then
              /usr/lib/llvm-22/bin/llvm-objdump --disassemble --no-show-raw-insn \
                "build/$name" > "../results/examples/$name/program.disassembly"
              if "$wfc" --cache "build/example-cache-$name" --fragments function \
                  --par --par-ledger "$source" -o "build/$name-fragments" \
                  > "../results/examples/$name/fragments.stdout" \
                  2> "../results/examples/$name/fragments.stderr"; then
                fragments_exit=0
              else
                fragments_exit=$?
                status=1
              fi
              printf '%s\n' "$fragments_exit" > "../results/examples/$name/fragments.exit"
              if [ "$fragments_exit" -eq 0 ]; then
                /usr/lib/llvm-22/bin/llvm-objdump --disassemble --no-show-raw-insn \
                  "build/$name-fragments" > "../results/examples/$name/fragments.disassembly"
              fi
            fi
            if [ "$compiler_exit" -eq 0 ]; then
              if "$wfc" --par --par-ledger --emit-llvm "$source" \
                  -o "../results/examples/$name/program.ll" \
                  > "../results/examples/$name/emission.stdout" \
                  2> "../results/examples/$name/emission.stderr"; then
                emission_exit=0
              else
                emission_exit=$?
                status=1
              fi
              printf '%s\n' "$emission_exit" > "../results/examples/$name/emission.exit"
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-par-diag-${{ matrix.side }}-${{ github.run_id }}
          if-no-files-found: error
          path: results/
