# Temporary: bisects the per-edit cost of M2's layout steps on hosted runners,
# one job per build, in parallel. A regression of tens to hundreds of times
# needs no precise machine; the 14900K is for close comparisons. Removed with
# this temporary branch.
name: bisect-hosted

on:
  push:
    branches: [research/m2-edit-cost]

jobs:
  build:
    if: contains(github.event.head_commit.message, '[timing]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build: [head=HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: LLVM 22 and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          curl -fsSL --retry 3 -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22 >/dev/null
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          clang --version | head -1
      - name: Drivers of ${{ matrix.build }}
        run: |
          set -euo pipefail
          pair='${{ matrix.build }}'
          name=${pair%%=*} ref=${pair#*=}
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add -q --detach build/tree "$ref"
          (cd build/tree && git submodule update -q --init)
          echo "release = wf-0b7f5c5b9854" > build/tree/whitefoot.pin
          make -s -C build/tree compiler
          wfc=$(realpath "$(ls build/tree/build/whitefoot/*/whitefootc | head -1)")
          (cd build/tree/renderer && "$wfc" --cache "$HOME/wf-cache" --fragments function --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_seq")
          (cd build/tree/renderer && "$wfc" --cache "$HOME/wf-cache" --fragments function --par --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_par")
          echo "$name $(git -C build/tree rev-parse HEAD) $(cat build/tree/whitefoot.pin)" | tee build/revision.txt
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ env.BUILD_NAME }}
          path: |
            build/layout_oracle_seq
            build/layout_oracle_par
            build/revision.txt

  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-head
          path: build/drivers
      - uses: actions/download-artifact@v4
        with:
          run-id: 37596011168
          github-token: ${{ github.token }}
          pattern: driver-*
          path: build/historical
      - uses: actions/download-artifact@v4
        with:
          run-id: 37624162286
          github-token: ${{ github.token }}
          name: driver-head
          path: build/drivers/driver-prior
      - name: Select already built historical controls
        run: |
          set -euo pipefail
          for name in main s1c s2 s3a m2 base; do
            cp -R build/historical/driver-$name build/drivers/
          done
          cp -R build/historical/driver-head build/drivers/driver-twin
          names="main base twin prior head"
          if ${{ contains(github.event.head_commit.message, '[bisect]') }}; then names="main s1c s2 s3a m2 base twin prior head"; fi
          echo "BUILD_NAMES=$names" >> "$GITHUB_ENV"
      - name: Fonts and perf
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-tools-$(uname -r) fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          sudo sysctl kernel.perf_event_paranoid=-1
          chmod +x build/drivers/driver-*/layout_oracle_*
          uname -a
          lscpu
          perf --version
      - name: Shared pages and scripts
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do
            test -s "build/research/concurrency/$file"
          done
          make -s oracle-fonts
          cp build/drivers/driver-main/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          sha256sum build/x5/scripts/* build/research/concurrency/*.html
      - name: Interleaved timing and per-edit counters
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          for round in 1 2; do
            names="$BUILD_NAMES"
            if [ "$round" = 2 ]; then names=$(python3 -c 'import sys; print(" ".join(reversed(sys.argv[1:])))' $BUILD_NAMES); fi
            for name in $names; do
              cp build/drivers/driver-$name/layout_oracle_* build/
              for page in ecma262 html5; do
                for kind in word sentence fontsize; do
                  for mode in seq par; do
                    rm -rf build/x5/time
                    ALONE=1 WF_WORKERS=4 /usr/bin/time -p sh research/investigations/incremental-layout/run.sh time "$mode" "$page" "$kind" 1 > build/evidence/$name-$page-$kind-$mode-r$round.summary
                    cat build/evidence/$name-$page-$kind-$mode-r$round.summary
                    cp build/x5/time/*.txt build/evidence/$name-$page-$kind-$mode-r$round.raw
                  done
                done
              done
            done
          done
      - name: Profiles of the same word script
        run: |
          set -euo pipefail
          for repeat in $(seq 1 10); do cat build/x5/scripts/ecma262-word.edits; done > build/evidence/profile-word.edits
          for name in $BUILD_NAMES; do
            perf record -F 999 --call-graph dwarf -o build/evidence/$name.perf.data -- build/drivers/driver-$name/layout_oracle_seq edittime build/evidence/profile-word.edits build/research/concurrency/ecma262.html renderer/style/ua.css assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css > build/evidence/$name-profile.raw
            perf report -i build/evidence/$name.perf.data --stdio --no-children --percent-limit 0.5 > build/evidence/$name-perf-self.txt
            perf report -i build/evidence/$name.perf.data --stdio --children --percent-limit 1 > build/evidence/$name-perf-callers.txt
          done
      - name: Profiles of the first font-size round trip at head
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            script="build/evidence/head-$page-fontsize-profile.edits"
            python3 -c 'import pathlib,sys; rows=pathlib.Path(sys.argv[1]).read_text().splitlines(True); setup=[r for r in rows if r.startswith("S ")]; edits=[r for r in rows if not r.startswith("S ")]; assert edits[0].startswith("C ") and edits[1].startswith("K "); pathlib.Path(sys.argv[2]).write_text("".join(setup+edits[:2]*100))' "build/x5/scripts/$page-fontsize.edits" "$script"
            sheets=(renderer/style/ua.css)
            if [ "$page" = ecma262 ]; then
              sheets+=(assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css)
            fi
            perf record -F 999 --call-graph dwarf -o "build/evidence/head-$page-fontsize.perf.data" -- build/drivers/driver-head/layout_oracle_seq edittime "$script" "build/research/concurrency/$page.html" "${sheets[@]}" > "build/evidence/head-$page-fontsize-profile.raw"
            perf report -i "build/evidence/head-$page-fontsize.perf.data" --stdio --no-children --percent-limit 0.5 > "build/evidence/head-$page-fontsize-perf-self.txt"
            perf report -i "build/evidence/head-$page-fontsize.perf.data" --stdio --children --percent-limit 1 > "build/evidence/head-$page-fontsize-perf-callers.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-cost-evidence
          path: |
            build/evidence/
            build/x5/scripts/
            build/drivers/driver-*/revision.txt
