# Temporary: bisects the per-edit cost of M2's layout steps on hosted runners,
# one job per build, in parallel. A regression of tens to hundreds of times
# needs no precise machine; this hosted comparison is explicitly requested.
# The frozen final cohort is built independently, including the same-source twin.
# Retired with the Q134 acceptance investigation; no expired run artifact is needed to reproduce it.
name: bisect-hosted

on:
  push:
    branches: [research/m2-layout, research/m2-frag-a, research/m2-frag-b]

jobs:
  build:
    if: contains(github.event.head_commit.message, '[timing]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build: [main=8fbc1601785cee70265da1eac4d99589fc6fb67c, fixed=HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: LLVM 22 and fonts
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          curl -fsSL --retry 3 -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22 >/dev/null
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          clang --version | head -1
      - name: Drivers of ${{ matrix.build }}
        run: |
          set -euo pipefail
          pair='${{ matrix.build }}'
          name=${pair%%=*} ref=${pair#*=}
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add -q --detach build/tree "$ref"
          (cd build/tree && git submodule update -q --init)
          source=$(git -C build/tree rev-parse HEAD)
          echo "release = wf-0b7f5c5b9854" > build/tree/whitefoot.pin
          git -C build/tree -c user.name='Snowghost timing' -c user.email='noreply@anthropic.com' commit --allow-empty -am 'Timing only: pin wf-0b7f5c5b9854 for Q138 root-font bisect

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>'
          git -C build/tree show --format=fuller HEAD > build/pin-only.patch
          make -s -C build/tree compiler
          wfc=$(realpath "$(ls build/tree/build/whitefoot/*/whitefootc | head -1)")
          (cd build/tree/renderer && "$wfc" --cache "$HOME/wf-cache" --fragments function --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_seq")
          (cd build/tree/renderer && "$wfc" --cache "$HOME/wf-cache" --fragments function --par --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_par")
          echo "$name source=$source pin-commit=$(git -C build/tree rev-parse HEAD) $(cat build/tree/whitefoot.pin)" | tee build/revision.txt
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ env.BUILD_NAME }}
          path: |
            build/layout_oracle_seq
            build/layout_oracle_par
            build/revision.txt
            build/pin-only.patch

  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-*
          path: build/drivers
      - name: Reuse completed bisect drivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in s2 s3a m2 base twin a; do
            gh run download 37718099858 -n "driver-$name" --dir "build/drivers/driver-$name"
          done
      - name: Select builds
        run: echo "BUILD_NAMES=main s2 s3a m2 base twin a fixed" >> "$GITHUB_ENV"
      - name: Fonts
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          chmod +x build/drivers/driver-*/layout_oracle_*
          uname -a | tee build/machine.txt
          lscpu | tee -a build/machine.txt
      - name: Shared pages and scripts
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do
            test -s "build/research/concurrency/$file"
          done
          make -s oracle-fonts
          cp build/drivers/driver-main/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          sha256sum build/x5/scripts/* build/research/concurrency/*.html
      - name: Bound the root-font batch with one edit per sample
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          head -n 2 build/x5/scripts/html5-rootfont.edits > build/evidence/rootfont-sample.edits
          for sample in 1 2; do
            WF_WORKERS=4 /usr/bin/time -p -o build/evidence/rootfont-sample-$sample.time build/drivers/driver-main/layout_oracle_seq edittime build/evidence/rootfont-sample.edits build/research/concurrency/html5.html renderer/style/ua.css > build/evidence/rootfont-sample-$sample.raw
            python3 research/investigations/incremental-layout/scripts/inctime.py build/evidence/rootfont-sample.edits build/evidence/rootfont-sample-$sample.raw
            cat build/evidence/rootfont-sample-$sample.time
          done
          python3 - <<'PYEOF'
          from pathlib import Path
          values = [float(path.read_text().splitlines()[0].split()[1]) for path in Path('build/evidence').glob('rootfont-sample-*.time')]
          assert len(values) == 2 and max(values) < 60, values
          print('one-edit rootfont wall seconds:', values, '; bounded batch admitted')
          PYEOF
      - name: Interleaved timing and per-edit counters
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          for round in 1 2; do
            names="$BUILD_NAMES"
            if [ "$round" = 2 ]; then names=$(python3 -c 'import sys; print(" ".join(reversed(sys.argv[1:])))' $BUILD_NAMES); fi
            for name in $names; do
              cp build/drivers/driver-$name/layout_oracle_* build/
              for page in ecma262 html5; do
                for kind in rootfont; do
                  for mode in seq par; do
                    rm -rf build/x5/time
                    ALONE=1 WF_WORKERS=4 /usr/bin/time -p sh research/investigations/incremental-layout/run.sh time "$mode" "$page" "$kind" 1 > build/evidence/$name-$page-$kind-$mode-r$round.summary
                    cat build/evidence/$name-$page-$kind-$mode-r$round.summary
                    cp build/x5/time/*.txt build/evidence/$name-$page-$kind-$mode-r$round.raw
                  done
                done
              done
            done
          done
      - name: Root-font sampled attribution
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends linux-tools-$(uname -r)
          sudo sysctl kernel.perf_event_paranoid=-1
          mkdir -p build/evidence/profile
          python3 - <<'PYEOF'
          from pathlib import Path
          for page in ('ecma262', 'html5'):
              source = Path(f'build/x5/scripts/{page}-rootfont.edits').read_text().splitlines(True)
              setup = [line for line in source if line.startswith('S ')]
              pair = [line for line in source if line.startswith(('C ', 'K '))][:2]
              assert len(pair) == 2 and pair[0].startswith('C ') and pair[1].startswith('K ')
              Path(f'build/evidence/profile/{page}-sample.edits').write_text(''.join(setup + pair))
          PYEOF
          for page in ecma262 html5; do
            for sample in 1 2; do
              WF_WORKERS=4 /usr/bin/time -p -o build/evidence/profile/$page-$sample.time build/drivers/driver-a/layout_oracle_seq edittime build/evidence/profile/$page-sample.edits build/research/concurrency/$page.html renderer/style/ua.css > build/evidence/profile/$page-$sample.raw
            done
          done
          python3 - <<'PYEOF'
          from pathlib import Path
          root = Path('build/evidence/profile')
          for page in ('ecma262', 'html5'):
              values = [float((root / f'{page}-{n}.time').read_text().splitlines()[0].split()[1]) for n in (1, 2)]
              assert max(values) < 60, values
              repeats = min(100, max(2, int(60 / max(values))))
              lines = (root / f'{page}-sample.edits').read_text().splitlines(True)
              setup = [line for line in lines if line.startswith('S ')]
              pair = [line for line in lines if line.startswith(('C ', 'K '))]
              (root / f'{page}.edits').write_text(''.join(setup + pair * repeats))
              (root / f'{page}-scale.txt').write_text(f'{values}; {repeats} round trips\n')
          PYEOF
          for page in ecma262 html5; do
            for name in main s2 s3a m2 base a fixed; do
              output=build/evidence/profile/$name-$page
              WF_WORKERS=4 perf record -F 499 --call-graph dwarf,4096 -o "$output.data" -- build/drivers/driver-$name/layout_oracle_seq edittime build/evidence/profile/$page.edits build/research/concurrency/$page.html renderer/style/ua.css > "$output.raw"
              perf report -i "$output.data" --stdio --no-children --percent-limit 0.5 > "$output-self.txt"
              perf report -i "$output.data" --stdio --children --percent-limit 1 > "$output-callers.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-cost-evidence
          path: |
            build/machine.txt
            build/evidence/
            build/x5/scripts/
            build/drivers/driver-*/revision.txt
            build/drivers/driver-*/pin-only.patch

  profile-rootfont:
    if: contains(github.event.head_commit.message, '[profile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Frozen bisect drivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in main fixed; do
            gh run download 37718501510 -n "driver-$name" --dir "build/drivers/driver-$name"
          done
          for name in s2 s3a m2 base a; do
            gh run download 37718099858 -n "driver-$name" --dir "build/drivers/driver-$name"
          done
          chmod +x build/drivers/driver-*/layout_oracle_*
      - name: Fonts and sampled profiler
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends linux-tools-$(uname -r) fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          sudo sysctl kernel.perf_event_paranoid=-1
          uname -a | tee build/machine.txt
          lscpu | tee -a build/machine.txt
          perf --version | tee -a build/machine.txt
      - name: Exact ECMA262 timing inputs
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css; do
            test -s "build/research/concurrency/$file"
          done
          make -s oracle-fonts
          cp build/drivers/driver-main/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262
          mkdir -p build/profile-evidence
          sha256sum build/research/concurrency/ecma262.html build/research/concurrency/ecma262-ecmarkup.css build/research/concurrency/ecma262-print.css renderer/style/ua.css build/x5/scripts/ecma262-rootfont.edits > build/profile-evidence/inputs.sha256
          python3 - <<'PYEOF'
          from pathlib import Path
          source = Path('build/x5/scripts/ecma262-rootfont.edits').read_text().splitlines(True)
          setup = [line for line in source if line.startswith('S ')]
          pair = [line for line in source if line.startswith(('C ', 'K '))][:2]
          assert len(pair) == 2 and pair[0].startswith('C ') and pair[1].startswith('K ')
          Path('build/profile-evidence/ecma262-sample.edits').write_text(''.join(setup + pair))
          PYEOF
      - name: Bound and profile the same styled workload
        run: |
          set -euo pipefail
          data=build/research/concurrency
          for sample in 1 2; do
            WF_WORKERS=4 /usr/bin/time -p -o build/profile-evidence/ecma262-$sample.time build/drivers/driver-a/layout_oracle_seq edittime build/profile-evidence/ecma262-sample.edits "$data/ecma262.html" renderer/style/ua.css "assets/css/ecmarkup.css=$data/ecma262-ecmarkup.css" "assets/css/print.css=$data/ecma262-print.css" > build/profile-evidence/ecma262-sample-$sample.raw
          done
          python3 - <<'PYEOF'
          from pathlib import Path
          root = Path('build/profile-evidence')
          values = [float((root / f'ecma262-{n}.time').read_text().splitlines()[0].split()[1]) for n in (1, 2)]
          assert max(values) < 60, values
          repeats = min(100, max(2, int(60 / max(values))))
          lines = (root / 'ecma262-sample.edits').read_text().splitlines(True)
          setup = [line for line in lines if line.startswith('S ')]
          pair = [line for line in lines if line.startswith(('C ', 'K '))]
          (root / 'ecma262.edits').write_text(''.join(setup + pair * repeats))
          (root / 'ecma262-scale.txt').write_text(f'{values}; {repeats} round trips\n')
          PYEOF
          for name in main s2 s3a m2 base a fixed; do
            output=build/profile-evidence/$name-ecma262
            WF_WORKERS=4 perf record -F 499 --call-graph dwarf,4096 -o "$output.data" -- build/drivers/driver-$name/layout_oracle_seq edittime build/profile-evidence/ecma262.edits "$data/ecma262.html" renderer/style/ua.css "assets/css/ecmarkup.css=$data/ecma262-ecmarkup.css" "assets/css/print.css=$data/ecma262-print.css" > "$output.raw"
            perf report -i "$output.data" --stdio --no-children --percent-limit 0.5 > "$output-self.txt"
            perf report -i "$output.data" --stdio --children --percent-limit 1 > "$output-callers.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfont-profile-evidence
          path: |
            build/machine.txt
            build/profile-evidence/
            build/x5/scripts/ecma262-rootfont.edits
            build/drivers/driver-*/revision.txt
            build/drivers/driver-*/pin-only.patch
