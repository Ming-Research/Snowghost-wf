# Snowghost's gate: every push runs `make check`, which downloads the
# Whitefoot compiler release that whitefoot.pin names and runs every Snowghost
# check. The exact revision that merges into main passes this first.
name: check

on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # whitefootc compiles programs with /usr/bin/clang and links a cached
      # build's fragments with LLD on Linux; both must be the LLVM major the
      # pinned release was built with, which make toolchain installs
      # (whitefoot-kit/downstream.md).
      - name: Install the host toolchain
        run: |
          make toolchain
          ld.lld --version

      - name: Check
        run: make check
