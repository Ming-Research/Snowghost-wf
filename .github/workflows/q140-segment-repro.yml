# Temporary isolated Q140 language-boundary evidence. Remove when the
# natural-form refusals are resolved and the renderer compiles normally.
name: q140-segment-repro
on:
  push:
    branches: [research/m2-q140]
    paths: ['.github/workflows/q140-segment-repro.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Independent design-form check
        run: make design-lint DESIGN_REVIEW_BASE=a1ed31e9b854937abac7a71750dd60f66ffb8d4b
      - name: Mutation detector rejects incomplete input
        run: python3 research/investigations/incremental-layout/scripts/grid-falsify.py self-test
      - name: Reproduce direct segment length access
        run: |
          set -euo pipefail
          make -s compiler
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/segment-repro/repro
          git rev-parse HEAD > build/segment-repro/revision.txt
          cp whitefoot.pin build/segment-repro/
          cat > build/segment-repro/modules.wfg <<'EOF'
          pkg::repro: [];
          EOF
          cat > build/segment-repro/repro/module.wfm <<'EOF'
          public fn segment_length(values: &Box<Segments<i32>>, item: u64) -> count: u64 reads(values) doc "Reads the length of an existing segment.";
          EOF
          cat > build/segment-repro/repro/repro.wf <<'EOF'
          fn segment_length(values: &Box<Segments<i32>>, item: u64) -> count: u64 reads(values) {
            if item < values^.inner.len {
              return values^.inner[item].len;
            }
            return 0_u64;
          }
          EOF
          status=0
          (cd build/segment-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/segment-repro/compiler.log 2>&1 || status=$?
          echo "$status" > build/segment-repro/exit-code.txt
          cat build/segment-repro/compiler.log
          test "$status" -ne 0
          grep -F 'error[OP-4]: TypeMismatch' build/segment-repro/compiler.log
          grep -F 'found: Segments<i32>' build/segment-repro/compiler.log
      - name: Specified segment borrow is accepted
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cat > build/segment-repro/repro/repro.wf <<'EOF'
          fn segment_length(values: &Box<Segments<i32>>, item: u64) -> count: u64 reads(values) {
            if item < values^.inner.len {
              let segment = &values^.inner[item];
              return segment^.len;
            }
            return 0_u64;
          }
          EOF
          (cd build/segment-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/segment-repro/borrow.log 2>&1
          cat build/segment-repro/borrow.log
      - name: Reproduce bounded first-or-last selection
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/selection-repro/repro
          git rev-parse HEAD > build/selection-repro/revision.txt
          cp whitefoot.pin build/selection-repro/
          cat > build/selection-repro/modules.wfg <<'EOF'
          pkg::repro: [];
          EOF
          cat > build/selection-repro/repro/module.wfm <<'EOF'
          public fn selected(values: &[i32], reverse: Bool) -> value: i32 reads(values) doc "Reads the first or last element of a nonempty range, zero when empty.";
          EOF
          cat > build/selection-repro/repro/repro.wf <<'EOF'
          fn selected(values: &[i32], reverse: Bool) -> value: i32 reads(values) {
            let count = values^.len;
            if count == 0_u64 {
              return 0_i32;
            }
            let at = if reverse {
              give count - 1_u64;
            } else {
              give 0_u64;
            }
            return values^[at];
          }
          EOF
          status=0
          (cd build/selection-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/selection-repro/compiler.log 2>&1 || status=$?
          echo "$status" > build/selection-repro/exit-code.txt
          cat build/selection-repro/compiler.log
          test "$status" -ne 0
          grep -F 'error[OP-4]: UndischargedBoundsObligation' build/selection-repro/compiler.log
          grep -F 'residual: at < values^.len' build/selection-repro/compiler.log
      - name: Test the authorized named computed value
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/named-selection-repro/repro
          git rev-parse HEAD > build/named-selection-repro/revision.txt
          cp whitefoot.pin build/named-selection-repro/
          cat > build/named-selection-repro/modules.wfg <<'EOF'
          pkg::repro: [];
          EOF
          cat > build/named-selection-repro/repro/module.wfm <<'EOF'
          public fn selected(values: &[i32], reverse: Bool) -> value: i32 reads(values) doc "Reads the first or last element of a nonempty range, zero when empty.";

          public fn selected_slot(values: &Box<Slots<i32>>, reverse: Bool) -> value: i32 reads(values) doc "Reads first or last through the renderer's boxed slot shape.";

          public fn selected_interval(values: &[i32], first: u64, end: u64, reverse: Bool) -> value: i32 reads(values) doc "Reads first or last in a checked nonempty interval.";
          EOF
          cat > build/named-selection-repro/repro/repro.wf <<'EOF'
          fn selected(values: &[i32], reverse: Bool) -> value: i32 reads(values) {
            let count = values^.len;
            if count == 0_u64 {
              return 0_i32;
            }
            let at = if reverse {
              let last = count - 1_u64;
              give last;
            } else {
              give 0_u64;
            }
            return values^[at];
          }

          fn selected_slot(values: &Box<Slots<i32>>, reverse: Bool) -> value: i32 reads(values) {
            let count = values^.inner.len;
            if count == 0_u64 {
              return 0_i32;
            }
            let at = if reverse {
              let last = count - 1_u64;
              give last;
            } else {
              give 0_u64;
            }
            return values^.inner[at];
          }

          fn selected_interval(values: &[i32], first: u64, end: u64, reverse: Bool) -> value: i32 reads(values) {
            if first >= end {
              return 0_i32;
            }
            if end > values^.len {
              return 0_i32;
            }
            let at = if reverse {
              let last = end - 1_u64;
              give last;
            } else {
              give first;
            }
            return values^[at];
          }
          EOF
          status=0
          (cd build/named-selection-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/named-selection-repro/compiler.log 2>&1 || status=$?
          echo "$status" > build/named-selection-repro/exit-code.txt
          cat build/named-selection-repro/compiler.log
          test "$status" -eq 0
      - name: Reproduce nested Boolean call refusal
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/nested-call-repro/repro
          git rev-parse HEAD > build/nested-call-repro/revision.txt
          cp whitefoot.pin build/nested-call-repro/
          cat > build/nested-call-repro/modules.wfg <<'EOF'
          pkg::repro: [];
          EOF
          cat > build/nested-call-repro/repro/module.wfm <<'EOF'
          public fn exclude(selected: Bool, automatic: Bool) -> value: Bool pure doc "Conjoins selection with absence of automatic placement.";
          EOF
          cat > build/nested-call-repro/repro/repro.wf <<'EOF'
          fn exclude(selected: Bool, automatic: Bool) -> value: Bool pure {
            let participates = band(selected, bnot(automatic));
            return participates;
          }
          EOF
          status=0
          (cd build/nested-call-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/nested-call-repro/compiler.log 2>&1 || status=$?
          echo "$status" > build/nested-call-repro/exit-code.txt
          cat build/nested-call-repro/compiler.log
          test "$status" -ne 0
          grep -F 'error[GRAM-9]: UnexpectedToken' build/nested-call-repro/compiler.log
          grep -F 'found: "bnot("' build/nested-call-repro/compiler.log
      - name: Flat Boolean calls are accepted
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cat > build/nested-call-repro/repro/repro.wf <<'EOF'
          fn exclude(selected: Bool, automatic: Bool) -> value: Bool pure {
            let manual = bnot(automatic);
            let participates = band(selected, manual);
            return participates;
          }
          EOF
          (cd build/nested-call-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/nested-call-repro/flat.log 2>&1
          cat build/nested-call-repro/flat.log
      - name: Reproduce constructed segment-count bound refusal
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/constructed-segments-repro/repro
          git rev-parse HEAD > build/constructed-segments-repro/revision.txt
          cp whitefoot.pin build/constructed-segments-repro/
          cp "$(dirname "$wfc")/whitefoot-release.json" build/constructed-segments-repro/
          cat > build/constructed-segments-repro/modules.wfg <<'EOF'
          pkg::repro: [];
          EOF
          cat > build/constructed-segments-repro/repro/module.wfm <<'EOF'
          public fn segment_lengths(count: u64) -> length: u64 pure doc "Reads each segment constructed from one length per iteration.";
          EOF
          cat > build/constructed-segments-repro/repro/repro.wf <<'EOF'
          fn segment_lengths(count: u64) -> length: u64 pure {
            let lengths = box_array_filled::<u64>(count: count, value: 1_u64);
            let segments = box_segments_filled::<i32>(lengths: &lengths.inner[0_u64..count], value: 0_i32);
            let length = 0_u64;
            for (i in 0_u64..count) {
              let segment = &segments.inner[i];
              set length = segment^.len;
            }
            return length;
          }
          EOF
          status=0
          (cd build/constructed-segments-repro && time "$wfc" --graph modules.wfg --check-module pkg::repro) > build/constructed-segments-repro/compiler.log 2>&1 || status=$?
          echo "$status" > build/constructed-segments-repro/exit-code.txt
          cat build/constructed-segments-repro/compiler.log
          test "$status" -ne 0
          grep -F 'error[OP-4]: UndischargedBoundsObligation' build/constructed-segments-repro/compiler.log
          grep -F 'residual: i < segments.inner.len' build/constructed-segments-repro/compiler.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q140-segment-repro
          path: |
            build/segment-repro/
            build/selection-repro/
            build/named-selection-repro/
            build/nested-call-repro/
            build/constructed-segments-repro/
