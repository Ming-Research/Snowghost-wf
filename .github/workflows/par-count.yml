# Temporary measurement workflow; remove when the indexed-loop investigation
# is closed. The existing check workflow independently runs the full gate.
name: par-count

on:
  workflow_dispatch:
    inputs:
      fn1_diagnostics:
        description: Collect compiler-reported FN-1 tails in a disposable checkout
        type: boolean
        default: false
  push:
    branches: [research/par-count-290]
    paths:
      - whitefoot.pin
      - renderer/**
      - .github/workflows/par-count.yml

permissions:
  contents: read

jobs:
  report:
    if: ${{ inputs.fn1_diagnostics != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Download the pinned compiler
        run: make compiler
      - name: Build layout_oracle and record parallel permissions
        run: |
          set -uo pipefail
          mkdir -p build/par-count
          git rev-parse HEAD > build/par-count/revision.txt
          cat whitefoot.pin >> build/par-count/revision.txt
          cp build/whitefoot/wf-64c0f956df63/whitefoot-release.json build/par-count/
          cd renderer
          if ../build/whitefoot/wf-64c0f956df63/whitefootc \
              --cache ../build/par-count/cache --fragments function \
              --par --par-ledger --graph modules.wfg --entry layout_oracle \
              -o ../build/par-count/layout_oracle \
              > ../build/par-count/compiler.stdout 2> ../build/par-count/compiler.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../build/par-count/compiler.exit
          cat ../build/par-count/compiler.stdout ../build/par-count/compiler.stderr
          awk '/^PAR loop/ { print }' \
            ../build/par-count/compiler.stdout ../build/par-count/compiler.stderr \
            > ../build/par-count/loops-64c0f956.txt
          exit "$compiler_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: par-count-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/par-count/revision.txt
            build/par-count/whitefoot-release.json
            build/par-count/compiler.stdout
            build/par-count/compiler.stderr
            build/par-count/compiler.exit
            build/par-count/loops-64c0f956.txt

  fn1-diagnostics:
    if: ${{ inputs.fn1_diagnostics == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download the pinned compiler
        run: make compiler
      - name: Collect FN-1 diagnostics and a reviewable patch
        run: python3 research/investigations/storage-layout/par-classification/fn1-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fn1-diagnostics-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/fn1-diagnostics/*.txt
            build/fn1-diagnostics/*.json
            build/fn1-diagnostics/adaptation.patch
