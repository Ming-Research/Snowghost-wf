# Temporary measurement workflow; remove when the indexed-loop investigation
# is closed. The existing check workflow independently runs the full gate.
name: par-count

on:
  push:
    branches: [research/par-count-6e80]
    paths:
      - whitefoot.pin
      - renderer/**
      - .github/workflows/par-count.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Download the pinned compiler
        run: make compiler
      - name: Build layout_oracle and record parallel permissions
        run: |
          set -uo pipefail
          mkdir -p build/par-count
          git rev-parse HEAD > build/par-count/revision.txt
          cat whitefoot.pin >> build/par-count/revision.txt
          cp build/whitefoot/wf-6e800e9160f7/whitefoot-release.json build/par-count/
          cd renderer
          if ../build/whitefoot/wf-6e800e9160f7/whitefootc \
              --cache ../build/par-count/cache --fragments function \
              --par --par-ledger --graph modules.wfg --entry layout_oracle \
              -o ../build/par-count/layout_oracle \
              > ../build/par-count/compiler.stdout 2> ../build/par-count/compiler.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../build/par-count/compiler.exit
          cat ../build/par-count/compiler.stdout ../build/par-count/compiler.stderr
          awk '/^PAR loop/ { print }' \
            ../build/par-count/compiler.stdout ../build/par-count/compiler.stderr \
            > ../build/par-count/loops-6e80.txt
          exit "$compiler_exit"
      - name: Emit LLVM for the measured program
        run: |
          set -uo pipefail
          cd renderer
          # --emit-llvm cannot take --fragments; the ledger build above keeps
          # the inherited cached function-fragment link command unchanged.
          if ../build/whitefoot/wf-6e800e9160f7/whitefootc \
              --cache ../build/par-count/cache --emit-llvm \
              --par --par-ledger --graph modules.wfg --entry layout_oracle \
              -o ../build/par-count/layout_oracle.ll \
              > ../build/par-count/emission.stdout 2> ../build/par-count/emission.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../build/par-count/emission.exit
          cat ../build/par-count/emission.stdout ../build/par-count/emission.stderr
          exit "$compiler_exit"
      - name: Emit the normalization histogram outside the layout entry closure
        run: |
          set -uo pipefail
          cd renderer
          if ../build/whitefoot/wf-6e800e9160f7/whitefootc \
              --cache ../build/par-count/cache --emit-llvm \
              --par --par-ledger --graph modules.wfg \
              --function pkg::text::normalization::sort_run \
              -o ../build/par-count/sort_run.ll \
              > ../build/par-count/sort_run.stdout 2> ../build/par-count/sort_run.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../build/par-count/sort_run.exit
          cat ../build/par-count/sort_run.stdout ../build/par-count/sort_run.stderr
          exit "$compiler_exit"
      - name: Record emission counts by function and generated helper
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('build/par-count')
          bodies = {}
          for module in ('layout_oracle.ll', 'sort_run.ll'):
              llvm = (root / module).read_text()
              for match in re.finditer(r'^define [^\n]*@([^\s(]+)\([^\n]*\).*?^\}', llvm, re.M | re.S):
                  bodies[match[1]] = match[0]
          targets = ('set_coverage_bits', 'build_filters', 'mark_lookups', 'collect_stage', 'sort_run')
          report = {}
          extracts = []
          for target in targets:
              selected = {name: body for name, body in bodies.items() if target in name}
              if not selected:
                  raise SystemExit(f'missing emitted function: {target}')
              report[target] = {}
              for name, body in selected.items():
                  calls = re.findall(r'\bcall\b[^\n]*@([^\s(]+)\(', body)
                  report[target][name] = {
                      'acquire_lane': calls.count('wf__par_acquire_lane'),
                      'publish': calls.count('wf__par_publish'),
                      'join': calls.count('wf__par_join'),
                      'split_calls': sum(name.startswith('wf__par_split_') and name != 'wf__par_split_budget' for name in calls),
                      'chunk_calls': sum(name.startswith('wf__par_chunk_') for name in calls),
                      'indexed_allocations': body.count('.allocation = call ptr @wf__heap_take'),
                      'indexed_combines': body.count('.combine.head:'),
                  }
                  extracts.append(body)
          (root / 'emission-counts.json').write_text(json.dumps(report, indent=2) + '\n')
          (root / 'emission-functions.ll').write_text('\n\n'.join(extracts) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: par-count-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/par-count/revision.txt
            build/par-count/whitefoot-release.json
            build/par-count/compiler.stdout
            build/par-count/compiler.stderr
            build/par-count/compiler.exit
            build/par-count/loops-6e80.txt
            build/par-count/emission.stdout
            build/par-count/emission.stderr
            build/par-count/emission.exit
            build/par-count/layout_oracle.ll
            build/par-count/emission-counts.json
            build/par-count/emission-functions.ll
            build/par-count/sort_run.ll
            build/par-count/sort_run.stdout
            build/par-count/sort_run.stderr
            build/par-count/sort_run.exit
