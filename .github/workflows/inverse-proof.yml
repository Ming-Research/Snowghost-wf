# Temporary hosted diagnosis; retire when the recursive storage fact has an
# admitted natural form maintained by Whitefoot and integrated into layout.
name: inverse-proof
on:
  push:
    branches: [research/m2-frag-a]
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[inverse]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          make -s compiler
      - name: Small proof sample and diagnostics
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cases=research/investigations/m2-edit-cost/inverse-proof
          mkdir -p build/inverse-proof
          git rev-parse HEAD > build/inverse-proof/revision.txt
          cat whitefoot.pin >> build/inverse-proof/revision.txt
          for case in today natural type-invariant recursive-fact filled-field; do
            set +e
            time "$wfc" --check --par-ledger "$cases/$case.wf" > "build/inverse-proof/$case.log" 2>&1
            status=$?
            set -e
            echo "$status" > "build/inverse-proof/$case.status"
            cat "build/inverse-proof/$case.log"
            echo "$case exit $status"
          done
      - name: Reachable natural and serial emission controls
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cases=research/investigations/m2-edit-cost/inverse-proof
          python3 - <<'PY'
          from pathlib import Path
          root = Path('research/investigations/m2-edit-cost/inverse-proof')
          main = '''fn main() -> status: std::process::ExitStatus pure {
            let opening = Flow::Open(block: 0_u32);
            let order = array_filled::<Flow, 2>(value: opening);
            set order[1_u64] = Flow::Open(block: 1_u32);
            let block = Block(entry_slot: 0_u32, normal_y: 0_i32);
            let targets = array_filled::<Block, 2>(value: block);
            set targets[1_u64].entry_slot = 1_u32;
            translate_owner_suffix(order: &order[0_u64..2_u64], targets: &targets[0_u64..2_u64], first: 0_u64, delta: 1_i32);
            if targets[0_u64].normal_y != 1_i32 {
              return std::process::exit_status(code: 1_u8);
            }
            if targets[1_u64].normal_y != 1_i32 {
              return std::process::exit_status(code: 1_u8);
            }
            return std::process::exit_status(code: 0_u8);
          }
          '''
          for name in ('today', 'natural'):
              source = (root / (name + '.wf')).read_text()
              Path('build/inverse-proof/' + name + '.wf').write_text(source[:source.index('fn main()')] + main)
          PY
          for case in today natural; do
            set +e
            "$wfc" --par --par-ledger --emit-llvm -o "build/inverse-proof/$case-declaration.ll" "$cases/$case.wf" > "build/inverse-proof/$case-declaration.log" 2>&1
            declaration_status=$?
            echo "$declaration_status" > "build/inverse-proof/$case-declaration.status"
            "$wfc" --par --par-ledger --emit-llvm -o "build/inverse-proof/$case.ll" "build/inverse-proof/$case.wf" > "build/inverse-proof/$case-emission.log" 2>&1
            status=$?
            set -e
            echo "$status" > "build/inverse-proof/$case-emission.status"
            cat "build/inverse-proof/$case-emission.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-proof-diagnostics
          path: build/inverse-proof/
