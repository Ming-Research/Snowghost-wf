# Temporary language-gap probe; remove when the stored-field proof is supported
# and the case has moved into Whitefoot's maintained conformance tests.
name: inverse-proof

on:
  push:
    branches: [research/inverse-proof-case]
    paths:
      - research/investigations/m2-edit-cost/inverse-proof/**
      - .github/workflows/inverse-proof.yml
      - whitefoot.pin
      - whitefoot-kit

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download the pinned compiler
        run: make compiler
      - name: Check both programs and retain full diagnostics
        shell: bash
        run: |
          set -euo pipefail
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          compiler="$PWD/build/whitefoot/$release/whitefootc"
          cases=research/investigations/m2-edit-cost/inverse-proof
          mkdir -p build/inverse-proof
          git rev-parse HEAD
          cat "build/whitefoot/$release/whitefoot-release.json"
          for case in today natural; do
            status=0
            "$compiler" --check "$cases/$case.wf" > "build/inverse-proof/$case.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "build/inverse-proof/$case.status"
            printf '\n%s.wf: exit %s\n' "$case" "$status"
            cat "build/inverse-proof/$case.log"
          done
          test "$(cat build/inverse-proof/today.status)" = 0
          test "$(cat build/inverse-proof/natural.status)" != 0
          grep -F 'RANGE-1' build/inverse-proof/natural.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-proof-diagnostics
          path: build/inverse-proof/
          if-no-files-found: error
