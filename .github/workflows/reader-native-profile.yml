# One-use diagnosis of the remaining sentence gap; retire after capture.
name: reader-native-profile
on:
  push:
    branches: [research/m2-frag-a]
jobs:
  disassemble:
    if: contains(github.event.head_commit.message, '[reader-disasm]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Frozen native-profile drivers and call sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          for name in frontier frontiertwin a atwin; do
            gh run download 37861961788 --repo Ming-Research/Snowghost-wf -n "driver-$name" --dir "drivers/$name"
          done
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          for path in sorted(Path('drivers').glob('*/layout_oracle_*')):
              label = path.parent.name + '-' + path.name
              prefix = Path('evidence') / label
              Path(str(prefix) + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '\n')
              symbols = subprocess.check_output(['nm', '-n', '--defined-only', str(path)], text=True)
              Path(str(prefix) + '.symbols').write_text(symbols)
              selected = [line.split()[-1] for line in symbols.splitlines() if line.split() and any(name in line.split()[-1] for name in ('effective_output', 'boundary_output', 'range_inherited', 'wf__par_join', 'wf__par_worker_main'))]
              with Path(str(prefix) + '.asm').open('wb') as output:
                  for symbol in selected:
                      subprocess.run(['objdump', '-drwC', '--disassemble=' + symbol, str(path)], stdout=output, check=True)
              with Path(str(prefix) + '.frames').open('wb') as output:
                  subprocess.run(['readelf', '--debug-dump=frames-interp', str(path)], stdout=output, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-callsite-evidence
          path: |
            evidence/
            drivers/*/revision.txt
            drivers/*/pin-only.patch
  profile:
    if: contains(github.event.head_commit.message, '[reader-native]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Frozen geometry-reader and frontier drivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in frontier frontiertwin a atwin; do
            gh run download 37861961788 -n "driver-$name" --dir "build/drivers/driver-$name"
          done
          chmod +x build/drivers/driver-*/layout_oracle_*
      - name: Profiler and fonts
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends linux-tools-$(uname -r) fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          sudo sysctl kernel.perf_event_paranoid=-1
          uname -a | tee build/machine.txt
          lscpu | tee -a build/machine.txt
          perf --version | tee -a build/machine.txt
      - name: Matching page and edit script
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          test -s build/research/concurrency/html5.html
          make -s oracle-fonts
          cp build/drivers/driver-frontier/layout_oracle_seq build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare html5
      - name: Bound and collect the three execution settings
        run: python3 .github/timing/profile-readers-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-native-evidence
          path: |
            build/machine.txt
            build/reader-native/
            build/drivers/driver-*/revision.txt
            build/drivers/driver-*/pin-only.patch
