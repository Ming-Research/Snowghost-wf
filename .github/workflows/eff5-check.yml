# Temporary: front-end check of Snowghost's renderer with Whitefoot's
# experiment wf-exp-4d8025bb69ec (Whitefoot#373, EFF-5 for one object passed
# to two reference parameters) against the control wf-8ffb6d93241f.
# Remove once the result is reported to Whitefoot.
name: eff5-check
on:
  push:
    branches: [research/wf-exp-4d80-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # #64 (main plus the afe effect-row fix) and research/paged-retest-base
        # (research/m2-layout plus the same fix); without the fix afe.wf stops
        # the check before the layout modules.
        source: [research/wf-upgrade-7062, research/paged-retest-base]
        release: [wf-exp-4d8025bb69ec, wf-8ffb6d93241f]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: |
          set -eu
          sed -i 's/^release = .*/release = ${{ matrix.release }}/' whitefoot.pin
          make -s compiler
      - name: Source tree
        run: |
          git fetch -q origin "${{ matrix.source }}"
          git worktree add -q --detach build/src FETCH_HEAD
          git -C build/src rev-parse HEAD
      - name: Check every module
        run: |
          set -u
          wfc=$GITHUB_WORKSPACE/build/whitefoot/${{ matrix.release }}/whitefootc
          cd build/src/renderer
          status=0
          time "$wfc" --graph modules.wfg --check-modules > "$RUNNER_TEMP/check.log" 2>&1 || status=$?
          echo "exit $status"
          grep -E 'error\[' "$RUNNER_TEMP/check.log" | sort | uniq -c | sort -rn | head -50 || true
          grep -n -A6 'error\[EFF-5\]' "$RUNNER_TEMP/check.log" | head -200 || true
          tail -5 "$RUNNER_TEMP/check.log"
