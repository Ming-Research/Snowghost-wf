# Temporary, for research/cascade-layers: compiles the stored-invariant
# witness (a value read from an array element, passed where its type
# invariant is required) and its control (the same value passed fresh).
# Removed before the branch is ready.
name: stored-invariant-witness

on:
  push:
    branches: [research/cascade-layers]
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: make -s toolchain compiler
      - name: Witness and control
        run: |
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          w=research/investigations/style/stored-invariant-witness
          mkdir -p build/witness
          for f in stored fresh; do
            s=0; "$wfc" "$w/$f.wf" -o "build/witness/$f" > "build/witness/$f.log" 2>&1 || s=$?
            echo "$f.wf compile exit $s"; cat "build/witness/$f.log"
          done
