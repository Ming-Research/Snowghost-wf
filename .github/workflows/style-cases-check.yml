# Temporary, for research/logical-props: checks tests/css/style-cases.html
# (with the logical-property rows) against Chromium's computed values through
# research/investigations/style/run.sh check cases. Removed before the branch
# is ready.
name: style-cases-check

on:
  push:
    branches: [research/logical-props]
  workflow_dispatch:

jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain and reference browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-liberation
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s toolchain compiler
      - name: Chromium's dump of the style cases
        run: |
          set -euo pipefail
          mkdir -p build/oracle/style
          node tests/css/style_oracle.mjs dump tests/css/style-cases.html > build/oracle/style/cases.chromium.tsv
          wc -l build/oracle/style/cases.chromium.tsv
      - name: Style cases against Chromium
        run: sh research/investigations/style/run.sh check cases
