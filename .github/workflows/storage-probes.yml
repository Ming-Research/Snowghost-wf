name: storage probes

on:
  push:
    branches: [research/storage-mocks]

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Fetch pinned compiler
        run: |
          make compiler
          python3 - <<'PY'
          import json
          m = json.load(open('build/whitefoot/wf-f949e676acfa/whitefoot-release.json'))
          assert m['commit'] == 'f949e676acfa811f96b21afd07f02c06dcd14b51', m
          print(m)
          PY
      - name: Compile, inspect ledgers, and execute each probe
        run: |
          python3 -B research/investigations/storage-layout/run.py --self-check
          python3 -B research/investigations/storage-layout/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-probes
          path: build/storage-probes
