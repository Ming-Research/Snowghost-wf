name: storage probes

on:
  push:
    branches: [research/storage-mocks]

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Fetch pinned compiler
        run: |
          make compiler
          python3 - <<'PY'
          import json
          m = json.load(open('build/whitefoot/wf-f949e676acfa/whitefoot-release.json'))
          assert m['commit'] == 'f949e676acfa811f96b21afd07f02c06dcd14b51', m
          print(m)
          PY
      - name: Smallest useful timed sample
        run: |
          mkdir -p build/storage-probes
          /usr/bin/time -p build/whitefoot/wf-f949e676acfa/whitefootc research/investigations/storage-layout/probes/c2-fixed-stride.wf -o build/storage-probes/c2-seq
          /usr/bin/time -p build/whitefoot/wf-f949e676acfa/whitefootc --par --par-ledger research/investigations/storage-layout/probes/c2-fixed-stride.wf -o build/storage-probes/c2-par 2> build/storage-probes/c2-par.log
          cat build/storage-probes/c2-par.log
          build/storage-probes/c2-seq
          WF_WORKERS=4 build/storage-probes/c2-par
          echo 'C2 fixed-stride: sequential and parallel exit 0; every cell equals floor(index/16)+1; empty range passes.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-probes
          path: build/storage-probes
