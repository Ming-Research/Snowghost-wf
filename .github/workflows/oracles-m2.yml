# Temporary, for M2's work branches: the identity and completeness oracles
# of research/investigations/structure-edits on GitHub-hosted CI, so that no
# renderer is compiled on the owner's machine. Removed before the last M2
# branch is ready.
name: oracles-m2

on:
  push:
    branches: [research/structure-edits, research/m2-layout, research/m2-edit-cost]
  workflow_dispatch:

jobs:
  edit-cost-base-scope:
    if: contains(github.event.head_commit.message, '[base-scope]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Baseline structural refusal attribution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          git worktree add --detach build/base-source 9e1561ac4459b69d4808c3a8d41e2efc9f10b2b3
          (cd build/base-source/renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_seq")
          git -C build/base-source rev-parse HEAD > build/base-scope-revision.txt
          cat whitefoot.pin >> build/base-scope-revision.txt
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do test -s "build/research/concurrency/$file"; done
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          for page in ecma262 html5; do
            sh research/investigations/incremental-layout/run.sh inc seq "$page" block
            grep '^structure path ' "build/x5/out/$page-block.seq.txt.raw"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-scope-evidence
          path: |
            build/base-scope-revision.txt
            build/x5/scripts/*-block.edits
            build/x5/out/*-block.seq.txt.raw

  step5:
    if: contains(github.event.head_commit.message, '[oracles]') || contains(github.event.head_commit.message, '[step5]') || contains(github.event.head_commit.message, '[inventory]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Driver and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
      - name: Positioned and flex fixture identity
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          for kind in positioned flex transfer edit-cost edit-baseline edit-height; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "build/$kind-case.edits"
            time build/layout_oracle_seq edit "build/$kind-case.edits" "$s/${html}-case.html" renderer/style/ua.css > "build/$kind-case.raw"
            if ! python3 "$s/inctime.py" --check "build/$kind-case.edits" "build/$kind-case.raw"; then
              awk '$NF == "DIFF" { print "P " $2 }' "build/$kind-case.raw" >> "build/$kind-case.edits"
              build/layout_oracle_seq edit "build/$kind-case.edits" "$s/${html}-case.html" renderer/style/ua.css > "build/$kind-case.diff.raw"
              build/layout_oracle_seq incremental "build/$kind-case.edits" "$s/${html}-case.html" renderer/style/ua.css > "build/$kind-case.counts.raw"
              exit 1
            fi
            grep -E 'structure path| inc (same|DIFF|refused)$' "build/$kind-case.raw"
            if [ "$kind" = edit-baseline ]; then
              build/layout_oracle_seq incremental "build/$kind-case.edits" "$s/${html}-case.html" renderer/style/ua.css > "build/$kind-case.counts.raw"
            fi
          done
      - name: Small arithmetic fixture before the page batch
        run: python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_oracle_seq build/near-limit-step5
      - name: Structural path diagnostics
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          build/layout_oracle_seq edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css > build/block-case.raw
          grep -E 'structure path| inc (same|DIFF|refused)$' build/block-case.raw
          sh research/investigations/concurrency/run.sh fetch || true
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          for page in ecma262 html5; do
            sh research/investigations/incremental-layout/run.sh inc seq "$page" block
            cat "build/x5/scripts/$page-block.edits"
            grep 'structure path' "build/x5/out/$page-block.seq.txt.raw"
          done
          sh "$s/checkpoint-case.sh" build/layout_oracle_seq build/checkpoint-case.edits
          for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case; do
            name=${pair%%:*} html=${pair#*:}
            script="$s/$name.edits"
            if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
            build/layout_oracle_seq edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.raw"
            grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.raw"
            python3 "$s/inctime.py" --check "$script" "build/$name.raw"
          done
          differs=$(grep -c ' inc DIFF$' build/block-case.raw || true)
          refused=$(grep -c ' inc refused$' build/block-case.raw || true)
          same=$(grep -c ' inc same$' build/block-case.raw || true)
          echo "block-case: allowed 2 refusals, edits 5 and 6 insert/remove counter-incrementing paragraph 47 in box 27 and change the outgoing c state consumed by the following box; Q86 requires a full build"
          test "$differs" -eq 0
          test "$refused" -le 2
          test "$same" -gt 0
      - name: Locate boundary refusal guards
        if: always() && contains(github.event.head_commit.message, '[trace]')
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('renderer/layout/splice.wf')
          source = p.read_text()
          start = source.index('fn splice_context_ready(')
          end = source.index('\nfn splice_inputs(', start)
          body = source[start:end]
          body = body.replace('return 2_u32;', 'let kind = cvt::<u8, u32>(context^.kind);\n    let diagnostic_kind = 200_u32 +sat kind;\n    return diagnostic_kind;', 1)
          body = body.replace('return 2_u32;', 'return 210_u32;', 1)
          print('200 + context kind; 210 columns')
          reasons = ['local geometry', 'definite height', 'intrinsic or dirty', 'context fragments', 'nonordinary root transfer', 'through root transfer', 'origin and travel bound']
          assert body.count('return 7_u32;') == len(reasons)
          for code, reason in enumerate(reasons, 71):
              replacement = f'return {code}_u32;'
              if code == 75:
                  replacement = 'let diagnostic = 750_u32 +sat output.barriers;\n    return diagnostic;'
              body = body.replace('return 7_u32;', replacement, 1)
              print(code, reason)
          print('750 + barriers: 1 floats, 2 clearance, 3 constrained/marker block, 4 transfer mismatch, 5 positioned/atomic content')
          p.write_text(source[:start] + body + source[end:])
          PYEOF
          sh research/investigations/concurrency/run.sh fetch || true
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_trace)
          for page in ecma262 html5; do
            sheets=()
            if [ "$page" = ecma262 ]; then sheets=(assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css); fi
            build/layout_trace edit "build/x5/scripts/$page-block.edits" "build/research/concurrency/$page.html" renderer/style/ua.css "${sheets[@]}" > "build/$page.trace.raw"
            grep 'structure path' "build/$page.trace.raw"
          done
      - name: Inventory individual semantic predicates
        if: always() && contains(github.event.head_commit.message, '[inventory]')
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          source = r'''
          alias Styles = pkg::style::Styles;
          alias NodeId = pkg::dom::NodeId;

          fn trace_record(records: &Box<Slots<u64>>, kind: u64, context: u32, slot: u64, element: u32, detail: u64) -> result: unit writes(records) {
            doc "Appends one temporary diagnostic record with five fixed fields.";
            let context_number = cvt::<u32, u64>(context);
            let node = cvt::<u32, u64>(element);
            let first = push_item::<u64>(cell: records, value: kind, ceiling: item_ceiling);
            let second = push_item::<u64>(cell: records, value: context_number, ceiling: item_ceiling);
            let third = push_item::<u64>(cell: records, value: slot, ceiling: item_ceiling);
            let fourth = push_item::<u64>(cell: records, value: node, ceiling: item_ceiling);
            let fifth = push_item::<u64>(cell: records, value: detail, ceiling: item_ceiling);
            return unit;
          }

          fn trace_signed(value: i32) -> made: u64 pure {
            doc "Encodes an i32 diagnostic by adding 2147483648, decoded by the artifact consumer.";
            let wide = cvt::<i32, i64>(value);
            let biased = wide +sat 2147483648_i64;
            if biased >= 0_i64 {
              let made = cvt::<i64, u64>(biased);
              return made;
            }
            return 0_u64;
          }

          fn trace_flag(value: Bool) -> made: u64 pure {
            doc "Encodes an individual predicate independently of inherited barrier maxima.";
            if value {
              return 1_u64;
            }
            return 0_u64;
          }

          fn trace_context(context: &Context, styles: &Styles, serial: u32, records: &Box<Slots<u64>>) -> result: unit reads(context), reads(styles), writes(records) {
            doc "Inventories the selected context without changing renderer behavior.";
            if context^.slot == serial {
              let kind = cvt::<u8, u64>(context^.kind);
              trace_record(records: records, kind: 1_u64, context: serial, slot: 0_u64, element: context^.style.element, detail: kind);
              let frame = flow_frame(styles: styles, style: context^.style, space: context^.space, width: context^.width);
              let flow_end = trace_signed(value: context^.flow_end);
              trace_record(records: records, kind: 21_u64, context: serial, slot: 0_u64, element: context^.style.element, detail: flow_end);
              for (b in 0_u64..context^.blocks.inner.len) {
                let held = block_snapshot(block: &context^.blocks.inner[b]);
                let group = box_of(styles: styles, style: held.style);
                let output = context^.blocks.inner[b].boundary;
                let measured = context^.blocks.inner[b].output;
                let block_frame = measured.top_frame +sat measured.bottom_frame;
                let specified = specified_height(styles: styles, style: held.style, basis: measured.basis_height, frame: block_frame);
                let (minimum, maximum) = height_limits(styles: styles, style: held.style, basis: measured.basis_height, frame: block_frame);
                let detail_2 = cvt::<u32, u64>(output.barriers);
                trace_record(records: records, kind: 2_u64, context: serial, slot: b, element: held.style.element, detail: detail_2);
                let detail_5 = cvt::<u8, u64>(group.position);
                trace_record(records: records, kind: 5_u64, context: serial, slot: b, element: held.style.element, detail: detail_5);
                let predicate_10 = specified >= 0_i32;
                let detail_10 = trace_flag(value: predicate_10);
                trace_record(records: records, kind: 10_u64, context: serial, slot: b, element: held.style.element, detail: detail_10);
                let predicate_11 = minimum > block_frame;
                let detail_11 = trace_flag(value: predicate_11);
                trace_record(records: records, kind: 11_u64, context: serial, slot: b, element: held.style.element, detail: detail_11);
                let predicate_12 = maximum >= 0_i32;
                let detail_12 = trace_flag(value: predicate_12);
                trace_record(records: records, kind: 12_u64, context: serial, slot: b, element: held.style.element, detail: detail_12);
                let detail_13 = trace_flag(value: held.marker);
                trace_record(records: records, kind: 13_u64, context: serial, slot: b, element: held.style.element, detail: detail_13);
                let detail_14 = cvt::<u32, u64>(output.first_line.slot);
                trace_record(records: records, kind: 14_u64, context: serial, slot: b, element: held.style.element, detail: detail_14);
                let detail_15 = cvt::<u32, u64>(output.last_line.slot);
                trace_record(records: records, kind: 15_u64, context: serial, slot: b, element: held.style.element, detail: detail_15);
                let detail_16 = cvt::<u32, u64>(output.first_line.owner);
                trace_record(records: records, kind: 16_u64, context: serial, slot: b, element: held.style.element, detail: detail_16);
                let detail_17 = cvt::<u32, u64>(output.last_line.owner);
                trace_record(records: records, kind: 17_u64, context: serial, slot: b, element: held.style.element, detail: detail_17);
                let detail_18 = cvt::<u32, u64>(held.flow_at);
                trace_record(records: records, kind: 18_u64, context: serial, slot: b, element: held.style.element, detail: detail_18);
                let detail_19 = cvt::<u32, u64>(held.parent);
                trace_record(records: records, kind: 19_u64, context: serial, slot: b, element: held.style.element, detail: detail_19);
                let detail_25 = trace_flag(value: measured.reads_floats);
                trace_record(records: records, kind: 25_u64, context: serial, slot: b, element: held.style.element, detail: detail_25);
                let detail_26 = cvt::<u8, u64>(group.clear);
                trace_record(records: records, kind: 26_u64, context: serial, slot: b, element: held.style.element, detail: detail_26);
                let detail_27 = trace_signed(value: minimum);
                trace_record(records: records, kind: 27_u64, context: serial, slot: b, element: held.style.element, detail: detail_27);
                let detail_28 = trace_signed(value: maximum);
                trace_record(records: records, kind: 28_u64, context: serial, slot: b, element: held.style.element, detail: detail_28);
                let detail_29 = trace_signed(value: specified);
                trace_record(records: records, kind: 29_u64, context: serial, slot: b, element: held.style.element, detail: detail_29);
                trace_record(records: records, kind: 30_u64, context: serial, slot: b, element: held.style.element, detail: output.floats);
              }
              for (n in 0_u64..context^.naturals.inner.len) {
                let natural = trace_signed(value: context^.naturals.inner[n]);
                trace_record(records: records, kind: 20_u64, context: serial, slot: n, element: context^.style.element, detail: natural);
              }
              for (p in 0_u64..context^.paragraphs.inner.len) {
                let atomics = context^.paragraphs.inner[p].atomics.inner.len;
                if atomics > 0_u64 {
                  trace_record(records: records, kind: 3_u64, context: serial, slot: p, element: context^.paragraphs.inner[p].style.element, detail: atomics);
                }
              }
              for (c in 0_u64..context^.children.inner.len) {
                let child = &context^.children.inner[c];
                let child_group = box_of(styles: styles, style: child^.style);
                if child_group.position >= position_absolute {
                  let position = cvt::<u8, u64>(child_group.position);
                  trace_record(records: records, kind: 4_u64, context: serial, slot: c, element: child^.style.element, detail: position);
                }
                if child_group.float != float_none {
                  let origin = child_position(context: context, at: c);
                  let (float_dx, float_dy) = block_relative_offset(context: context, styles: styles, block: child^.block);
                  let bottom = old_float_bottom(child: child, position: origin, content_top: frame.content_top, dy: float_dy);
                  let bottom_detail = trace_signed(value: bottom);
                  trace_record(records: records, kind: 22_u64, context: serial, slot: c, element: child^.style.element, detail: bottom_detail);
                  let float_rank = cvt::<u32, u64>(child^.flow_at);
                  trace_record(records: records, kind: 23_u64, context: serial, slot: c, element: child^.style.element, detail: float_rank);
                  let float_block = cvt::<u32, u64>(child^.block);
                  trace_record(records: records, kind: 24_u64, context: serial, slot: c, element: child^.style.element, detail: float_block);
                }
              }
              return unit;
            }
            for (c in 0_u64..context^.children.inner.len) {
              trace_context(context: &context^.children.inner[c], styles: styles, serial: serial, records: records);
            }
            return unit;
          }

          fn splice_semantic_trace(layout: &Layout, styles: &Styles, parent: NodeId) -> made: Box<Slots<u64>> reads(layout), reads(styles) {
            doc "Returns the selected owner and ancestor contexts before the first edit.";
            let owner = splice_owner(layout: layout, node: parent);
            let records = box_slots_new::<u64>(capacity: 0_u64);
            let owner_block = cvt::<u32, u64>(owner.block);
            trace_record(records: &records, kind: 0_u64, context: owner.serial, slot: owner_block, element: parent.index, detail: 0_u64);
            let serial = owner.serial;
            for (depth in 0_u64..layout^.paths.len) {
              if serial == no_index {
                return move records;
              }
              trace_context(context: &layout^.root, styles: styles, serial: serial, records: &records);
              let directory = cvt::<u32, u64>(serial);
              let path = route_read::<ContextPath>(table: &layout^.paths, at: directory);
              set serial = path.parent;
            }
            return move records;
          }
          '''
          target = Path('renderer/layout/semantic_trace.wf')
          assert not target.exists(), target
          module = Path('renderer/layout/module.wfm')
          interface = module.read_text()
          assert 'splice_semantic_trace' not in interface
          oracle = Path('renderer/oracle/layout/edit.wf')
          body = oracle.read_text()
          assert 'splice_semantic_trace' not in body
          start = body.index('fn apply_structure_edit(')
          needle = '  let style_started = now(clock: clock);'
          end = body.index('\nfn ', start + 1)
          assert body[start:end].count(needle) == 1
          at = body.index(needle, start)
          printing = r'''
            if number == 1_u64 {
              let diagnostic = pkg::layout::splice_semantic_trace(layout: &kept^.layout, styles: &kept^.state.styles, parent: parent);
              let label: Array<u8, 9> = "semantic ";
              let records = diagnostic.inner.len / 5_u64;
              for (record in 0_u64..records) {
                put_text(buffer: report, text: &label[0_u64..9_u64]);
                for (field in 0_u64..5_u64) {
                  let offset = record *sat 5_u64;
                  let index = offset +sat field;
                  if index < diagnostic.inner.len {
                    put_decimal(buffer: report, value: diagnostic.inner[index]);
                    put_byte(buffer: report, value: 32_u8);
                  }
                }
                put_byte(buffer: report, value: 10_u8);
              }
            }
          '''
          Path('build/inventory.semantic.legend').write_text('Records: kind context payload-slot style-NodeId detail. Kind 0 owner (slot is owner block); 1 context kind; 2 maximum barrier; 3 atomic count; 4 positioned child; 5 block position; 10 specified>=0; 11 minimum>frame; 12 maximum>=0; 13 marker; 14 first-line slot; 15 last-line slot; 16 first-line owner; 17 last-line owner; 18 block flow rank; 19 parent block; 20 natural (slot is flow rank); 21 flow end; 22 float margin bottom in flow coordinates; 23 float flow rank; 24 float parent block; 25 reads_floats; 26 clear; 27 minimum; 28 maximum; 29 specified; 30 exported floats. Signed kinds 20,21,22,27,28,29 have 2147483648 added; subtract to decode. no_index is 4294967295. Inventories the selected owner context and every ancestor context before the first block edit.\n')
          target.write_text(source.lstrip("\n"))
          module.write_text(interface + "\n" + 'public fn splice_semantic_trace(layout: &Layout, styles: &Styles, parent: NodeId) -> made: Box<Slots<u64>> reads(layout), reads(styles) doc "Temporary constituent inventory injected only after ordinary checks; removed after the argument is established.";' + "\n")
          oracle.write_text(body[:at] + printing.lstrip("\n") + body[at:])
          PYEOF
          sh research/investigations/concurrency/run.sh fetch || true
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_semantic)
          for page in ecma262 html5; do
            python3 - "$page" <<'PYEOF'
          import sys
          from pathlib import Path
          page = sys.argv[1]
          lines = Path(f'build/x5/scripts/{page}-block.edits').read_text().splitlines()
          first = next(i for i, line in enumerate(lines) if line.startswith('B '))
          Path(f'build/{page}.semantic.edits').write_text('\n'.join(lines[:first + 1]) + '\n')
          PYEOF
            sheets=()
            if [ "$page" = ecma262 ]; then sheets=(assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css); fi
            build/layout_semantic edit "build/$page.semantic.edits" "build/research/concurrency/$page.html" renderer/style/ua.css "${sheets[@]}" > "build/$page.semantic.raw"
            grep -E '^semantic 0 |structure path| inc (same|DIFF|refused)$' "build/$page.semantic.raw"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step5-diagnostics
          path: |
            build/near-limit-step5/
            build/block-case.raw
            build/splice-route-case.raw
            build/splice-style-case.raw
            build/checkpoint-case.*
            build/positioned-case.*
            build/flex-case.*
            build/transfer-case.*
            build/edit-cost-case.*
            build/edit-baseline-case.*
            build/edit-height-case.*
            build/*.trace.raw
            build/*.semantic.*
            build/x5/scripts/*-block.edits
            build/x5/out/*-block.seq.txt.raw
            build/x5/*.nodes
  oracles:
    # On the layout branch, only for a head commit that asks for it.
    if: (github.ref != 'refs/heads/research/m2-layout' && github.ref != 'refs/heads/research/m2-edit-cost') || contains(github.event.head_commit.message, '[oracles]')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Toolchain and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol

      - name: Drivers
        run: |
          set -euo pipefail
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/m1
          (cd renderer && "$wfc" --graph modules.wfg --entry style_oracle -o ../build/m1/style_seq)
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          (cd renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par)
          echo "WFC=$wfc" >> "$GITHUB_ENV"

      - name: Style fixtures (reach and structure)
        run: |
          set -euo pipefail
          sh research/investigations/incremental-style/run.sh reach structure case full
          sh research/investigations/incremental-style/run.sh reach sides case
          sh research/investigations/incremental-style/run.sh reach ofclause case
          sh research/investigations/incremental-style/run.sh structure structure case

      - name: The of-clause case fails before its fix (falsifier)
        run: |
          set -euo pipefail
          git worktree add -q --detach build/before 8e69668
          (cd build/before/renderer && "$WFC" --graph modules.wfg --entry style_oracle -o "$GITHUB_WORKSPACE/build/m1/style_before")
          if STYLE=build/m1/style_before sh research/investigations/incremental-style/run.sh reach ofclause case; then
            echo "the reach check passed on 8e69668, which lacks the of-clause fix" >&2
            exit 1
          fi
          grep -c 'missing [1-9]' build/m1/reach/ofclause-case.txt

      - name: Pages
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for f in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do test -f "build/research/concurrency/$f"; done
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5

      - name: Full-build dumps against the base (layout branch)
        if: contains(fromJSON('["refs/heads/research/m2-layout","refs/heads/research/m2-edit-cost"]'), github.ref)
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD origin/research/structure-edits)
          git worktree add -q --detach build/base "$base"
          (cd build/base/renderer && "$WFC" --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_base")
          echo "base $(git rev-parse --short "$base")"
          sh research/investigations/incremental-layout/run.sh dumps build/layout_oracle_base ecma262 html5
          for case in tests/layout/*-cases.html research/investigations/structure-edits/scripts/saturation-case.html; do
            build/layout_oracle_base dump 1 "$case" renderer/style/ua.css > build/case.base.dump
            build/layout_oracle_seq dump 1 "$case" renderer/style/ua.css > build/case.seq.dump
            WF_WORKERS=4 build/layout_oracle_par dump 1 "$case" renderer/style/ua.css > build/case.par.dump
            cmp build/case.base.dump build/case.seq.dump
            cmp build/case.seq.dump build/case.par.dump
            echo "$case: identical to the base, seq and par ($(wc -c < build/case.seq.dump) bytes)"
          done

      - name: Style on the pages' block edits
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            sh research/investigations/incremental-style/run.sh reach "$page" block
            sh research/investigations/incremental-style/run.sh structure "$page" block
          done

      - name: X5's case pages, seq and par
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          sh "$s/checkpoint-case.sh" build/layout_oracle_seq build/checkpoint-case.edits
          for build in seq par; do
            for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case; do
              name=${pair%%:*} html=${pair#*:}
              script="$s/$name.edits"
              if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
              WF_WORKERS=4 build/layout_oracle_$build edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.$build.raw"
              python3 "$s/inctime.py" --check "$script" "build/$name.$build.raw"
              echo "$name ($build): every edit matches its full rebuild"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.$build.raw"
            done
          done
          for build in seq par; do
            WF_WORKERS=4 python3 "$s/near-limit.py" build/layout_oracle_$build "build/near-limit-$build"
          done
          for case in block-case:2 style-case:6; do
            name=${case%%:*} allowed=${case#*:}
            for build in seq par; do
              build/layout_oracle_$build edit "research/investigations/incremental-layout/scripts/$name.edits" "research/investigations/incremental-layout/scripts/$name.html" renderer/style/ua.css > "build/$name.$build.raw"
              same=$(grep -c ' inc same$' "build/$name.$build.raw" || true)
              differs=$(grep -c ' inc DIFF$' "build/$name.$build.raw" || true)
              refused=$(grep -c ' inc refused$' "build/$name.$build.raw" || true)
              echo "$name ($build): inc same $same, DIFF $differs, refused $refused (at most $allowed allowed)"
              if [ "$name" = block-case ]; then
                echo "Allowed 2 refusals: edits 5 and 6 insert/remove counter-incrementing paragraph 47 in box 27 and change the outgoing c state consumed by the following box; Q86 requires a full build"
              fi
              grep -o 'structure path [0-9]* splice [01] reason [0-9]*' "build/$name.$build.raw" | tr '\n' ';' | sed 's/structure path //g; s/;$/\n/' || true
              grep ' inc refused$' "build/$name.$build.raw" || true
              test "$differs" -eq 0
              test "$refused" -le "$allowed"
              test "$same" -gt 0
            done
          done
          for build in seq par; do
            WF_WORKERS=4 build/layout_oracle_$build edit research/investigations/incremental-layout/scripts/boundary-case.edits research/investigations/incremental-layout/scripts/block-case.html renderer/style/ua.css > "build/boundary-case.$build.raw"
            python3 research/investigations/incremental-layout/scripts/inctime.py --check research/investigations/incremental-layout/scripts/boundary-case.edits "build/boundary-case.$build.raw"
          done
          s=research/investigations/incremental-layout/scripts
          build/layout_oracle_seq nodes 0 $s/boundary-baseline-case.html renderer/style/ua.css | head -30
          for build in seq par; do
            WF_WORKERS=4 build/layout_oracle_$build edit $s/boundary-baseline-case.edits $s/boundary-baseline-case.html renderer/style/ua.css > "build/boundary-baseline-case.$build.raw"
            python3 $s/inctime.py --check $s/boundary-baseline-case.edits "build/boundary-baseline-case.$build.raw"
            grep -E 'inc (same|DIFF|refused)$|boundary_fallbacks' "build/boundary-baseline-case.$build.raw" | sed 's/.*\(boundary_fallbacks [0-9]* boundary_reason [0-9]*\).*/\1/'
            same=$(grep -c ' inc same$' "build/boundary-baseline-case.$build.raw" || true)
            differs=$(grep -c ' inc DIFF$' "build/boundary-baseline-case.$build.raw" || true)
            echo "boundary-baseline-case ($build): inc same $same, DIFF $differs"
            test "$differs" -eq 0
            test "$same" -eq 8
          done
      - name: Positioned and flex fixture identity, seq and par
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          for kind in positioned flex transfer edit-cost edit-baseline edit-height; do
            html=${kind/edit-cost/transfer}
            html=${html/edit-baseline/style}
            html=${html/edit-height/style}
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "build/$kind-case.edits"
            for build in seq par; do
              WF_WORKERS=4 build/layout_oracle_$build edit "build/$kind-case.edits" "$s/${html}-case.html" renderer/style/ua.css > "build/$kind-case.$build.raw"
              python3 "$s/inctime.py" --check "build/$kind-case.edits" "build/$kind-case.$build.raw"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$kind-case.$build.raw"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: page-identity-inputs
          compression-level: 1
          path: |
            build/layout_oracle_seq
            build/layout_oracle_par
            build/fonts/
            build/research/concurrency/
            build/x5/scripts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-arithmetic-oracles
          path: |
            build/near-limit-*/
            build/*.raw
            build/x5/out/*.raw

  page-identity:
    needs: oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        page: [ecma262, html5]
        kind: [word, sentence, colour, fontsize, rootfont, block]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: page-identity-inputs
          path: build
      - name: Layout identity and sequential/parallel equality
        env:
          PAGE: ${{ matrix.page }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          chmod +x build/layout_oracle_seq build/layout_oracle_par
          sh research/investigations/incremental-layout/run.sh inc seq "$PAGE" "$KIND"
          WF_WORKERS=4 sh research/investigations/incremental-layout/run.sh inc par "$PAGE" "$KIND"
          sh research/investigations/incremental-layout/run.sh same "$PAGE" "$KIND"
      - name: Page block edits require zero fallbacks
        if: matrix.kind == 'block'
        run: |
          set -euo pipefail
          for page in "${{ matrix.page }}"; do
            for build in seq par; do
              python3 - "build/x5/out/$page-block.$build.txt.raw" <<'PYEOF'
          import re
          import sys
          from pathlib import Path
          def require_local(source):
              paths = re.findall(r'^structure path (\d+) splice ([01]) reason (\d+)$', source, re.M)
              assert paths and all(local == '1' and reason == '0' for _, local, reason in paths), paths
              return paths
          require_local('structure path 1 splice 1 reason 0\n')
          for bad in ('', 'structure path 1 splice 0 reason 0\n', 'structure path 1 splice 1 reason 7\n'):
              try:
                  require_local(bad)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('zero-fallback assertion accepted a deliberate fault')
          print('detected missing paths, a nonlocal path and a nonzero reason', flush=True)
          paths = require_local(Path(sys.argv[1]).read_text())
          print(sys.argv[1], len(paths), 'local splices, zero fallbacks')
          PYEOF
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-${{ matrix.page }}-${{ matrix.kind }}
          path: build/x5/out/

  probe-diagnostics:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Instrument and compile diagnostic driver
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          python3 research/investigations/m2-edit-cost/probe.py > build/probe-legend.txt
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
      - name: Observe the first word edit and independent guard fixtures
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css; do test -s "build/research/concurrency/$file"; done
          sh research/investigations/incremental-layout/run.sh prepare ecma262
          head -n 2 build/x5/scripts/ecma262-word.edits > build/probe-word.edits
          build/layout_oracle_seq incremental build/probe-word.edits build/research/concurrency/ecma262.html renderer/style/ua.css assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css > build/probe-word.raw
          s=research/investigations/incremental-layout/scripts
          for kind in edit-baseline edit-height; do
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "build/probe-$kind.edits"
            build/layout_oracle_seq incremental "build/probe-$kind.edits" "$s/style-case.html" renderer/style/ua.css > "build/probe-$kind.raw"
            build/layout_oracle_seq edit "build/probe-$kind.edits" "$s/style-case.html" renderer/style/ua.css > "build/probe-$kind.dumps"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-diagnostics
          path: build/probe-*
