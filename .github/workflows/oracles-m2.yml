# Temporary upgrade validation, restored from the main-era M2 oracle.
# Remove before marking the upgrade branch ready.
name: oracles-m2

on:
  push:
    branches: [research/wf-upgrade-f887]
  workflow_dispatch:

jobs:
  oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Toolchain and fonts
        run: |
          make toolchain
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol

      - name: Drivers
        run: |
          set -euo pipefail
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/m1
          (cd renderer && "$wfc" --cache ../build/whitefoot-cache --fragments function --graph modules.wfg --entry style_oracle -o ../build/m1/style_seq)
          (cd renderer && "$wfc" --cache ../build/whitefoot-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          (cd renderer && "$wfc" --cache ../build/whitefoot-cache --fragments function --par --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par)
          echo "WFC=$wfc" >> "$GITHUB_ENV"

      - name: Style fixtures (reach and structure)
        run: |
          set -euo pipefail
          sh research/investigations/incremental-style/run.sh reach structure case full
          sh research/investigations/incremental-style/run.sh reach sides case
          sh research/investigations/incremental-style/run.sh reach ofclause case
          sh research/investigations/incremental-style/run.sh structure structure case

      - name: The of-clause case fails before its fix (falsifier)
        run: |
          set -euo pipefail
          git worktree add -q --detach build/before 8e69668
          # The historical source requires the old FN-1 rule. Compile it
          # with the upgrade's base compiler, preserving the semantic falsifier.
          git show 9d720c49daf4de746d507f5b1400ea407e3dfc09:whitefoot.pin > build/before.pin
          make compiler PIN="$PWD/build/before.pin"
          before_wfc=$(realpath build/whitefoot/wf-0b7f5c5b9854/whitefootc)
          (cd build/before/renderer && "$before_wfc" --graph modules.wfg --entry style_oracle -o "$GITHUB_WORKSPACE/build/m1/style_before")
          if STYLE=build/m1/style_before sh research/investigations/incremental-style/run.sh reach ofclause case; then
            echo "the reach check passed on 8e69668, which lacks the of-clause fix" >&2
            exit 1
          fi
          grep -c 'missing [1-9]' build/m1/reach/ofclause-case.txt

      - name: Pages
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for f in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do test -f "build/research/concurrency/$f"; done
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5

      - name: Style on the pages' block edits
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            sh research/investigations/incremental-style/run.sh reach "$page" block
            sh research/investigations/incremental-style/run.sh structure "$page" block
          done

      - name: Layout identity on the pages' block edits, seq and par
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            sh research/investigations/incremental-layout/run.sh inc seq "$page" block
            WF_WORKERS=4 sh research/investigations/incremental-layout/run.sh inc par "$page" block
            sh research/investigations/incremental-layout/run.sh same "$page" block
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-identity
          path: |
            build/m1/reach/
            build/m1/structure/
            build/x5/out/
