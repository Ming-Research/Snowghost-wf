# Temporary, for M2's work branches: the identity and completeness oracles
# of research/investigations/structure-edits on GitHub-hosted CI, so that no
# renderer is compiled on the owner's machine. Removed before the last M2
# branch is ready.
name: oracles-m2

on:
  push:
    branches: [research/structure-edits, research/m2-layout]
  workflow_dispatch:

jobs:
  step5:
    if: contains(github.event.head_commit.message, '[oracles]') || contains(github.event.head_commit.message, '[step5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Driver and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
      - name: Positioned and flex fixture identity
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          for kind in positioned flex transfer; do
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "build/$kind-case.edits"
            time build/layout_oracle_seq edit "build/$kind-case.edits" "$s/$kind-case.html" renderer/style/ua.css > "build/$kind-case.raw"
            fixture_status=0
            if python3 "$s/inctime.py" --check "build/$kind-case.edits" "build/$kind-case.raw"; then
              if python3 "$s/splice-cases.py" --check-paths "build/$kind-case.edits.paths" "build/$kind-case.raw"; then
                :
              else
                fixture_status=$?
              fi
            else
              fixture_status=$?
            fi
            if [ "$fixture_status" -ne 0 ]; then
              python3 - "$kind" <<'PYEOF' || true
          import re
          import sys
          from pathlib import Path
          kind = sys.argv[1]
          raw = Path(f'build/{kind}-case.raw').read_text()
          numbers = sorted(set(map(int, re.findall(r'^edit (\d+) hash [0-9a-f]{16} bytes \d+ inc DIFF$', raw, re.M))))
          debug = Path(f'build/{kind}-case.debug.edits')
          debug.unlink(missing_ok=True)
          if numbers:
              edits = Path(f'build/{kind}-case.edits').read_text()
              debug.write_text(''.join(f'P {number}\n' for number in numbers) + edits)
              print(kind, 'capture differing edits', numbers)
          else:
              print(kind, 'no inc DIFF rows; original raw preserves the failing paths or protocol')
          PYEOF
              if [ -f "build/$kind-case.debug.edits" ]; then
                build/layout_oracle_seq edit "build/$kind-case.debug.edits" "$s/$kind-case.html" renderer/style/ua.css > "build/$kind-case.debug.raw" 2> "build/$kind-case.debug.err" || true
              fi
              exit "$fixture_status"
            fi
            grep -E 'structure path| inc (same|DIFF|refused)$' "build/$kind-case.raw"
          done
      - name: Small arithmetic fixture before the page batch
        run: python3 research/investigations/incremental-layout/scripts/near-limit.py build/layout_oracle_seq build/near-limit-step5
      - name: Structural path diagnostics
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          build/layout_oracle_seq edit "$s/block-case.edits" "$s/block-case.html" renderer/style/ua.css > build/block-case.raw
          grep -E 'structure path| inc (same|DIFF|refused)$' build/block-case.raw
          sh research/investigations/concurrency/run.sh fetch || true
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5
          for page in ecma262 html5; do
            sh research/investigations/incremental-layout/run.sh inc seq "$page" block
            cat "build/x5/scripts/$page-block.edits"
            grep 'structure path' "build/x5/out/$page-block.seq.txt.raw"
          done
          sh "$s/checkpoint-case.sh" build/layout_oracle_seq build/checkpoint-case.edits
          for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case; do
            name=${pair%%:*} html=${pair#*:}
            script="$s/$name.edits"
            if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
            build/layout_oracle_seq edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.raw"
            grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.raw"
            python3 "$s/inctime.py" --check "$script" "build/$name.raw"
          done
          differs=$(grep -c ' inc DIFF$' build/block-case.raw || true)
          refused=$(grep -c ' inc refused$' build/block-case.raw || true)
          same=$(grep -c ' inc same$' build/block-case.raw || true)
          echo "block-case: allowed 2 refusals, edits 5 and 6 insert/remove counter-incrementing paragraph 47 in box 27 and change the outgoing c state consumed by the following box; Q86 requires a full build"
          test "$differs" -eq 0
          test "$refused" -le 2
          test "$same" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step5-diagnostics
          path: |
            build/near-limit-step5/
            build/block-case.raw
            build/splice-route-case.raw
            build/splice-style-case.raw
            build/checkpoint-case.*
            build/positioned-case.*
            build/flex-case.*
            build/transfer-case.*
            build/x5/scripts/*-block.edits
            build/x5/out/*-block.seq.txt.raw
            build/x5/*.nodes
  oracles:
    # On the layout branch, only for a head commit that asks for it.
    if: github.ref != 'refs/heads/research/m2-layout' || contains(github.event.head_commit.message, '[oracles]')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Toolchain and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol

      - name: Drivers
        run: |
          set -euo pipefail
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/m1
          (cd renderer && "$wfc" --graph modules.wfg --entry style_oracle -o ../build/m1/style_seq)
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          (cd renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par)
          echo "WFC=$wfc" >> "$GITHUB_ENV"

      - name: Style fixtures (reach and structure)
        run: |
          set -euo pipefail
          sh research/investigations/incremental-style/run.sh reach structure case full
          sh research/investigations/incremental-style/run.sh reach sides case
          sh research/investigations/incremental-style/run.sh reach ofclause case
          sh research/investigations/incremental-style/run.sh structure structure case

      - name: The of-clause case fails before its fix (falsifier)
        run: |
          set -euo pipefail
          git worktree add -q --detach build/before 8e69668
          (cd build/before/renderer && "$WFC" --graph modules.wfg --entry style_oracle -o "$GITHUB_WORKSPACE/build/m1/style_before")
          if STYLE=build/m1/style_before sh research/investigations/incremental-style/run.sh reach ofclause case; then
            echo "the reach check passed on 8e69668, which lacks the of-clause fix" >&2
            exit 1
          fi
          grep -c 'missing [1-9]' build/m1/reach/ofclause-case.txt

      - name: Pages
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for f in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html; do test -f "build/research/concurrency/$f"; done
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5

      - name: Full-build dumps against the base (layout branch)
        if: github.ref == 'refs/heads/research/m2-layout'
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD origin/research/structure-edits)
          git worktree add -q --detach build/base "$base"
          (cd build/base/renderer && "$WFC" --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/layout_oracle_base")
          echo "base $(git rev-parse --short "$base")"
          sh research/investigations/incremental-layout/run.sh dumps build/layout_oracle_base ecma262 html5
          for case in tests/layout/*-cases.html research/investigations/structure-edits/scripts/saturation-case.html; do
            build/layout_oracle_base dump 1 "$case" renderer/style/ua.css > build/case.base.dump
            build/layout_oracle_seq dump 1 "$case" renderer/style/ua.css > build/case.seq.dump
            WF_WORKERS=4 build/layout_oracle_par dump 1 "$case" renderer/style/ua.css > build/case.par.dump
            cmp build/case.base.dump build/case.seq.dump
            cmp build/case.seq.dump build/case.par.dump
            echo "$case: identical to the base, seq and par ($(wc -c < build/case.seq.dump) bytes)"
          done

      - name: Style on the pages' block edits
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            sh research/investigations/incremental-style/run.sh reach "$page" block
            sh research/investigations/incremental-style/run.sh structure "$page" block
          done

      - name: Layout identity on the pages' edits and X5's case pages, seq and par
        env:
          KINDS: word sentence colour fontsize rootfont block
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            sh research/investigations/incremental-layout/run.sh inc seq "$page" $KINDS
            WF_WORKERS=4 sh research/investigations/incremental-layout/run.sh inc par "$page" $KINDS
            sh research/investigations/incremental-layout/run.sh same "$page" $KINDS
          done
          s=research/investigations/incremental-layout/scripts
          sh "$s/checkpoint-case.sh" build/layout_oracle_seq build/checkpoint-case.edits
          for build in seq par; do
            for pair in splice-route-case:block-case splice-style-case:block-case checkpoint-case:checkpoint-case; do
              name=${pair%%:*} html=${pair#*:}
              script="$s/$name.edits"
              if [ "$name" = checkpoint-case ]; then script=build/checkpoint-case.edits; fi
              WF_WORKERS=4 build/layout_oracle_$build edit "$script" "$s/$html.html" renderer/style/ua.css > "build/$name.$build.raw"
              python3 "$s/inctime.py" --check "$script" "build/$name.$build.raw"
              echo "$name ($build): every edit matches its full rebuild"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$name.$build.raw"
            done
          done
          for build in seq par; do
            WF_WORKERS=4 python3 "$s/near-limit.py" build/layout_oracle_$build "build/near-limit-$build"
          done
          for case in block-case:2 style-case:6; do
            name=${case%%:*} allowed=${case#*:}
            for build in seq par; do
              build/layout_oracle_$build edit "research/investigations/incremental-layout/scripts/$name.edits" "research/investigations/incremental-layout/scripts/$name.html" renderer/style/ua.css > "build/$name.$build.raw"
              same=$(grep -c ' inc same$' "build/$name.$build.raw" || true)
              differs=$(grep -c ' inc DIFF$' "build/$name.$build.raw" || true)
              refused=$(grep -c ' inc refused$' "build/$name.$build.raw" || true)
              echo "$name ($build): inc same $same, DIFF $differs, refused $refused (at most $allowed allowed)"
              if [ "$name" = block-case ]; then
                echo "Allowed 2 refusals: edits 5 and 6 insert/remove counter-incrementing paragraph 47 in box 27 and change the outgoing c state consumed by the following box; Q86 requires a full build"
              fi
              grep -o 'structure path [0-9]* splice [01] reason [0-9]*' "build/$name.$build.raw" | tr '\n' ';' | sed 's/structure path //g; s/;$/\n/' || true
              grep ' inc refused$' "build/$name.$build.raw" || true
              test "$differs" -eq 0
              test "$refused" -le "$allowed"
              test "$same" -gt 0
            done
          done
          for build in seq par; do
            WF_WORKERS=4 build/layout_oracle_$build edit research/investigations/incremental-layout/scripts/boundary-case.edits research/investigations/incremental-layout/scripts/block-case.html renderer/style/ua.css > "build/boundary-case.$build.raw"
            python3 research/investigations/incremental-layout/scripts/inctime.py --check research/investigations/incremental-layout/scripts/boundary-case.edits "build/boundary-case.$build.raw"
          done
          s=research/investigations/incremental-layout/scripts
          build/layout_oracle_seq nodes 0 $s/boundary-baseline-case.html renderer/style/ua.css | head -30
          for build in seq par; do
            WF_WORKERS=4 build/layout_oracle_$build edit $s/boundary-baseline-case.edits $s/boundary-baseline-case.html renderer/style/ua.css > "build/boundary-baseline-case.$build.raw"
            python3 $s/inctime.py --check $s/boundary-baseline-case.edits "build/boundary-baseline-case.$build.raw"
            grep -E 'inc (same|DIFF|refused)$|boundary_fallbacks' "build/boundary-baseline-case.$build.raw" | sed 's/.*\(boundary_fallbacks [0-9]* boundary_reason [0-9]*\).*/\1/'
            same=$(grep -c ' inc same$' "build/boundary-baseline-case.$build.raw" || true)
            differs=$(grep -c ' inc DIFF$' "build/boundary-baseline-case.$build.raw" || true)
            echo "boundary-baseline-case ($build): inc same $same, DIFF $differs"
            test "$differs" -eq 0
            test "$same" -eq 8
          done
      - name: Positioned and flex fixture identity, seq and par
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          for kind in positioned flex transfer; do
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "build/$kind-case.edits"
            for build in seq par; do
              WF_WORKERS=4 build/layout_oracle_$build edit "build/$kind-case.edits" "$s/$kind-case.html" renderer/style/ua.css > "build/$kind-case.$build.raw"
              python3 "$s/inctime.py" --check "build/$kind-case.edits" "build/$kind-case.$build.raw"
              python3 "$s/splice-cases.py" --check-paths "build/$kind-case.edits.paths" "build/$kind-case.$build.raw"
              grep -E 'structure path| inc (same|DIFF|refused)$' "build/$kind-case.$build.raw"
            done
          done
      - name: Page block edits require zero fallbacks
        run: |
          set -euo pipefail
          for page in ecma262 html5; do
            for build in seq par; do
              python3 - "build/x5/out/$page-block.$build.txt.raw" <<'PYEOF'
          import re
          import sys
          from pathlib import Path
          def require_local(source):
              paths = re.findall(r'^structure path (\d+) splice ([01]) reason (\d+)$', source, re.M)
              assert paths and all(local == '1' and reason == '0' for _, local, reason in paths), paths
              return paths
          require_local('structure path 1 splice 1 reason 0\n')
          for bad in ('', 'structure path 1 splice 0 reason 0\n', 'structure path 1 splice 1 reason 7\n'):
              try:
                  require_local(bad)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('zero-fallback assertion accepted a deliberate fault')
          print('detected missing paths, a nonlocal path and a nonzero reason', flush=True)
          paths = require_local(Path(sys.argv[1]).read_text())
          print(sys.argv[1], len(paths), 'local splices, zero fallbacks')
          PYEOF
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-arithmetic-oracles
          path: |
            build/near-limit-*/
            build/*.raw
            build/x5/out/*.raw


  line-inventory:
    if: contains(github.event.head_commit.message, '[line-inventory]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Trace the split-line fixture and its plain-inline comparison
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          python3 - <<'PYTRACE'
          from pathlib import Path

          module = Path('renderer/layout/module.wfm')
          s = module.read_text()
          needle = '  fragments_valid: Bool;'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n  trace_called: u64;\n  trace_shifts: u64;\n  trace_delta: i32;')
          s += '\npublic fn line_lifetime_trace(layout: &Layout) -> made: Box<Slots<u64>> reads(layout) doc "Temporary read-only split lifetime inventory.";\n'
          module.write_text(s)
          p = Path('renderer/layout/build.wf')
          s = p.read_text()
          needle = 'fragments_valid: neutral, '
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, needle + 'trace_called: 0_u64, trace_shifts: 0_u64, trace_delta: 0_i32, '))
          p = Path('renderer/layout/update.wf')
          s = p.read_text()
          start = s.index('fn update_in_place(')
          at = s.index('  let boundary_work = no_boundary_visits();', start)
          s = s[:at] + '  set context^.trace_called = context^.trace_called +sat 1_u64;\n' + s[at:]
          needle = '    translate_after(context: context, events: events, flow_at: change.flow_at, delta: change.delta);'
          assert s.count(needle) == 1
          s = s.replace(needle, '    set context^.trace_shifts = context^.trace_shifts +sat 1_u64;\n    set context^.trace_delta = change.delta;\n' + needle)
          p.write_text(s)
          source = '''
          fn trace_number(records: &Box<Slots<u64>>, kind: u64, context: u32, slot: u64, owner: u32, value: u64) -> result: unit writes(records) {
            doc "Appends five fields to a diagnostic-only record stream.";
            let serial = cvt::<u32, u64>(context);
            let element = cvt::<u32, u64>(owner);
            let a = push_item::<u64>(cell: records, value: kind, ceiling: item_ceiling);
            let b = push_item::<u64>(cell: records, value: serial, ceiling: item_ceiling);
            let c = push_item::<u64>(cell: records, value: slot, ceiling: item_ceiling);
            let d = push_item::<u64>(cell: records, value: element, ceiling: item_ceiling);
            let e = push_item::<u64>(cell: records, value: value, ceiling: item_ceiling);
            return unit;
          }

          fn trace_wide(value: i64) -> made: u64 pure {
            doc "Biases ordinary diagnostic signed values by 2147483648.";
            let biased = value +sat 2147483648_i64;
            if biased >= 0_i64 {
              return cvt::<i64, u64>(biased);
            }
            return 0_u64;
          }

          fn trace_context_lines(context: &Context, records: &Box<Slots<u64>>) -> result: unit reads(context), writes(records) {
            doc "Reads split metadata and emitted anchor modes without changing layout.";
            if context^.splits.inner.len > 0_u64 {
              trace_number(records: records, kind: 1_u64, context: context^.slot, slot: 0_u64, owner: context^.style.element, value: context^.trace_called);
              trace_number(records: records, kind: 2_u64, context: context^.slot, slot: 0_u64, owner: context^.style.element, value: context^.trace_shifts);
              let delta_wide = cvt::<i32, i64>(context^.trace_delta);
              let delta = trace_wide(value: delta_wide);
              trace_number(records: records, kind: 3_u64, context: context^.slot, slot: 0_u64, owner: context^.style.element, value: delta);
              let valid = if context^.fragments_valid {
                give 1_u64;
              } else {
                give 0_u64;
              }
              trace_number(records: records, kind: 4_u64, context: context^.slot, slot: 0_u64, owner: context^.style.element, value: valid);
              for (at in 0_u64..context^.splits.inner.len) {
                let split = context^.splits.inner[at];
                let wide = cvt::<i32, i64>(split.line);
                let line = trace_wide(value: wide);
                let offset = trace_wide(value: split.line_offset);
                let opening = cvt::<u32, u64>(split.open);
                trace_number(records: records, kind: 5_u64, context: context^.slot, slot: at, owner: split.owner, value: line);
                trace_number(records: records, kind: 6_u64, context: context^.slot, slot: at, owner: split.owner, value: opening);
                trace_number(records: records, kind: 7_u64, context: context^.slot, slot: at, owner: split.owner, value: offset);
              }
              for (f in 0_u64..context^.fragments.inner.len) {
                let fragment = context^.fragments.inner[f];
                let wide_y = cvt::<i32, i64>(fragment.y);
                let y = trace_wide(value: wide_y);
                trace_number(records: records, kind: 9_u64, context: context^.slot, slot: f, owner: fragment.owner, value: y);
                if f < context^.fragment_anchors.inner.len {
                  let mode = cvt::<u8, u64>(context^.fragment_anchors.inner[f].mode);
                  trace_number(records: records, kind: 8_u64, context: context^.slot, slot: f, owner: fragment.owner, value: mode);
                }
              }
            }
            for (child in 0_u64..context^.children.inner.len) {
              trace_context_lines(context: &context^.children.inner[child], records: records);
            }
            return unit;
          }

          fn line_lifetime_trace(layout: &Layout) -> made: Box<Slots<u64>> reads(layout) {
            doc "Returns the retained tree's current split lifetime state.";
            let records = box_slots_new::<u64>(capacity: 0_u64);
            trace_context_lines(context: &layout^.root, records: &records);
            return move records;
          }
          '''
          Path('renderer/layout/line_trace.wf').write_text(source.lstrip('\n'))
          p = Path('renderer/oracle/layout/edit.wf')
          s = p.read_text()
          needle = '        if incremental == 1_u8 {'
          assert s.count(needle) == 1
          printing = '''
                  if edits >= 246_u64 {
                    if edits <= 257_u64 {
                      let line_trace_data = pkg::layout::line_lifetime_trace(layout: &kept.layout);
                      let line_trace_count = line_trace_data.inner.len / 5_u64;
                      for (line_trace_row in 0_u64..line_trace_count) {
                        put_text(buffer: &report, text: &line_trace_label[0_u64..9_u64]);
                        put_decimal(buffer: &report, value: edits);
                        put_byte(buffer: &report, value: 32_u8);
                        for (line_trace_field in 0_u64..5_u64) {
                          let line_trace_base = line_trace_row *sat 5_u64;
                          let line_trace_index = line_trace_base +sat line_trace_field;
                          if line_trace_index < line_trace_data.inner.len {
                            put_decimal(buffer: &report, value: line_trace_data.inner[line_trace_index]);
                            put_byte(buffer: &report, value: 32_u8);
                          }
                        }
                        put_byte(buffer: &report, value: 10_u8);
                      }
                    }
                  }
          '''
          s = s.replace(needle, printing.lstrip('\n') + needle)
          needle = 'const full_label:'
          assert s.count(needle) == 1
          s = s.replace(needle, 'const line_trace_label: Array<u8, 9> = "semantic ";\n\n' + needle)
          p.write_text(s)
          PYTRACE
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/line-base)
          python3 - <<'PYMUTATE'
          from pathlib import Path
          p=Path('renderer/layout/update.wf')
          s=p.read_text()
          needle='    shift_split_lines(context: context, flow_at: change.flow_at, delta: change.delta);\n'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,''))
          PYMUTATE
          (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/line-mutant)
          s=research/investigations/incremental-layout/scripts
          cp "$s/transfer-case.html" build/line-original.html
          for variant in framed plain; do
            if [ "$variant" = plain ]; then
              python3 - <<'PYVARIANT'
          from pathlib import Path
          p=Path('research/investigations/incremental-layout/scripts/transfer-case.html')
          s=p.read_text()
          needle='<div style="padding-top:1px"><span class="fragment">'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'<div style="padding-top:1px"><span>'))
          PYVARIANT
            fi
            python3 "$s/splice-cases.py" build/line-base transfer "build/line-$variant.edits"
            for engine in base mutant; do
              build/line-$engine edit "build/line-$variant.edits" "$s/transfer-case.html" renderer/style/ua.css > "build/line-$variant-$engine.raw"
              python3 - "$variant" "$engine" <<'PYRESULT'
          from pathlib import Path
          import re,sys
          variant,engine=sys.argv[1:]
          p=Path(f'build/line-{variant}-{engine}.raw')
          s=p.read_text()
          clean='\n'.join(l for l in s.splitlines() if not l.startswith('semantic '))+'\n'
          p.with_suffix('.clean.raw').write_text(clean)
          print(variant,engine,'DIFF',len(re.findall(r' inc DIFF$',clean,re.M)))
          print('\n'.join(l for l in clean.splitlines() if l.startswith(('structure path 246 ','structure path 252 ','edit 251 ','edit 252 '))))
          PYRESULT
              python3 "$s/inctime.py" --check "build/line-$variant.edits" "build/line-$variant-$engine.clean.raw"
              if [ "$engine" = base ]; then
                python3 "$s/splice-cases.py" --check-paths "build/line-$variant.edits.paths" "build/line-$variant-$engine.clean.raw"
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-lifetime-inventory
          path: build/line-*
