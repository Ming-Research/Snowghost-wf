# Temporary verification of the retained instruction counts; removed after reporting.
name: style-320

on:
  push:
    branches: [research/style-320]
    paths: [.github/workflows/style-320.yml]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the four profiles and annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/style-320-verified
          gh run download 38015166829 --repo Ming-Research/Snowghost-wf --name style-320-counts --dir build/style-320-verified
      - name: Compare all counts without relying on tied caller row order
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = Path('build/style-320-verified')
          def table(path):
              text = path.read_text()
              return text[text.index('PROGRAM TOTALS'):]
          def callers(path):
              records = []
              for block in table(path).split('\n\n'):
                  rows = block.splitlines()
                  functions = [line.strip() for line in rows if ' * ' in line]
                  if not functions:
                      continue
                  assert len(functions) == 1, (path, block)
                  incoming = sorted(line.strip() for line in rows if ' < ' in line)
                  records.append((functions[0], incoming))
              assert records, path
              return sorted(records)
          for side in ('before', 'after'):
              for kind in ('self', 'inclusive'):
                  assert table(data / f'{kind}-{side}-1.txt') == table(data / f'{kind}-{side}-2.txt'), (side, kind)
              first = callers(data / f'caller-{side}-1.txt')
              second = callers(data / f'caller-{side}-2.txt')
              assert first == second, (side, 'caller')
              (data / f'canonical-callers-{side}.json').write_text(json.dumps(first, indent=2) + '\n')
              assert (data / f'driver-{side}-1.stdout').read_bytes() == (data / f'driver-{side}-2.stdout').read_bytes(), side
          assert (data / 'driver-before-1.stdout').read_bytes() == (data / 'driver-after-1.stdout').read_bytes()
          result = ('Every self and inclusive function Ir and every caller/callee Ir and call count agree exactly across repeats.\n'
                    'Only tied caller presentation order differed; grouping by callee is preserved in the comparison.\n'
                    'Driver outputs agree across all four runs.\n')
          (data / 'repeat-confirmation.txt').write_text(result)
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-320-verified
          path: build/style-320-verified/
          retention-days: 30
