# Temporary instruction-count measurement; removed after the raw evidence is saved.
name: style-320

on:
  push:
    branches: [research/style-320]
    paths: [.github/workflows/style-320.yml]

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve both unchanged builds and identify the collection boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/style-320 build/style-320-counts
          gh run download 38014053730 --repo Ming-Research/Snowghost-wf --name style-320-raw --dir build/style-320
          chmod +x build/style-320/proto_layout_seq-before build/style-320/proto_layout_seq-after
          sudo apt-get update
          sudo apt-get install -y valgrind
          cp build/style-320/{source.sha256,compilers.sha256,inputs.sha256,input-pins.txt,before-release.json,after-release.json,build-before.exit,build-after.exit,build-before.stderr,build-after.stderr} build/style-320-counts/
          for side in before after; do
            sha256sum "build/style-320/proto_layout_seq-$side" >> build/style-320-counts/binaries.sha256
            objdump -d --disassemble=wf_proto.style.compute_styles "build/style-320/proto_layout_seq-$side" > "build/style-320-counts/compute_styles-$side.asm"
            objdump -d --disassemble=wf_proto.layout.drive.resume "build/style-320/proto_layout_seq-$side" > "build/style-320-counts/drive-$side.asm"
            # Both optimized drivers call the wrapper's sole body directly.
            test "$(grep -c 'call.*<wf_proto.style.style_shape_c>' "build/style-320-counts/drive-$side.asm")" = 1
            if grep -q 'call.*<wf_proto.style.compute_styles>' "build/style-320-counts/drive-$side.asm"; then exit 1; fi
          done
          { git rev-parse HEAD; uname -srm; lscpu; valgrind --version; ldd --version; cat /etc/os-release; } > build/style-320-counts/environment.txt
      - name: Fetch the pinned ecma262 inputs
        run: |
          set -euo pipefail
          data=build/research/concurrency
          mkdir -p "$data"
          while read -r name url sum; do
            curl -fsSL --retry 3 -o "$data/$name" "$url"
            echo "$sum  $data/$name" | sha256sum -c -
          done < build/style-320/input-pins.txt
          sha256sum "$data"/ecma262* research/investigations/concurrency/ua.css > build/style-320-counts/inputs-current.sha256
          cmp build/style-320/inputs.sha256 build/style-320-counts/inputs-current.sha256
      - name: Collect the optimized compute_styles body twice per release
        run: |
          set -euo pipefail
          data=build/research/concurrency
          ua=research/investigations/concurrency/ua.css
          for repeat in 1 2; do
            for side in before after; do
              WF_WORKERS=1 valgrind --tool=callgrind --collect-atstart=no --toggle-collect=wf_proto.style.style_shape_c --callgrind-out-file="build/style-320-counts/callgrind-$side-$repeat.out" "build/style-320/proto_layout_seq-$side" L1 0 "$data/ecma262.html" "$ua" "$data/ecma262-ecmarkup.css" "$data/ecma262-print.css" > "build/style-320-counts/driver-$side-$repeat.stdout" 2> "build/style-320-counts/driver-$side-$repeat.stderr"
              test "$(awk '/^summary:/ {print $2}' "build/style-320-counts/callgrind-$side-$repeat.out")" -gt 0
              callgrind_annotate --auto=no --threshold=100 --inclusive=no "build/style-320-counts/callgrind-$side-$repeat.out" > "build/style-320-counts/self-$side-$repeat.txt"
              callgrind_annotate --auto=no --threshold=100 --inclusive=yes "build/style-320-counts/callgrind-$side-$repeat.out" > "build/style-320-counts/inclusive-$side-$repeat.txt"
              callgrind_annotate --auto=no --threshold=100 --inclusive=yes --tree=caller "build/style-320-counts/callgrind-$side-$repeat.out" > "build/style-320-counts/caller-$side-$repeat.txt"
            done
          done
      - name: Confirm that both repeats have identical instruction counts
        run: |
          set -euo pipefail
          for side in before after; do
            for kind in self inclusive caller; do
              for repeat in 1 2; do
                sed -n '/PROGRAM TOTALS/,$p' "build/style-320-counts/$kind-$side-$repeat.txt" > "build/style-320-counts/compare-$kind-$side-$repeat.txt"
              done
              diff -u "build/style-320-counts/compare-$kind-$side-1.txt" "build/style-320-counts/compare-$kind-$side-2.txt"
            done
            cmp "build/style-320-counts/driver-$side-1.stdout" "build/style-320-counts/driver-$side-2.stdout"
          done
          cmp build/style-320-counts/driver-before-1.stdout build/style-320-counts/driver-after-1.stdout
          echo 'All self, inclusive and caller Ir counts agree exactly across repeats; driver outputs also agree.' > build/style-320-counts/repeat-confirmation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-320-counts
          path: build/style-320-counts/
          retention-days: 30
