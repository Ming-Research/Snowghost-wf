# Temporary collector diagnosis; removed after the raw evidence is saved.
name: style-320

on:
  push:
    branches: [research/style-320]
    paths: [.github/workflows/style-320.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the unchanged binaries and identify their calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/style-320 build/style-320-diagnostic
          gh run download 38014053730 --repo Ming-Research/Snowghost-wf --name style-320-raw --dir build/style-320
          sudo apt-get update
          sudo apt-get install -y valgrind
          objdump -d --disassemble=wf_proto.style.compute_styles build/style-320/proto_layout_seq-before > build/style-320-diagnostic/compute_styles.asm
          objdump -d build/style-320/proto_layout_seq-before > build/style-320-diagnostic/driver.asm
          { uname -srm; lscpu; valgrind --version; ldd --version; } > build/style-320-diagnostic/environment.txt
      - name: Fetch the pinned ecma262 inputs
        run: |
          set -euo pipefail
          data=build/research/concurrency
          mkdir -p "$data"
          while read -r name url sum; do
            curl -fsSL --retry 3 -o "$data/$name" "$url"
            echo "$sum  $data/$name" | sha256sum -c -
          done < build/style-320/input-pins.txt
      - name: Diagnose the collector's symbol match
        run: |
          set -euo pipefail
          data=build/research/concurrency
          ua=research/investigations/concurrency/ua.css
          WF_WORKERS=1 valgrind --tool=callgrind --collect-atstart=no '--toggle-collect=*compute_styles*' --callgrind-out-file=build/style-320-diagnostic/wildcard.out build/style-320/proto_layout_seq-before L1 0 "$data/ecma262.html" "$ua" "$data/ecma262-ecmarkup.css" "$data/ecma262-print.css" > build/style-320-diagnostic/wildcard.stdout 2> build/style-320-diagnostic/wildcard.stderr
          WF_WORKERS=1 valgrind --tool=callgrind --callgrind-out-file=build/style-320-diagnostic/full.out build/style-320/proto_layout_seq-before L1 0 "$data/ecma262.html" "$ua" "$data/ecma262-ecmarkup.css" "$data/ecma262-print.css" > build/style-320-diagnostic/full.stdout 2> build/style-320-diagnostic/full.stderr
          callgrind_annotate --auto=no --threshold=100 --inclusive=yes --tree=both build/style-320-diagnostic/full.out > build/style-320-diagnostic/full-annotate.txt
          callgrind_annotate --auto=no --threshold=100 --inclusive=yes --tree=caller build/style-320-diagnostic/wildcard.out > build/style-320-diagnostic/wildcard-annotate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-320-diagnostic
          path: build/style-320-diagnostic/
          retention-days: 30
