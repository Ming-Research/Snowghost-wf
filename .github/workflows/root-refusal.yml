# Temporary refusal diagnosis; retire after the observed cause is recorded.
name: root-refusal
on:
  push:
    branches: [research/m2-frag-a]
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[root-refusal]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Native production driver and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          mkdir -p build/root-refusal
          uname -a > build/root-refusal/machine.txt
          lscpu >> build/root-refusal/machine.txt
          clang --version >> build/root-refusal/machine.txt
          git rev-parse HEAD > build/root-refusal/revision.txt
          cat whitefoot.pin >> build/root-refusal/revision.txt
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && /usr/bin/time -p -o ../build/root-refusal/build.time "$wfc" --cache ../build/whitefoot-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          sha256sum "$wfc" build/layout_oracle_seq > build/root-refusal/binaries.sha256
      - name: Freeze the first root-font edit and undo
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css; do
            test -s "build/research/concurrency/$file"
          done
          sh research/investigations/incremental-layout/run.sh prepare ecma262
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('build/x5/scripts/ecma262-rootfont.edits').read_text().splitlines(True)
          setup = [line for line in lines if line.startswith('S ')]
          edits = [line for line in lines if line.startswith(('C ', 'K '))]
          assert len(edits) >= 2 and edits[0].startswith('C ') and edits[1].startswith('K '), edits[:2]
          Path('build/root-refusal/rootfont.edits').write_text(''.join(setup + edits[:2]))
          PY
          sha256sum build/root-refusal/rootfont.edits build/research/concurrency/ecma262* renderer/style/ua.css > build/root-refusal/inputs.sha256
      - name: Observe actual refusals with independent full-layout comparison
        run: |
          set -euo pipefail
          /usr/bin/time -p -o build/root-refusal/pair.time build/layout_oracle_seq edit build/root-refusal/rootfont.edits build/research/concurrency/ecma262.html renderer/style/ua.css assets/css/ecmarkup.css=build/research/concurrency/ecma262-ecmarkup.css assets/css/print.css=build/research/concurrency/ecma262-print.css > build/root-refusal/pair.raw
          python3 research/investigations/incremental-layout/scripts/inctime.py --check build/root-refusal/rootfont.edits build/root-refusal/pair.raw
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path('build/root-refusal')
          raw = (root / 'pair.raw').read_text()
          def read(text):
              records = re.findall(r'^style edit (\d+) .* frontier_refusals (\d+) frontier_reasons (\d+)$', text, re.M)
              assert [int(row[0]) for row in records] == [1, 2], records
              return [dict(edit=int(edit), refused_leaves=int(count), reasons=int(reasons)) for edit, count, reasons in records]
          records = read(raw)
          (root / 'observed.json').write_text(json.dumps(records, indent=2) + '\n')
          print(records)
          for damaged in [raw.replace(' frontier_refusals ', ' omitted_refusals ', 1),
                          raw.replace(' frontier_reasons ', ' omitted_reasons ', 1),
                          raw + next(line + '\n' for line in raw.splitlines() if line.startswith('style edit 1 '))]:
              try:
                  read(damaged)
              except AssertionError:
                  print('detected missing or duplicated diagnostic record')
              else:
                  raise AssertionError('diagnostic accepted damaged evidence')
          print((root / 'pair.time').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-refusal
          path: |
            build/root-refusal/
            build/x5/scripts/ecma262-rootfont.edits
