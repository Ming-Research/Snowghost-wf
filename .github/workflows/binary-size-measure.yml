# TEMPORARY: measures the size of the driver binaries that could stand in for
# the engine binary under the owner's 10 MB limit, for
# research/investigations/binary-size/. It is removed before the pull request
# that adds `make binary-size-check` is marked ready.
#
# Each build uses the gate's own toolchain setup (check.yml) and the compiler
# release whitefoot.pin names, built with whitefootc --cache
# build/whitefoot-cache --fragments function as the Makefile builds, except
# the "no cache" row, which passes neither flag (the Makefile's CACHE=). Sizes
# are the file's byte count (wc -c). The strip row is a copy of the layout_oracle
# --par binary run through strip (strip -x on macOS).
name: binary-size-measure

on:
  workflow_dispatch:
  push:
    branches: [research/binary-size]

jobs:
  measure:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the host toolchain
        run: |
          make toolchain
          if [ "$(uname -s)" = Linux ]; then ld.lld --version; fi

      - name: Build and measure
        run: |
          set -euo pipefail
          release=$(sed -n -E 's/^release = (wf-(exp-)?[0-9a-f]{12})$/\1/p' whitefoot.pin)
          wfc=$PWD/build/whitefoot/$release/whitefootc
          test -x "$wfc"
          cache=$PWD/build/whitefoot-cache
          out=$PWD/build/size
          mkdir -p "$out"
          host="$(uname -s)-$(uname -m)"
          table="$out/table.txt"
          printf '| os | entry | flags | bytes |\n|---|---|---|---|\n' > "$table"

          # row ENTRY FLAGS FILE: one table line for FILE's size.
          row() {
            bytes=$(wc -c < "$3" | tr -d ' ')
            printf '| %s | %s | %s | %s |\n' "$host" "$1" "$2" "$bytes" | tee -a "$table"
          }

          # build ENTRY MODE CACHED: MODE is seq or par, CACHED is yes or no.
          build() {
            entry=$1; mode=$2; cached=$3
            file="$out/$entry-$mode-$cached"
            args=()
            if [ "$cached" = yes ]; then args+=(--cache "$cache" --fragments function); fi
            if [ "$mode" = par ]; then args+=(--par); fi
            (cd renderer && "$wfc" ${args[@]+"${args[@]}"} --graph modules.wfg --entry "$entry" -o "$file")
            flags="$mode"
            if [ "$cached" = no ]; then flags="$mode, no cache"; fi
            row "$entry" "$flags" "$file"
          }

          # The drivers that run the style stage or the whole pipeline.
          # layout_oracle and style_oracle are the oracle drivers over
          # pkg::oracle::page; proto_style and proto_layout are the earlier
          # prototypes.
          for entry in layout_oracle style_oracle proto_style proto_layout; do
            for mode in seq par; do
              build "$entry" "$mode" yes
            done
          done

          build layout_oracle par no

          stripped="$out/layout_oracle-par-yes-stripped"
          cp "$out/layout_oracle-par-yes" "$stripped"
          if [ "$(uname -s)" = Darwin ]; then strip -x "$stripped"; else strip "$stripped"; fi
          row layout_oracle "par, stripped" "$stripped"

          echo
          cat "$table"
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
