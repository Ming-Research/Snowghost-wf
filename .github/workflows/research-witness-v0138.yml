# Temporary: checks the append-keeps-old witness and its control with the
# pinned compiler; retire when the branch is ready.
name: research-witness-v0138
on:
  push:
    branches: [research/pin-v0138]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pinned compiler
        run: make -s compiler
      - name: Positive witness must be accepted
        run: |
          set -euo pipefail
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          compiler=$(realpath "build/whitefoot/$release/whitefootc")
          status=0
          "$compiler" --check research/investigations/m2-edit-cost/inverse-proof/append-keeps-old.wf > positive.log 2>&1 || status=$?
          cat positive.log
          echo "append-keeps-old exit $status"
          test "$status" -eq 0
      - name: Control must be refused at the use after the append
        run: |
          set -euo pipefail
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          compiler=$(realpath "build/whitefoot/$release/whitefootc")
          file=research/investigations/m2-edit-cost/inverse-proof/append-keeps-old-control.wf
          status=0
          "$compiler" --check "$file" > control.log 2>&1 || status=$?
          cat control.log
          echo "append-keeps-old-control exit $status"
          test "$status" -ne 0
          line=$(grep -n 'need_equal(value: cell' "$file" | cut -d: -f1)
          grep -q "$(basename "$file"):$line:" control.log || grep -q ":$line:" control.log
