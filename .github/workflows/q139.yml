# Temporary evidence workflow; removed before this branch is ready.
name: q139
on:
  push:
    branches: [research/m2-q139]
  workflow_dispatch:
jobs:
  percentage-oracle:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[q139]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Toolchain and reference browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s compiler oracle-fonts
      - name: Small full-layout sample
        id: drivers
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          time (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          "$CHROMIUM" --version
          node tests/layout/layout_oracle.mjs dump tests/layout/percentage-height-cases.html > build/percentage.chromium.tsv
          time build/layout_oracle_seq dump 1 tests/layout/percentage-height-cases.html renderer/style/ua.css > build/percentage.seq.tsv
          cmp tests/layout/percentage-height-cases.chromium.tsv build/percentage.chromium.tsv
          node tests/layout/layout_oracle.mjs compare build/percentage.chromium.tsv build/percentage.seq.tsv
          time (cd renderer && "$wfc" --par --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_par)
          time WF_WORKERS=4 build/layout_oracle_par dump 1 tests/layout/percentage-height-cases.html renderer/style/ua.css > build/percentage.par.tsv
          cmp build/percentage.seq.tsv build/percentage.par.tsv
      - name: Percentage basis refresh after restyles
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          for variant in ordinary atomic float; do
            script="build/percentage-$variant.edits"
            python3 "$s/percentage-cases.py" build/layout_oracle_seq "$script" --mode "$variant"
            for mode in seq par; do
              raw="build/percentage-$variant-$mode.raw"
              WF_WORKERS=4 "build/layout_oracle_$mode" edit "$script" tests/layout/percentage-height-cases.html renderer/style/ua.css > "$raw"
              python3 "$s/inctime.py" --check "$script" "$raw"
            done
          done
      - name: Small Q139 splice sample before expanding the matrix
        id: splice
        if: ${{ !cancelled() && steps.drivers.conclusion == 'success' }}
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          d=build/percentage-splice
          python3 "$s/percentage-splice.py" build/layout_oracle_seq "$d"
          node tests/layout/layout_oracle.mjs dump "$d/case.html" > "$d/base.chromium.tsv"
          node tests/layout/layout_oracle.mjs dump "$d/inserted.html" > "$d/inserted.chromium.tsv"
          for mode in seq par; do
            time WF_WORKERS=4 "build/layout_oracle_$mode" edit "$d/case.edits" "$d/case.html" renderer/style/ua.css > "$d/$mode.raw"
            python3 "$s/inctime.py" --check "$d/case.edits" "$d/$mode.raw"
            python3 "$s/splice-cases.py" --check-paths "$d/case.edits.paths" "$d/$mode.raw"
            python3 "$s/percentage-splice.py" "build/layout_oracle_$mode" "$d/$mode" --extract "$d/$mode.raw"
            node tests/layout/layout_oracle.mjs compare "$d/base.chromium.tsv" "$d/$mode/prefix-0.tsv"
            node tests/layout/layout_oracle.mjs compare "$d/inserted.chromium.tsv" "$d/$mode/prefix-1.tsv"
            node tests/layout/layout_oracle.mjs compare "$d/base.chromium.tsv" "$d/$mode/prefix-2.tsv"
          done
      - name: Q139 definite, indefinite and lifetime matrix
        if: ${{ !cancelled() && steps.splice.conclusion == 'success' }}
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          failed=0
          for mode in seq par; do
            WF_WORKERS=4 python3 "$s/percentage-matrix.py" "build/layout_oracle_$mode" "build/percentage-matrix-$mode" || failed=1
          done
          test "$failed" -eq 0
      - name: Existing layout case floors against Chromium
        if: ${{ !cancelled() && steps.drivers.conclusion == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p build/oracle/layout build/research/layout
          pages=()
          for page in tests/layout/*-cases.html; do
            name=$(basename "$page" .html)
            pages+=("$name")
            node tests/layout/layout_oracle.mjs dump "$page" > "build/oracle/layout/$name.chromium.tsv"
            build/layout_oracle_seq dump 1 "$page" renderer/style/ua.css > "build/research/layout/$name.seq.tsv"
            WF_WORKERS=4 build/layout_oracle_par dump 1 "$page" renderer/style/ua.css > "build/research/layout/$name.par.tsv"
            cmp "build/research/layout/$name.seq.tsv" "build/research/layout/$name.par.tsv"
          done
          sh research/investigations/layout/run.sh judge "${pages[@]}"
      - name: Existing conjunctive certificates with the viewport chain
        if: ${{ !cancelled() && steps.drivers.conclusion == 'success' }}
        run: |
          set -euo pipefail
          s=research/investigations/incremental-layout/scripts
          mkdir -p build/percentage-combinations
          failed=0
          for kind in positioned positioned-isolated flex transfer edit-cost edit-baseline edit-height edit-cascade; do
            page=$kind
            case "$kind" in
              positioned-isolated) page=positioned ;;
              edit-cost|edit-cascade) page=transfer ;;
              edit-baseline|edit-height) page=style ;;
            esac
            script="build/percentage-combinations/$kind.edits"
            python3 "$s/splice-cases.py" build/layout_oracle_seq "$kind" "$script"
            for chain in original viewport; do
              variant="build/percentage-combinations/$kind-$chain.edits"
              if [ "$chain" = viewport ]; then
                echo 'S html,body{height:100%}' > "$variant"
                cat "$script" >> "$variant"
              else
                cp "$script" "$variant"
              fi
              for mode in seq par; do
                raw="build/percentage-combinations/$kind-$chain-$mode.raw"
                WF_WORKERS=4 "build/layout_oracle_$mode" edit "$variant" "$s/$page-case.html" renderer/style/ua.css > "$raw" || { failed=1; continue; }
                python3 "$s/inctime.py" --check "$variant" "$raw" || failed=1
                python3 "$s/splice-cases.py" --check-paths "$script.paths" "$raw" || failed=1
              done
            done
          done
          test "$failed" -eq 0
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && steps.drivers.conclusion == 'success' }}
        with:
          github-token: ${{ github.token }}
          run-id: 37727037303
          name: apollo11-diag-37727037303
          path: build/apollo-archive
      - name: Apollo block edits on the recorded diagnostic capture
        if: ${{ !cancelled() && steps.drivers.conclusion == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p build/research/concurrency
          cp build/apollo-archive/research/concurrency/apollo11* build/research/concurrency/
          sha256sum -c build/apollo-archive/apollo11-inputs.sha256
          sh research/investigations/incremental-layout/run.sh prepare apollo11
          head -2 build/x5/scripts/apollo11-block.edits > build/percentage-apollo-sample.edits
          time build/layout_oracle_seq edit build/percentage-apollo-sample.edits build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css' > build/percentage-apollo-sample.raw
          python3 research/investigations/incremental-layout/scripts/inctime.py --check build/percentage-apollo-sample.edits build/percentage-apollo-sample.raw
          for mode in seq par; do
            time WF_WORKERS=4 sh research/investigations/incremental-layout/run.sh inc "$mode" apollo11 block
          done
          sh research/investigations/incremental-layout/run.sh same apollo11 block
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: percentage-oracle
          path: |
            build/percentage*
            build/x5/
            build/apollo-archive/apollo11-inputs.sha256
            build/oracle/layout/
            build/research/layout/
  scope-variant:
    # Evidence for the owner's Q139 scope decision, not a candidate: the same
    # source with each context's inventory limited to its own direct readers
    # (nested contexts contribute only their own record), against the
    # whole-subtree inventory. Reports paths; it does not gate.
    if: contains(github.event.head_commit.message, '[q139-scope]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37727037303
          name: apollo11-diag-37727037303
          path: build/apollo-archive
      - name: Whole-subtree and direct-reader drivers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make -s compiler oracle-fonts
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/scope
          (cd renderer && "$wfc" --cache ../build/scope-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/scope/subtree)
          python3 - <<'PYEOF'
          from pathlib import Path
          own = '''
          fn own_height_summary(context: &Context, styles: &Styles) -> made: HeightSummary reads(context), reads(styles) {
            let own = height_proof_summary(proof: context^.height_proof);
            let current = context_height_current(context: context, styles: styles);
            if current {
            } else {
              set own.unproved = own.unproved +sat 1_u64;
            }
            return own;
          }
          '''
          own = '\n'.join(line[10:] if line.startswith('          ') else line for line in own.strip('\n').splitlines()) + '\n'
          sites = [
              ('renderer/layout/boundary.wf', 'set output.heights = context_height_summary(context: child, styles: styles);', 'set output.heights = own_height_summary(context: child, styles: styles);'),
              ('renderer/layout/splice_motion.wf', 'let heights = context_height_summary(context: &context^.children.inner[child_at], styles: styles);', 'let heights = own_height_summary(context: &context^.children.inner[child_at], styles: styles);'),
              ('renderer/layout/splice_motion.wf', 'set output.heights = context_height_summary(context: &context^.children.inner[at], styles: styles);', 'set output.heights = own_height_summary(context: &context^.children.inner[at], styles: styles);'),
              ('renderer/layout/height_basis.wf', 'let made = context_height_summary(context: child, styles: styles);\n    return made;', 'let made = own_height_summary(context: child, styles: styles);\n    return made;'),
          ]
          for path, old, new in sites:
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          p = Path('renderer/layout/height_basis.wf')
          p.write_text(p.read_text() + '\n' + own)
          print('direct-reader inventory variant applied')
          PYEOF
          git diff --stat
          (cd renderer && "$wfc" --cache ../build/scope-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/scope/direct)
      - name: Existing fixture paths and Q139 cases under both inventories
        run: |
          set -uo pipefail
          s=research/investigations/incremental-layout/scripts
          for variant in subtree direct; do
            d=build/scope/$variant-cases
            mkdir -p "$d"
            for kind in positioned positioned-isolated flex transfer edit-cost; do
              page=$kind
              case "$kind" in positioned-isolated) page=positioned ;; edit-cost) page=transfer ;; esac
              python3 "$s/splice-cases.py" build/scope/subtree "$kind" "$d/$kind.edits" > /dev/null
              for chain in original viewport; do
                script=$d/$kind-$chain.edits
                if [ "$chain" = viewport ]; then echo 'S html,body{height:100%}' > "$script"; cat "$d/$kind.edits" >> "$script"; else cp "$d/$kind.edits" "$script"; fi
                build/scope/$variant edit "$script" "$s/$page-case.html" renderer/style/ua.css > "$d/$kind-$chain.raw"
                identity=$(python3 "$s/inctime.py" --check "$script" "$d/$kind-$chain.raw" > /dev/null 2>&1 && echo identical || echo DIFFERENT)
                paths=$(python3 "$s/splice-cases.py" --check-paths "$d/$kind.edits.paths" "$d/$kind-$chain.raw" 2>&1 | tail -1)
                echo "$variant $kind $chain: $identity; $paths"
              done
            done
            for case in $(python3 -c "import importlib.util,sys; sys.path.insert(0,'$s'); spec=importlib.util.spec_from_file_location('f','$s/percentage-splice.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(' '.join(m.CASES))"); do
              c=$d/q139-$case
              python3 "$s/percentage-splice.py" build/scope/subtree "$c" --case "$case" > /dev/null
              build/scope/$variant edit "$c/case.edits" "$c/case.html" renderer/style/ua.css > "$c/edits.raw"
              identity=$(python3 "$s/inctime.py" --check "$c/case.edits" "$c/edits.raw" > /dev/null 2>&1 && echo identical || echo DIFFERENT)
              paths=$(grep -o 'structure path [0-9]* splice [01] reason [0-9]*' "$c/edits.raw" | awk '{print $5 "/" $7}' | sort | uniq -c | tr '\n' ' ')
              echo "$variant q139 $case: $identity; paths $paths; required $(awk '{print $5 "/" $7}' "$c/case.edits.paths" | sort | uniq -c | tr '\n' ' ')"
            done
          done
      - name: Page block edits under both inventories
        run: |
          set -uo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          cp build/apollo-archive/research/concurrency/apollo11* build/research/concurrency/
          sha256sum -c build/apollo-archive/apollo11-inputs.sha256
          cp build/scope/subtree build/layout_oracle_seq
          sh research/investigations/incremental-layout/run.sh prepare ecma262 html5 apollo11
          for variant in subtree direct; do
            cp build/scope/$variant build/layout_oracle_seq
            for page in ecma262 html5 apollo11; do
              sh research/investigations/incremental-layout/run.sh inc seq "$page" block | sed "s/^/$variant: /"
              cp "build/x5/out/$page-block.seq.txt.raw" "build/scope/$variant-$page-block.raw"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q139-scope-variant
          path: |
            build/scope/*-cases/
            build/scope/*.raw
