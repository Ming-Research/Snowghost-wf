# Temporary evidence workflow; removed before this branch is ready.
name: q139
on:
  push:
    branches: [research/m2-q139]
  workflow_dispatch:
jobs:
  percentage-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Toolchain and reference browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s compiler oracle-fonts
      - name: Small full-layout sample
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          time (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          "$CHROMIUM" --version
          node tests/layout/layout_oracle.mjs dump tests/layout/percentage-height-cases.html > build/percentage.chromium.tsv
          time build/layout_oracle_seq dump 1 tests/layout/percentage-height-cases.html renderer/style/ua.css > build/percentage.seq.tsv
          node tests/layout/layout_oracle.mjs compare build/percentage.chromium.tsv build/percentage.seq.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: percentage-oracle
          path: build/percentage.*
