# Temporary, for research/line-fill: judges tab widths, hanging pre-wrap
# spaces and text-align: justify against Chromium on the layout case pages,
# and the tab-size column on the style cases page, on GitHub-hosted CI so no
# renderer is compiled on the owner's machine; it also prints how the base
# branch's renderer (origin/research/m2-layout) scores on the line-fill cases,
# the record that they fail without the change. Removed before the branch is
# ready.
#
# The apollo11-parity job (research/parity-text) compares apollo11's
# full-page layout with Chromium's at the branch's head and at its base
# commit, to show that small-caps abbr elements and kerning across element
# boundaries moved the page's text widths to Chromium's.
name: line-fill-temp

on:
  push:
    branches: [research/line-fill]
  workflow_dispatch:

concurrency:
  group: line-fill-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain, fonts and the reference browser
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-mono fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s toolchain compiler oracle-fonts
      - name: Chromium's boxes for the layout case pages and computed styles for the style cases
        run: |
          set -euo pipefail
          "$CHROMIUM" --version
          mkdir -p build/oracle/layout build/oracle/style
          for page in tests/layout/*-cases.html; do
            name=$(basename "$page" .html)
            node tests/layout/layout_oracle.mjs dump "$page" > "build/oracle/layout/$name.chromium.tsv"
          done
          node tests/css/style_oracle.mjs dump tests/css/style-cases.html > build/oracle/style/cases.chromium.tsv
      - name: Layout case pages against Chromium, sequential and --par
        id: layout
        run: |
          set -euo pipefail
          pages=$(cd tests/layout && ls *-cases.html | sed 's/\.html$//' | tr '\n' ' ')
          sh research/investigations/layout/run.sh check $pages
      - name: Every line-fill case agrees with Chromium
        if: ${{ !cancelled() && steps.layout.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          cat build/research/layout/line-fill-cases.compare.txt
          for measure in 'block-level boxes' 'inline-level boxes' 'text nodes'; do
            grep -E "^$measure: [0-9]+/[0-9]+ 100\.00% within 1px" build/research/layout/line-fill-cases.compare.txt
          done
      - name: Mismatched boxes and text fragments, Chromium beside Snowghost
        if: ${{ !cancelled() && steps.layout.conclusion != 'skipped' }}
        run: |
          python3 -B - <<'PYEOF'
          from pathlib import Path

          def rects(field):
              return [tuple(float(n) for n in r.split(',')) for r in field.split(' ')] if field else []

          def load(path):
              found = {}
              for line in Path(path).read_text().splitlines():
                  parts = line.split('\t')
                  if parts[0] == 'E':
                      found[('E', parts[1])] = (parts[2], parts[4], rects(parts[5]))
                  elif parts[0] == 'T':
                      found[('T', parts[1])] = (parts[2], 't', rects(parts[3]))
              return found

          for page in ('line-fill-cases', 'flow-cases'):
              chromium = load(f'build/oracle/layout/{page}.chromium.tsv')
              snowghost = load(f'build/research/layout/{page}.seq.tsv')
              print(f'== {page}: mismatched widths or fragment counts (x,y,width,height)')
              for key in sorted(set(chromium) | set(snowghost), key=lambda k: (k[0], int(k[1]))):
                  c = chromium.get(key)
                  s = snowghost.get(key)
                  if c is None or s is None:
                      print(key, 'chromium', c, 'snowghost', s)
                      continue
                  if c[1] == 'n':
                      continue
                  same = len(c[2]) == len(s[2]) and all(abs(a[2] - b[2]) <= 1 for a, b in zip(c[2], s[2]))
                  if c[1] == 'b' and same:
                      same = all(abs(a[3] - b[3]) <= 1 for a, b in zip(c[2], s[2]))
                  if not same:
                      print(key, c[0])
                      print('  chromium ', c[2])
                      print('  snowghost', s[2])
          PYEOF
      - name: The base renderer on the line-fill cases, the counts before the change (never fails the job)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin research/m2-layout
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base"
          git submodule update --init --depth 1
          echo "base: origin/research/m2-layout at $(git rev-parse --short HEAD)"
          make -s compiler oracle-fonts
          release=$(sed -n 's/^release = //p' whitefoot.pin)
          mkdir -p build/research/layout tests/layout
          cp "$GITHUB_WORKSPACE/tests/layout/line-fill-cases.html" tests/layout/
          (cd renderer && "../build/whitefoot/$release/whitefootc" --cache ../build/whitefoot-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle)
          build/layout_oracle dump 1 tests/layout/line-fill-cases.html renderer/style/ua.css > build/research/layout/line-fill-cases.base.tsv
          cp build/research/layout/line-fill-cases.base.tsv "$GITHUB_WORKSPACE/build/research/layout/"
          node "$GITHUB_WORKSPACE/tests/layout/layout_oracle.mjs" compare "$GITHUB_WORKSPACE/build/oracle/layout/line-fill-cases.chromium.tsv" build/research/layout/line-fill-cases.base.tsv || echo "compare exited $?"
      - name: Style cases against Chromium, including tab-size
        if: ${{ !cancelled() }}
        run: sh research/investigations/style/run.sh check cases
      - name: Keep the dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: line-fill-dumps
          path: |
            build/oracle/layout/*.tsv
            build/oracle/style/cases.chromium.tsv
            build/research/layout/*.tsv
            build/research/layout/*.compare.txt
            build/research/style/cases.seq.tsv
          if-no-files-found: warn

  apollo11-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE: e3a1560
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Toolchain, fonts and the reference browser
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-mono fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s toolchain compiler oracle-fonts
      - name: apollo11 inputs and the layout_oracle driver at the head and at the base, one compiler
        run: |
          set -euo pipefail
          mkdir -p build/research/concurrency
          tar -xzf tests/layout/fixtures/apollo11/inputs.tar.gz -C build/research/concurrency
          sha256sum -c tests/layout/fixtures/apollo11/inputs.sha256
          compiler=$GITHUB_WORKSPACE/build/whitefoot/$(sed -n 's/^release = //p' whitefoot.pin)/whitefootc
          base=$RUNNER_TEMP/base
          git worktree add --detach "$base" "$BASE"
          echo "head: $(git rev-parse HEAD)"
          echo "base: $(git -C "$base" rev-parse HEAD)"
          echo "pin at head: $(sed -n 's/^release = //p' whitefoot.pin), at base: $(sed -n 's/^release = //p' "$base/whitefoot.pin")"
          mkdir -p "$base/build/research"
          cp -r build/fonts "$base/build/fonts"
          cp -r build/research/concurrency "$base/build/research/concurrency"
          for tree in "$GITHUB_WORKSPACE" "$base"; do
            (cd "$tree/renderer" && "$compiler" --cache "$tree/build/whitefoot-cache" --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle)
          done
      - name: apollo11 dumped by Chromium, the base and the head, and compared
        run: |
          set -euo pipefail
          base=$RUNNER_TEMP/base
          data=build/research/concurrency
          page=$data/apollo11.html
          ua=renderer/style/ua.css
          sheets="wikibase.client.init&only=styles&skin=vector-2022=$data/apollo11-modules.css modules=site.styles&only=styles&skin=vector-2022=$data/apollo11-site.css"
          mkdir -p build/parity
          "$CHROMIUM" --version
          node tests/layout/layout_oracle.mjs dump "$page" $sheets > build/parity/apollo11.chromium.tsv
          (cd "$base" && build/layout_oracle dump 1 "$page" "$ua" $sheets) > build/parity/apollo11.base.tsv
          build/layout_oracle dump 1 "$page" "$ua" $sheets > build/parity/apollo11.head.tsv
          for tree in base head; do
            status=0
            node tests/layout/layout_oracle.mjs compare build/parity/apollo11.chromium.tsv "build/parity/apollo11.$tree.tsv" > "build/parity/apollo11.$tree.compare.txt" || status=$?
            echo "== apollo11 $tree against Chromium (compare exit $status; 0 and 1 are judged, 3 means the structure differs)"
            cat "build/parity/apollo11.$tree.compare.txt"
          done
          echo "== what the head's work changed in the comparison (base, then head)"
          diff build/parity/apollo11.base.compare.txt build/parity/apollo11.head.compare.txt || true
      - name: Every abbr element and every link followed by punctuation, Chromium beside the base and the head
        run: |
          set -euo pipefail
          page=build/research/concurrency/apollo11.html
          data=build/research/concurrency
          sheets="wikibase.client.init&only=styles&skin=vector-2022=$data/apollo11-modules.css modules=site.styles&only=styles&skin=vector-2022=$data/apollo11-site.css"
          cat > build/parity/candidates.mjs <<'JSEOF'
          // Writes the abbr elements and the links whose next sibling is a
          // text node starting with punctuation, indexed as layout_oracle.mjs
          // indexes elements (querySelectorAll('*')) and text nodes (tree-order
          // walk of every text node), loading the page as that script does.
          import { createRequire } from 'node:module';
          import { readFileSync } from 'node:fs';
          const require = createRequire(process.cwd() + '/');
          const { chromium } = require(process.env.PLAYWRIGHT);
          const [pagePath, ...mappings] = process.argv.slice(2);
          const sheets = mappings.map((m) => {
            const at = m.lastIndexOf('=');
            return { suffix: m.slice(0, at), body: readFileSync(m.slice(at + 1)) };
          }).sort((a, b) => b.suffix.length - a.suffix.length);
          const pageBody = readFileSync(pagePath);
          const URL_ = 'http://snowghost.test/page/index.html';
          const browser = await chromium.launch({ executablePath: process.env.CHROMIUM, headless: true });
          try {
            const context = await browser.newContext({ javaScriptEnabled: false, viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1, colorScheme: 'light', locale: 'en-US' });
            const page = await context.newPage();
            await page.emulateMedia({ media: 'screen', colorScheme: 'light' });
            await page.route('**/*', (route) => {
              const url = route.request().url();
              if (url === URL_) return route.fulfill({ status: 200, contentType: 'text/html; charset=utf-8', body: pageBody });
              const sheet = sheets.find((s) => url.endsWith(s.suffix));
              if (sheet) return route.fulfill({ status: 200, contentType: 'text/css; charset=utf-8', body: sheet.body });
              return route.abort();
            });
            await page.goto(URL_, { waitUntil: 'load' });
            const rows = await page.evaluate(() => {
              const elements = document.querySelectorAll('*');
              const index = new Map();
              elements.forEach((e, i) => index.set(e, i));
              const ordinal = new Map();
              const walker = document.createTreeWalker(document, NodeFilter.SHOW_TEXT);
              let k = 0;
              for (let n = walker.nextNode(); n; n = walker.nextNode()) ordinal.set(n, k++);
              const own = (element) => {
                const found = [];
                const w = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
                for (let n = w.nextNode(); n; n = w.nextNode()) found.push(ordinal.get(n));
                return found.join(',');
              };
              const clean = (s) => s.replace(/[\t\n\r\\]/g, ' ').slice(0, 40);
              const punctuation = /^[\p{P}]/u;
              const rows = [];
              elements.forEach((element, i) => {
                if (element.localName === 'abbr') {
                  rows.push(['abbr', i, own(element), getComputedStyle(element).fontVariantCaps, '', clean(element.textContent)]);
                } else if (element.localName === 'a') {
                  const next = element.nextSibling;
                  if (next && next.nodeType === 3 && punctuation.test(next.data)) {
                    rows.push(['link', i, own(element), getComputedStyle(element).fontVariantCaps, next.data[0], clean(element.textContent)]);
                  }
                }
              });
              return rows;
            });
            process.stdout.write(rows.map((r) => r.join('\t')).join('\n') + '\n');
          } finally {
            await browser.close();
          }
          JSEOF
          node build/parity/candidates.mjs "$page" $sheets > build/parity/candidates.tsv
          wc -l build/parity/candidates.tsv
          cat > build/parity/widths.py <<'PYEOF'
          import sys
          from pathlib import Path

          EXACT = 1 / 64 + 1e-4

          def load(path):
              elements, texts = {}, {}
              for line in Path(path).read_text().splitlines():
                  parts = line.split('\t')
                  if parts[0] == 'E':
                      elements[int(parts[1])] = rects(parts[5])
                  elif parts[0] == 'T':
                      texts[int(parts[1])] = rects(parts[3])
              return elements, texts

          def rects(field):
              return [tuple(float(n) for n in r.split(',')) for r in field.split(' ')] if field else []

          dumps = {name: load(f'build/parity/apollo11.{name}.tsv') for name in ('chromium', 'base', 'head')}

          def widths(name, row):
              elements, texts = dumps[name]
              element_rects = elements.get(row['index'], [])
              text_rects = [r for k in row['texts'] for r in texts.get(k, [])]
              return [r[2] for r in element_rects], [r[2] for r in text_rects]

          def same(a, b):
              return len(a) == len(b) and all(abs(x - y) <= EXACT for x, y in zip(a, b))

          def shown(ws):
              return f'{sum(ws):.4f}' + (f'/{len(ws)}' if len(ws) != 1 else '')

          rows = []
          for line in Path('build/parity/candidates.tsv').read_text().splitlines():
              kind, index, texts, caps, following, text = line.split('\t')
              rows.append({'kind': kind, 'index': int(index), 'texts': [int(t) for t in texts.split(',') if t], 'caps': caps, 'following': following, 'text': text})

          def verdict(row):
              c, b, h = (widths(n, row) for n in ('chromium', 'base', 'head'))
              if not c[0] and not c[1]:
                  return 'NO-BOX'
              head_ok = same(h[0], c[0]) and same(h[1], c[1])
              base_ok = same(b[0], c[0]) and same(b[1], c[1])
              if not head_ok:
                  return 'STILL-WRONG'
              return 'BASE-EQUAL' if base_ok else 'FIXED'

          print('kind  index  caps        next  chromium(element|text)  base(element|text)  head(element|text)  verdict  text')
          counts = {}
          wrong = False
          ordered = sorted(rows, key=lambda r: (r['kind'], r['caps'] != 'small-caps', r['index']))
          for row in ordered:
              c, b, h = (widths(n, row) for n in ('chromium', 'base', 'head'))
              v = verdict(row)
              group = row['kind'] + (' small-caps' if row['caps'] == 'small-caps' else '')
              counts.setdefault(group, {}).setdefault(v, 0)
              counts[group][v] += 1
              if v == 'STILL-WRONG' and (row['kind'] == 'link' or row['caps'] == 'small-caps'):
                  wrong = True
              print(f"{row['kind']:5} {row['index']:6} {row['caps']:11} {row['following'] or '-':4}  {shown(c[0])}|{shown(c[1])}  {shown(b[0])}|{shown(b[1])}  {shown(h[0])}|{shown(h[1])}  {v}  {row['text']}")
          print()
          print('summary (FIXED: base differed from Chromium and the head equals it; BASE-EQUAL: the base already equalled it, so the row does not test the fix; STILL-WRONG: the head differs from Chromium by more than 1/64 px)')
          for group in sorted(counts):
              print(f'  {group}: ' + ', '.join(f'{k} {n}' for k, n in sorted(counts[group].items())))
          sys.exit(1 if wrong else 0)
          PYEOF
          python3 -B build/parity/widths.py | tee build/parity/widths.txt
      - name: Keep the dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apollo11-parity-dumps
          path: |
            build/parity/*.tsv
            build/parity/*.txt
          if-no-files-found: warn
