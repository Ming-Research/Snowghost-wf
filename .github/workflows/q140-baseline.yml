# Temporary Q140 pre-implementation fixture characterization. Remove when
# the candidate gate takes over; reason 2 is never a Q140 admission result.
name: q140-baseline
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: Run the full fixture matrix after inspecting the pilot
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: q140-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37857671233
          name: q139-baseline
          path: build
      - name: Verify unchanged renderer and pin before driver reuse
        run: |
          set -euo pipefail
          baseline=$(head -1 build/baseline-revision.txt)
          git diff --exit-code "$baseline" HEAD -- renderer whitefoot.pin
          chmod +x build/layout_base build/layout_base_par
          git rev-parse HEAD > build/q140-revision.txt
          cat build/baseline-revision.txt >> build/q140-revision.txt
      - name: Fonts and independent reference browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          npm install --prefix build/reference playwright@1.56.1
          build/reference/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/build/reference/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM=" + require("./build/reference/node_modules/playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          make -s oracle-fonts
      - name: Small timed fixture before the matrix
        id: pilot
        run: |
          set -euo pipefail
          "$CHROMIUM" --version
          time python3 research/investigations/incremental-layout/scripts/grid-splice.py build/layout_base build/q140-pilot --case fixed --baseline
      - name: Baseline geometry and counted grid refusals
        if: ${{ !cancelled() && steps.pilot.conclusion == 'success' && inputs.matrix }}
        run: |
          set -euo pipefail
          failed=0
          for mode in seq par; do
            driver=build/layout_base
            if [ "$mode" = par ]; then driver=build/layout_base_par; fi
            WF_WORKERS=4 python3 research/investigations/incremental-layout/scripts/grid-splice.py "$driver" "build/q140-$mode" --baseline || failed=1
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q140-baseline
          path: |
            build/q140-*/
            build/q140-revision.txt
            build/baseline-revision.txt
