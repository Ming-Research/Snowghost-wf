# Temporary, for M2's layout branch: checks pkg::layout alone on every push,
# a faster loop than make check while its interfaces and effect rows change.
# Removed before the branch is ready.
name: layout-check

on:
  push:
    branches: [research/m2-sync-main, research/m2-layout, research/m2-edit-cost, research/m2-frag-a, research/m2-frag-b, research/m2-q139, research/m2-q140, research/m2-fallback-cost]
  workflow_dispatch:

concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check pkg::layout
        run: |
          make -s toolchain compiler
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cd renderer && "$wfc" --graph modules.wfg --check-module pkg::layout || { "$wfc" --diagnostic-format json --graph modules.wfg --check-module pkg::layout > ../layout-diagnostics.json 2>&1; cat ../layout-diagnostics.json; exit 1; }
