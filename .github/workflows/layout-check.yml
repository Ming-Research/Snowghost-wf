# Temporary upgrade validation; remove before marking the branch ready.
name: layout-check
on:
  push:
    branches: [research/wf-upgrade-f887]
  workflow_dispatch:
concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the pinned toolchain
        run: make toolchain
      - name: Check pkg::layout
        run: |
          wfc=$(realpath build/whitefoot/wf-f887e82c4611/whitefootc)
          cd renderer
          /usr/bin/time -p "$wfc" --graph modules.wfg --check-module pkg::layout
