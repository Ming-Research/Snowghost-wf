# Temporary, for M2's layout branch: checks pkg::layout alone on every push,
# a faster loop than make check while its interfaces and effect rows change.
# Removed before the branch is ready.
name: layout-check

on:
  push:
    branches: [research/m2-layout, research/m2-pages, research/m2-paged-nodes]

concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: make toolchain
      - name: Isolate guarded append acceptance
        run: |
          make -s compiler
          python3 research/investigations/structure-edits/scripts/paged-guard-probe.py
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          for source in build/paged-guard/*.wf; do
            if "$wfc" --check "$source" > "$source.log" 2>&1; then
              echo "$source: accepted"
            else
              status=$?
              echo "$source: rejected ($status)"
              cat "$source.log"
            fi
          done
      - name: Base html5 allocation census and native allocation IR
        run: |
          set -euo pipefail
          git fetch origin 38fd6be2ba5ad1ca972f689e734e7f40737d8876
          git worktree add --detach build/allocation-base 38fd6be2ba5ad1ca972f689e734e7f40737d8876
          python3 research/investigations/structure-edits/scripts/paged-allocation-probe.py build/allocation-base
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          for source in build/allocation-base/*.wf; do
            "$wfc" --emit-llvm "$source" -o "$source.ll"
            echo "$(basename "$source"): allocation calls"
            grep 'call ptr @malloc' "$source.ll"
          done
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          make oracle-fonts
          (cd build/allocation-base/renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o "$GITHUB_WORKSPACE/build/allocation-census")
          build/allocation-census layout 1 tests/layout/flow-cases.html renderer/style/ua.css > build/allocation-sample.txt
          sh research/investigations/concurrency/run.sh fetch || test -f build/research/concurrency/html5.html
          build/allocation-census layout 1 build/research/concurrency/html5.html renderer/style/ua.css > build/allocation-html5.txt
          python3 research/investigations/structure-edits/scripts/paged-allocation-probe.py --summarize build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocation-probe
          path: |
            build/allocation-*.txt
            build/allocation-base/*.wf.ll
            build/paged-guard/*.log
      - name: Check pkg::layout
        if: always()
        run: |
          make -s compiler
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          cd renderer && "$wfc" --graph modules.wfg --check-module pkg::layout
