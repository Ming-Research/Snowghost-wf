# Temporary upgrade validation; remove before marking the branch ready.
name: layout-check
on:
  push:
    branches: [research/wf-upgrade-f887]
  workflow_dispatch:
concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the pinned toolchain
        run: make toolchain
      - name: Check pkg::layout
        run: |
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          cd renderer
          /usr/bin/time -p "$wfc" --graph modules.wfg --check-module pkg::layout
  emission:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [f887, current]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'f887' && 'c3ea1c84ca3a2eca1e4048555d8a7298bd620d00' || github.sha }}
          submodules: true
      - name: Install the pinned toolchain
        run: make toolchain
      - name: Emit the renderer and retain the complete ledger
        run: |
          set -euo pipefail
          mkdir -p emission
          git rev-parse HEAD > emission/revision.txt
          cat whitefoot.pin >> emission/revision.txt
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          cp "build/whitefoot/$pin/whitefoot-release.json" emission/
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          cd renderer
          if "$wfc" --par --par-ledger --emit-llvm --graph modules.wfg --entry layout_oracle \
              -o ../emission/layout_oracle.ll > ../emission/compiler.stdout 2> ../emission/compiler.stderr; then
            compiler_exit=0
          else
            compiler_exit=$?
          fi
          printf '%s\n' "$compiler_exit" > ../emission/compiler.exit
          exit "$compiler_exit"
      - name: Count emitted lane operations by function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('emission/layout_oracle.ll').read_text()
          rows = ['function\tacquire\tpublish\tjoin']
          for match in re.finditer(r'^define [^\n]*@([^ (]+)\([^\n]*\).*?^}', text, re.M | re.S):
              name, body = match.group(1), match.group(0)
              counts = [len(re.findall(r'\bcall\b[^\n]*@wf__par_' + op + r'\(', body))
                        for op in ('acquire_lane', 'publish', 'join')]
              if any(counts) or 'prepare_context' in name or 'shape_with' in name:
                  rows.append(name + '\t' + '\t'.join(map(str, counts)))
          Path('emission/parallel-counts.tsv').write_text('\n'.join(rows) + '\n')
          for row in rows:
              if row.startswith('function') or 'prepare_context' in row or 'shape_with' in row:
                  print(row)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-emission-${{ matrix.side }}
          if-no-files-found: error
          path: emission/
  io-adaptation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the pinned toolchain
        run: make toolchain
      - name: Exercise the error reader and its negative controls
        run: |
          set -euo pipefail
          mkdir -p build/upgrade-io
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('build/upgrade-io')
          path = 'renderer/oracle/support/support.wf'
          current = Path(path).read_text()
          old = subprocess.check_output(['git', 'show', 'c3ea1c8:' + path], text=True)
          def reader(source):
              return 'fn io_error_code(' + source.split('fn io_error_code(', 1)[1].split('\nfn put_host_error(', 1)[0]
          probe = '''
          fn main() -> status: std::process::ExitStatus pure {
            let cancelled = io_error_code(error: IoError::Cancelled());
            let deadline = io_error_code(error: IoError::DeadlinePassed());
            let host = io_error_code(error: IoError::Other(code: 37_u32, origin: 1_u8));
            if cancelled != 0_u32 {
              return std::process::exit_status(code: 1_u8);
            }
            if deadline != 0_u32 {
              return std::process::exit_status(code: 2_u8);
            }
            if host != 37_u32 {
              return std::process::exit_status(code: 3_u8);
            }
            return std::process::exit_status(code: 0_u8);
          }
          '''
          body = reader(current)
          zero = 'Cancelled() => {\n      return 0_u32;'
          assert body.count(zero) == 1
          wrong = body.replace(zero, 'Cancelled() => {\n      return 1_u32;')
          for name, source in [('current', body), ('before', reader(old)), ('wrong', wrong)]:
              (root / (name + '.wf')).write_text('alias IoError = std::io::IoError;\n' + source + probe)
          PY
          pin=$(sed -n 's/^release = //p' whitefoot.pin)
          wfc=$(realpath "build/whitefoot/$pin/whitefootc")
          "$wfc" build/upgrade-io/current.wf -o build/upgrade-io/current
          build/upgrade-io/current
          if "$wfc" build/upgrade-io/before.wf -o build/upgrade-io/before > build/upgrade-io/before.log 2>&1; then
            echo 'the old reader unexpectedly accepted the cancellation variant' >&2
            exit 1
          fi
          grep 'NonExhaustiveMatch' build/upgrade-io/before.log
          "$wfc" build/upgrade-io/wrong.wf -o build/upgrade-io/wrong
          if build/upgrade-io/wrong; then
            echo 'the error-code probe missed a wrong cancellation code' >&2
            exit 1
          else
            wrong_exit=$?
          fi
          test "$wrong_exit" -eq 1
          echo 'current reader passed; old reader rejected; wrong cancellation code detected'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-io-adaptation
          path: build/upgrade-io/
