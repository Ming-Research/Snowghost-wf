# Temporary: the style stage's step timing and matcher counters on ecma262,
# html5 and apollo11, and the scan-parameter experiment, on a GitHub-hosted
# runner (research/investigations/style/DESIGN.md, "Step timing"). The numbers
# attribute time to steps; they are not precise timings, which run on the
# 14900K runner. Remove this workflow when the investigation closes.
name: style-build-timing

on:
  push:
    branches: [research/style-build-timing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-build-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: step timing, counters and identity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Host toolchain and compiler
        run: make -s toolchain compiler

      - name: Machine
        run: |
          mkdir -p build/research/style
          { uname -srm; nproc; lscpu | sed -n 's/^\(Model name\|CPU(s)\|Thread(s) per core\|L2 cache\|L3 cache\):/\1:/p'; cat whitefoot.pin; git rev-parse HEAD; git rev-parse origin/main; } | tee build/research/style/machine.txt

      - name: Pages
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          tar -xzf tests/layout/fixtures/apollo11/inputs.tar.gz -C build/research/concurrency
          sha256sum -c tests/layout/fixtures/apollo11/inputs.sha256
          for file in ecma262.html ecma262-ecmarkup.css ecma262-print.css html5.html apollo11.html apollo11-modules.css apollo11-site.css; do
            test -s "build/research/concurrency/$file"
          done
          rm -f build/research/concurrency/*.unverified
          (cd build/research/concurrency && sha256sum ecma262* html5.html apollo11*)

      # The drivers of origin/main, built with the same compiler: the dumps they
      # write are what the profiled path's must equal byte for byte, and they
      # are the baseline for the cost of the matcher's counters.
      - name: Earlier build (origin/main)
        run: |
          set -euo pipefail
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/base-drivers
          git worktree add -q --detach build/base origin/main
          cat build/base/whitefoot.pin
          (cd build/base/renderer && "$wfc" --cache "$GITHUB_WORKSPACE/build/whitefoot-cache" --fragments function --graph modules.wfg --entry style_oracle -o "$GITHUB_WORKSPACE/build/base-drivers/style_oracle")
          (cd build/base/renderer && "$wfc" --cache "$GITHUB_WORKSPACE/build/whitefoot-cache" --fragments function --par --par-ledger --graph modules.wfg --entry style_oracle -o "$GITHUB_WORKSPACE/build/base-drivers/style_oracle_par" > "$GITHUB_WORKSPACE/build/base-drivers/ledger.txt")
          git -C build/base rev-parse HEAD

      - name: Identity, step timing and counters
        run: |
          set -o pipefail
          BASE_DRIVERS="$GITHUB_WORKSPACE/build/base-drivers" sh research/investigations/style/run.sh profile ecma262 html5 apollo11 2>&1 | tee build/research/style/profile-log.txt
          { echo '```'; cat build/research/style/profile-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The ledger for match_all, earlier build and this one
        if: always()
        run: |
          grep -h 'style\.match_all ' build/base-drivers/ledger.txt build/research/style/ledger.txt | tee build/research/style/ledger-match-all.txt

      - name: Cost of the counters when they count nothing
        if: always()
        run: |
          set -o pipefail
          BASE_DRIVERS="$GITHUB_WORKSPACE/build/base-drivers" sh research/investigations/style/run.sh overhead ecma262 html5 apollo11 2>&1 | tee build/research/style/overhead.txt
          { echo '```'; cat build/research/style/overhead.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-step-timing-${{ github.run_id }}
          path: |
            build/research/style/machine.txt
            build/research/style/profile-*.txt
            build/research/style/overhead.txt
            build/research/style/ledger*.txt
            build/base-drivers/ledger.txt

  scan-param:
    name: scan entry with and without the positions parameter
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Host toolchain and compiler
        run: make -s toolchain compiler

      - name: Pages
        run: |
          set -euo pipefail
          sh research/investigations/concurrency/run.sh fetch || true
          tar -xzf tests/layout/fixtures/apollo11/inputs.tar.gz -C build/research/concurrency
          sha256sum -c tests/layout/fixtures/apollo11/inputs.sha256
          rm -f build/research/concurrency/*.unverified
          mkdir -p build/scan-param

      - name: Machine
        run: |
          { uname -srm; nproc; lscpu | sed -n 's/^Model name:/Model name:/p'; cat whitefoot.pin; git rev-parse HEAD; } | tee build/scan-param-machine.txt

      - name: Build base, noparam and twin
        run: sh research/investigations/style/scan-param.sh build 2>&1 | tee build/scan-param-build.log

      - name: The builds agree
        run: sh research/investigations/style/scan-param.sh check ecma262 apollo11 2>&1 | tee build/scan-param-check.log

      - name: Time shape A in interleaved rounds
        run: |
          set -o pipefail
          ROUNDS=5 sh research/investigations/style/scan-param.sh time ecma262 apollo11 2>&1 | tee build/scan-param-time.log
          { echo '```'; cat build/scan-param-time.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-param-${{ github.run_id }}
          path: |
            build/scan-param-*.log
            build/scan-param-machine.txt
            build/scan-param/times.txt
            build/scan-param/check-*.txt
