# Temporary same-source instruction attribution; remove before readiness.
name: q140-attribute
on:
  push:
    branches: [research/m2-q140]
    paths: ['.github/workflows/q140-attribute.yml', 'research/investigations/incremental-layout/scripts/q140-attribute.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [head, equivalent, legacy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37917735046
          name: q140-edit-cost
          path: build/measured
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37917728829
          name: page-identity-inputs
          path: build/reference
      - name: Restore measured inputs and compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld valgrind
          make -s compiler
          mkdir -p build/attribute build/research
          mv build/reference/fonts build/fonts
          mv build/measured/research/concurrency build/research/concurrency
          awk '$2 ~ /^build\/(fonts|research\/concurrency)\//' build/measured/evidence/inputs.sha256 > build/attribute/inputs.sha256
          test -s build/attribute/inputs.sha256
          sha256sum -c build/attribute/inputs.sha256 > build/attribute/inputs-verified.txt
          git rev-parse HEAD > build/attribute/revision.txt
          uname -a > build/attribute/machine.txt
          lscpu >> build/attribute/machine.txt
          valgrind --version >> build/attribute/machine.txt
          clang --version >> build/attribute/machine.txt
          sha256sum build/whitefoot/*/whitefootc > build/attribute/compiler.sha256
      - name: Isolate only the final reuse condition and build
        run: |
          set -euo pipefail
          if [ '${{ matrix.variant }}' != head ]; then
            python3 research/investigations/incremental-layout/scripts/q140-attribute.py '${{ matrix.variant }}'
          fi
          git diff -- renderer > build/attribute/ablation.patch
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          /usr/bin/time -p -o build/attribute/build.resources sh -c 'cd renderer && "$1" --cache ../build/profile-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/profile-driver' sh "$wfc"
      - name: Bounded zero/one profile and native dump
        run: |
          set -euo pipefail
          args=(build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css')
          for count in 0 1; do
            WF_WORKERS=4 /usr/bin/time -f '%e %M' -o "build/attribute/$count.resources" valgrind --tool=callgrind --callgrind-out-file="build/attribute/$count.callgrind" build/profile-driver layout "$count" "${args[@]}" > "build/attribute/$count.stdout" 2> "build/attribute/$count.stderr"
            callgrind_annotate --auto=no --inclusive=no --threshold=100 "build/attribute/$count.callgrind" > "build/attribute/$count.self.txt"
          done
          build/profile-driver dump 1 "${args[@]}" > build/attribute/apollo.dump
          build/profile-driver nodes 0 "${args[@]}" > build/attribute/apollo.nodes
      - name: Trace each child's inputs separately from the profile
        if: matrix.variant == 'head'
        run: |
          set -euo pipefail
          python3 research/investigations/incremental-layout/scripts/q140-attribute.py trace
          git diff -- renderer > build/attribute/trace.patch
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          (cd renderer && "$wfc" --cache ../build/profile-cache --fragments function --graph modules.wfg --entry layout_oracle -o ../build/trace-driver)
          build/trace-driver layout 1 build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css' > build/attribute/trace.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q140-attribute-${{ matrix.variant }}
          path: build/attribute/
