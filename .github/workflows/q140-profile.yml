# Temporary instruction diagnostic for Q140's measured Apollo11 regression.
# Uses the measured binaries; remove before readiness with the cost workflow.
name: q140-profile
on:
  push:
    branches: [research/m2-q140]
    paths: ['.github/workflows/q140-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37913944038
          pattern: driver-*
          path: build/drivers
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37917735046
          name: q140-edit-cost
          path: build/measured
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37917728829
          name: page-identity-inputs
          path: build/reference
      - name: Measured source, inputs and diagnostic tool
        run: |
          set -euo pipefail
          source=$(cat build/drivers/driver-head/source-revision.txt)
          git diff --exit-code "$source" HEAD -- renderer whitefoot.pin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          chmod +x build/drivers/driver-*/layout_oracle_seq
          mkdir -p build/profile build/research
          mv build/reference/fonts build/fonts
          mv build/measured/research/concurrency build/research/concurrency
          awk '$2 ~ /^build\/(fonts|research\/concurrency)\//' build/measured/evidence/inputs.sha256 > build/profile/inputs.sha256
          test -s build/profile/inputs.sha256
          sha256sum -c build/profile/inputs.sha256 > build/profile/inputs-verified.txt
          cat build/profile/inputs-verified.txt
          uname -a > build/profile/machine.txt
          lscpu >> build/profile/machine.txt
          valgrind --version >> build/profile/machine.txt
          git rev-parse HEAD > build/profile/revision.txt
          for name in m2 twin head; do
            cp "build/drivers/driver-$name/revision.txt" "build/profile/$name-revision.txt"
          done
      - name: Small candidate instruction pilots before the comparison
        run: |
          set -euo pipefail
          args=(build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css')
          for trial in 1 2; do
            WF_WORKERS=4 /usr/bin/time -f '%e %M' -o "build/profile/pilot-$trial.resources" valgrind --tool=callgrind --callgrind-out-file="build/profile/head-pilot-$trial.callgrind" build/drivers/driver-head/layout_oracle_seq layout 1 "${args[@]}" > "build/profile/head-pilot-$trial.stdout" 2> "build/profile/head-pilot-$trial.stderr"
          done
          python3 - <<'PY'
          from pathlib import Path
          samples = [float(Path(f'build/profile/pilot-{trial}.resources').read_text().split()[0]) for trial in (1, 2)]
          print('One-layout instruction pilot seconds:', samples, flush=True)
          if max(samples) > 45:
              raise SystemExit('Instruction pilot exceeds 45 seconds; inspect before expanding')
          print('Pilot permits the six zero/ten samples matching the measured repetition count')
          PY
      - name: Same-input zero/ten instruction comparison and twin
        run: |
          set -euo pipefail
          args=(build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css')
          for sample in m2-0 twin-0 head-0 head-10 twin-10 m2-10; do
            name=${sample%-*} count=${sample##*-}
            WF_WORKERS=4 /usr/bin/time -f '%e %M' -o "build/profile/$sample.resources" valgrind --tool=callgrind --callgrind-out-file="build/profile/$sample.callgrind" "build/drivers/driver-$name/layout_oracle_seq" layout "$count" "${args[@]}" > "build/profile/$sample.stdout" 2> "build/profile/$sample.stderr"
          done
          for file in build/profile/*.callgrind; do
            callgrind_annotate --auto=no --inclusive=no --threshold=100 "$file" > "$file.self.txt"
            callgrind_annotate --auto=no --inclusive=yes --threshold=100 "$file" > "$file.inclusive.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q140-apollo-profile
          path: build/profile/
