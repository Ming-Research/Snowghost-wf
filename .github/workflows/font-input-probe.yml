# Temporary consumed-input trace; remove after the attribution is recorded.
name: font-input-probe
on:
  push:
    branches: [research/m2-frag-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[font-input-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: LLVM 22 and fonts
        run: |
          set -euo pipefail
          sudo sh -c 'printf "%s\n" https://archive.ubuntu.com/ubuntu > /etc/apt/apt-mirrors.txt'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends clang lld fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-freefont-ttf fonts-wqy-zenhei fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-noto-color-emoji fonts-opensymbol
          curl -fsSL --retry 3 -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22 >/dev/null
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          clang --version | head -1
      - name: Build the diagnostic without changing the production renderer
        run: |
          set -euo pipefail
          mkdir -p build/font-input-probe
          git rev-parse HEAD > build/font-input-probe/revision.txt
          python3 research/investigations/m2-edit-cost/font-input-probe.py
          git add -N renderer/layout/font_probe.wf
          git diff -- renderer > build/font-input-probe/injected.patch
          make -s compiler oracle-fonts
          wfc=$(realpath build/whitefoot/wf-41f46e60030c/whitefootc)
          sha256sum "$wfc" > build/font-input-probe/compiler.sha256
          (cd renderer && /usr/bin/time -p "$wfc" --cache "$RUNNER_TEMP/wf-cache" --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
      - name: Original font-size pair and full comparator
        run: |
          set -euo pipefail
          mkdir -p build/research/concurrency
          tar -xzf tests/layout/fixtures/apollo11/inputs.tar.gz -C build/research/concurrency
          sha256sum -c tests/layout/fixtures/apollo11/inputs.sha256
          sh research/investigations/incremental-layout/run.sh prepare apollo11
          head -n 3 build/x5/scripts/apollo11-fontsize.edits > build/font-input-probe/pair.edits
          args=(build/research/concurrency/apollo11.html renderer/style/ua.css 'wikibase.client.init&only=styles&skin=vector-2022=build/research/concurrency/apollo11-modules.css' 'modules=site.styles&only=styles&skin=vector-2022=build/research/concurrency/apollo11-site.css')
          WF_WORKERS=4 /usr/bin/time -p -o build/font-input-probe/pair.time timeout 60 build/layout_oracle_seq edit build/font-input-probe/pair.edits "${args[@]}" > build/font-input-probe/pair.raw
          sed '/^font_probe /d' build/font-input-probe/pair.raw > build/font-input-probe/pair.ordinary
          python3 research/investigations/incremental-layout/scripts/inctime.py --check build/font-input-probe/pair.edits build/font-input-probe/pair.ordinary
          python3 - <<'PYEOF'
          from pathlib import Path
          lines = Path('build/font-input-probe/pair.raw').read_text().splitlines()
          records = [l.split() for l in lines if l.startswith('font_probe ')]
          fields = Path('build/font-input-probe/schema.txt').read_text().split()[1:]
          frames = [dict(zip(fields, map(int,r[1:]))) for r in records if len(r) > 2]
          assert frames and all(len(r) == len(fields) + 1 for r in records if len(r) > 2)
          assert {1,2,3} <= {r['stage'] for r in frames}, frames
          assert any(len(r) == 2 for r in records), 'missing refusal observations'
          print('input snapshots',len(frames),'refusals',sum(len(r)==2 for r in records))
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-input-probe
          path: build/font-input-probe/
