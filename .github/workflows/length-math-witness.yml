# Temporary, for research/length-math: compiles the generic and concrete
# length-expression arena witnesses with the pinned compiler and records
# each command's own exit status and diagnostics. Removed before the branch
# is ready.
name: length-math-witness

on:
  push:
    branches: [research/length-math]
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: make -s toolchain compiler
      - name: Generic and concrete witnesses
        run: |
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          d=build/research/layout/length-math-witnesses
          w=research/investigations/layout/length-math-witnesses
          mkdir -p "$d"
          generic=0
          "$wfc" "$w/generic.wf" -o "$d/generic" > "$d/generic.log" 2>&1 || generic=$?
          echo "generic.wf compile exit $generic"; cat "$d/generic.log"
          concrete=0
          "$wfc" "$w/concrete.wf" -o "$d/concrete" > "$d/concrete.log" 2>&1 || concrete=$?
          echo "concrete.wf compile exit $concrete"; cat "$d/concrete.log"
          if [ "$concrete" = 0 ]; then run=0; "$d/concrete" || run=$?; echo "concrete run exit $run"; fi
