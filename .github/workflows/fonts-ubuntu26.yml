name: fonts-ubuntu26
on:
  push:
    branches: [research/fonts-ubuntu26]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Font packages in both Ubuntu images
        run: |
          set -euo pipefail
          mkdir -p results build/fontsets
          fonts=$(sed -n 's/^          fonts="\(.*\)"$/\1/p' .github/workflows/time-14900k.yml)
          test -n "$fonts"
          for version in 26.04 24.04; do
            image=ubuntu:$version
            docker pull "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' | tee "results/image-$version.txt"
            mkdir -p "build/fontsets/$version"
            docker run --rm -v "$PWD/build/fontsets/$version:/out" "$image" bash -euc '
              apt-get update
              mkdir -p /out/debs /out/root
              cd /out/debs
              apt-get download $1
              for d in *.deb; do
                printf "PACKAGE %s " "$2"
                dpkg-deb -f "$d" Package Version | tr "\n" " "
                printf "\n"
                dpkg -x "$d" /out/root
              done
            ' bash "$fonts" "$version" | tee "results/packages-$version.txt"
          done
      - name: Build the unchanged timing driver
        run: |
          set -euo pipefail
          make compiler
          make toolchain
          make toolchain-check
          wfc=$(realpath "$(ls build/whitefoot/*/whitefootc | head -1)")
          mkdir -p build/wf-cache
          cat build/whitefoot/*/whitefoot-release.json
          git rev-parse HEAD
          /usr/bin/clang --version
          (cd renderer && "$wfc" --cache "$PWD/../build/wf-cache" --fragments function --graph modules.wfg --entry layout_oracle -o ../build/layout_oracle_seq)
          cp build/layout_oracle_seq build/layout_oracle_original
          (cd renderer && "$wfc" --cache "$PWD/../build/wf-cache" --fragments function --graph modules.wfg --entry font_face_oracle -o ../build/font_face_oracle)
      - name: Independent font tools and Chromium
        run: |
          python3 -m venv build/fonttools-env
          build/fonttools-env/bin/pip install fonttools
          npm install --prefix build/browser playwright@1.56.0
          build/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Reproduce and isolate
        run: build/fonttools-env/bin/python research/investigations/fonts-ubuntu26/diagnose.py
      - name: Chromium validates changed fonts
        if: always() && !cancelled()
        run: node research/investigations/fonts-ubuntu26/chromium.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fonts-ubuntu26-${{ github.run_id }}
          path: results/
