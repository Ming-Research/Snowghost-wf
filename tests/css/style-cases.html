<!DOCTYPE html>
<!-- Cases of the style stage that the three real pages exercise little or
     not at all, compared with Chromium by research/investigations/style/run.sh
     check: var() with fallbacks and cycles, calc(), shorthands, media query
     ranges, @supports, explicit inherit, initial and unset, !important and
     style attributes, and the font sizes of the absolute keywords and of
     sizes relative to them, with and without monospace. -->
<html><head><style>
:root { --a: 10px; --b: var(--a); --c: var(--missing, 3em); --cycle1: var(--cycle2); --cycle2: var(--cycle1); --color: rgb(1 2 3); --pair: 4px 8px; }
.v1 { margin-left: var(--b); padding: var(--pair); }
.v2 { width: var(--c); color: var(--color); }
.v3 { height: var(--cycle1, 7px); border: var(--nope); }
.v4 { margin: calc(10% - 2em) auto; width: calc(100% - 8px); height: calc(2 * 5px + 1em); }
.v5 { font: italic bold 20px/1.2 "Some Font", Georgia, serif; }
.v6 { font-size: larger; line-height: 150%; letter-spacing: 0.1em; word-spacing: 2px; }
.v7 { border: 2px dashed red; border-left: thin solid; border-top-color: currentcolor; color: hsl(120 50% 50% / .5); }
.v8 { background: url(x.png) no-repeat #abc; overflow: hidden auto; list-style: inside square; text-decoration: underline dotted red; }
.v9 { display: inline-block; float: left; position: absolute; top: 5%; z-index: -3; }
.v10 { display: flex } .v10 > span { display: inline }
.v11 { width: inherit; border-color: inherit; } .v11p { width: 33px; border: 1px solid blue; }
.v12 { font-size: 0.5em; font-family: monospace; } .v13 { font-size: small; font-family: monospace; }
@media (min-width: 1000px) and (max-width: 1300px) { .m1 { min-width: 11px } }
@media (width < 600px), print { .m2 { min-width: 12px } }
@media not screen { .m3 { min-width: 13px } }
@media (400px <= width <= 2000px) { .m4 { min-height: 14px } }
@supports (display: flex) and (not (foo: bar)) { .s1 { max-width: 21px } }
@supports selector(:is(a)) { .s2 { max-height: 22px } }
.imp { color: red !important; } #i { color: blue; }
.ws { white-space: pre-wrap; text-transform: uppercase; text-align: justify; text-indent: -1em; vertical-align: 25%; }
.mx { max-width: min-content; min-height: fit-content; }
.self { --self: var(--self, 5px); padding-left: var(--self, 7px); }
.cyc { --ca: var(--cb); --cb: var(--ca); --cc: var(--ca, 11px); padding-left: var(--cc, 3px); padding-right: var(--ca, 4px); }
.thi th { text-align: inherit; } .ob { font-style: oblique; }
.unset { color: unset; margin: initial; } .unsetp { color: green; margin: 5px; }
</style></head><body>
<div class="v1">a</div><div class="v2">b</div><div class="v3">c</div><div class="v4">d</div>
<p class="v5">e</p><p class="v6">f</p><div class="v7">g</div><ul class="v8"><li>h</li></ul>
<div class="v9">i</div><div class="v10"><span>j</span></div>
<div class="v11p"><div class="v11">k</div></div>
<div class="v12">l<span class="v13">m</span></div>
<div class="m1 m2 m3 m4 s1 s2">n</div>
<p class="imp" id="i" style="color: purple">o</p>
<p class="ws">p</p><p class="mx">q</p>
<div class="unsetp"><span class="unset">r</span></div>
<p style="--local: 9px; padding-left: var(--local); margin: var(--a) var(--local)">s</p>
<table><tr><th>t</th><td>u</td></tr></table>
<table class="thi"><tr><th>v</th></tr></table><p class="self">w</p><p class="ob">x</p><div class="cyc">y</div>
<span style="font-family:monospace;font-size:xx-small">xx-small</span><span style="font-family:monospace;font-size:x-small">x-small</span><span style="font-family:monospace;font-size:small">small</span><span style="font-family:monospace;font-size:medium">medium</span><span style="font-family:monospace;font-size:large">large</span><span style="font-family:monospace;font-size:x-large">x-large</span><span style="font-family:monospace;font-size:xx-large">xx-large</span><span style="font-family:monospace;font-size:xxx-large">xxx-large</span><span style="font-size:xx-small">xx-small</span><span style="font-size:x-small">x-small</span><span style="font-size:small">small</span><span style="font-size:medium">medium</span><span style="font-size:large">large</span><span style="font-size:x-large">x-large</span><span style="font-size:xx-large">xx-large</span><span style="font-size:xxx-large">xxx-large</span><div style="font-family:monospace;font-size:0.5em">a</div><div style="font-family:monospace;font-size:150%">b</div><div style="font-family:monospace;font-size:20px">c<span style="font-family:serif">d</span></div><div style="font-family:monospace">e<span style="font-family:serif">f</span><span style="font-size:2em">g</span></div><div style="font-size:large;font-family:monospace">h<span style="font-size:0.5em">i</span></div><div style="font-family:monospace, serif">j</div><div style="font-size:larger;font-family:monospace">k</div>
</body></html>
