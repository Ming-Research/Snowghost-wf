<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSS length comparison functions</title>
<style>
html { font-size: 16px; }
body { margin: 0; }
div { margin: 0; padding: 0; border: 0; }
.grid { display: grid; grid-template-columns: 1fr min(1680px,100%) 1fr; grid-template-rows: 10px 10px; }
.grid > .full { grid-column: 1 / 4; grid-row: 1; height: 10px; }
.grid > .left { grid-column: 1; grid-row: 2; height: 10px; }
.grid > .middle { grid-column: 2; grid-row: 2; height: 10px; }
.grid > .right { grid-column: 3; grid-row: 2; height: 10px; }
.clamped { width: clamp(200px, 50%, 600px); height: 10px; }
.ten { height: 10px; }
.tail { height: 30px; }
.math-percent-height { height: min(100px, 50%); }
.cancel-percent-height { height: calc(min(100% - 100%, 0px) + 1px); }
</style>
</head>
<body>
<!-- The middle track consumes all 1280px; the full-span child must also be 1280px. -->
<div id="grid-narrow" class="grid" style="width:1280px"><div class="full"></div><div class="left"></div><div class="middle"></div><div class="right"></div></div>
<!-- The middle track stops at 1680px; the two flexible tracks receive 160px each. -->
<div id="grid-wide" class="grid" style="width:2000px"><div class="full"></div><div class="left"></div><div class="middle"></div><div class="right"></div></div>
<!-- Lower, preferred and upper clamp arms: widths 200px, 400px and 600px. -->
<div id="clamp-small" style="width:300px"><div class="clamped"></div></div>
<div id="clamp-medium" style="width:800px"><div class="clamped"></div></div>
<div id="clamp-large" style="width:1400px"><div class="clamped"></div></div>
<!-- At the oracle's 1280px viewport, each padding edge is 64px; outer size 138px by 138px. -->
<div id="padding" style="width:10px;height:10px;padding:max(1rem, 5vw)"><div class="ten"></div></div>
<!-- The middle calculation needs no inner calc(): 26.6px; the em-sized probe exposes font size. -->
<div id="font" style="font-size:clamp(1rem, 2vw + 1px, 3rem)"><div style="width:1em;height:1em"></div></div>
<!-- Every argument participates: the third argument wins at 20px. -->
<div id="min-three" class="ten" style="width:min(70px, 30px, 20px)"></div>
<!-- 5% of 100px is 5px; the outer sum makes 7px. -->
<div id="calc-min" style="width:100px"><div class="ten" style="width:calc(min(10px, 5%) + 2px)"></div></div>
<!-- Nesting in both directions: max(20, min(60, 50)) is 50px. -->
<div id="nested" style="width:100px"><div class="ten" style="width:max(20px, min(calc(50% + 10px), clamp(5px, 50px, 80px)))"></div></div>
<!-- The lower bound wins when clamp bounds are reversed: 80px. -->
<div id="reversed" class="ten" style="width:clamp(80px, 10px, 20px)"></div>
<!-- Definite parent: min(100px, 50% of 120px) gives a 60px child. -->
<div id="height-definite" style="height:120px"><div class="math-percent-height"><div class="tail"></div></div></div>
<!-- Indefinite parent: percentage-dependent height is auto, so content supplies 30px. -->
<div id="height-indefinite"><div class="math-percent-height"><div class="tail"></div></div></div>
<!-- Cancellation still reads a percentage basis: definite gives 1px, indefinite gives auto/30px. -->
<div id="cancel-definite" style="height:120px"><div class="cancel-percent-height"><div class="tail"></div></div></div>
<div id="cancel-indefinite"><div class="cancel-percent-height"><div class="tail"></div></div></div>
<!-- The existing affine calc() path must retain the same metadata after coefficient cancellation. -->
<div id="affine-cancel-definite" style="height:120px"><div style="height:calc(100% - 100% + 1px)"><div class="tail"></div></div></div>
<div id="affine-cancel-indefinite"><div style="height:calc(100% - 100% + 1px)"><div class="tail"></div></div></div>
<!-- The last max arm and scalar multiplication/division must survive parsing. -->
<div id="max-three" class="ten" style="width:max(10px, 30px, 70px)"></div>
<div id="scaled" style="width:100px"><div class="ten" style="width:calc(min(80px, 50%) * 2 / 5)"></div></div>
<!-- A negative math result is clamped to the width property's nonnegative range: 0px. -->
<div id="negative-result" class="ten" style="width:min(-10px, -20px)"></div>
<!-- Invalid grammar must preserve the preceding 37px declaration. -->
<div id="invalid-empty" class="ten" style="width:37px;width:min()"></div>
<div id="invalid-clamp" class="ten" style="width:37px;width:clamp(1px, 2px)"></div>
<div id="invalid-type" class="ten" style="width:37px;width:min(10px, 2)"></div>
<div id="invalid-spacing" class="ten" style="width:37px;width:min(10px+ 2px, 30px)"></div>
<!-- A length-only property must reject a percentage hidden inside a comparison. -->
<div id="invalid-percent" class="ten" style="width:10px;border-left:3px solid;border-left-width:max(1px, 10%)"></div>
<!-- A single argument is valid; a trailing comma is not. -->
<div id="min-one" class="ten" style="width:min(23px)"></div>
<div id="max-one" class="ten" style="width:max(29px)"></div>
<div id="invalid-trailing" class="ten" style="width:37px;width:min(10px,)"></div>
<!-- Track breadths also participate inside minmax(), fit-content() and repeat(). -->
<div id="track-functions" style="display:grid;width:120px;grid-template-columns:minmax(min(10px, 5%), max(20px, 25%)) fit-content(clamp(10px, 25%, 40px)) repeat(1, min(60px, 50%))"><div style="width:30px;height:10px"></div><div style="width:15px;height:10px"></div><div class="ten"></div></div>
</body>
</html>
