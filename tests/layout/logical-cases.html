<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow-relative property cases</title>
<!-- The flow-relative properties of margin, padding, the insets and the
     border, longhands and shorthands, under the one direction the style stage
     has, ltr: each section's boxes show by their position and size which
     declaration won a side. The overrides set a physical and a flow-relative
     declaration of the same side, in either order at equal specificity, at a
     higher specificity, with !important, against a shorthand and in a style
     attribute. -->
<style>
  body { font: 16px serif; margin: 8px; }
  section { width: 300px; margin: 0 0 8px; border: 1px solid; }
  .k { height: 10px; background: #ccc; }
  .w { width: 100px; }
  .pi { padding-inline: 4rem; }
  .pi2 { padding-inline: 10px 30px; }
  .pis { padding-inline-start: 20px; padding-inline-end: 5px; }
  .pb { padding-block: 5px 15px; }
  .pbs { padding-block-start: 7px; padding-block-end: 3px; }
  .mi { margin-inline: 25px; }
  .mia { margin-inline: auto; }
  .mis { margin-inline-start: 12px; margin-inline-end: 50px; }
  .mb { margin-block: 0 .5rem; }
  .mbe { margin-block-end: 1.5rem; }
  .mbs { margin-block-start: 6px; }
  .bi { border-inline: 5px solid; }
  .bb { border-block: 3px dashed; }
  .bis { border-inline-start: 7px solid; border-block-end: 4px solid; }
  .biw { border: 1px solid; border-inline-width: 6px 2px; border-block-width: 4px; }
  .bisn { border: 3px solid; border-inline-style: none; }
  .bes { border-inline-end-width: 8px; border-inline-end-style: solid; border-block-start-width: 2px; border-block-start-style: solid; }
  .holder { position: relative; height: 60px; }
  .rel { position: relative; width: 50px; inset-inline-start: 10px; inset-block-start: 5px; }
  .abs1 { position: absolute; width: 30px; height: 30px; inset-inline-end: 20px; inset-block-end: 0; }
  .abs2 { position: absolute; inset-inline: 40px 100px; inset-block: 10px 20px; }
  .abs3 { position: absolute; inset: 5px 10px; }
  .o1 { margin-left: 10px; margin-inline-start: 30px; }
  .o2 { margin-inline-start: 30px; margin-left: 10px; }
  .o3a { margin-left: 10px; }
  .o3b { margin-inline-start: 30px; }
  .o4b { margin-inline-start: 30px; }
  .o4a { margin-left: 10px; }
  div.o5 { margin-left: 10px; }
  .o5 { margin-inline-start: 30px; }
  #o6 { margin-inline-start: 30px; }
  .o6 { margin-left: 10px; }
  .o7 { margin-left: 10px !important; margin-inline-start: 30px; }
  .o8 { margin-inline: 30px; margin: 0 5px; }
  .o9 { margin: 0 5px; margin-inline: 30px; }
  .o10 { margin-left: 5px; }
  .o11 { border-left: 2px solid; border-inline-start-width: 9px; }
  .o12 { border-inline-start-width: 9px; border-left: 2px solid; }
  .o13 { margin-left: 10px; }
  .o13 > div { margin-inline-start: inherit; }
  .o14 { margin-block-end: 20px; margin-bottom: 4px; }
  .o15 { margin-bottom: 4px; margin-block-end: 20px; }
  .sp1 { padding-inline: 10px 20px; }
  .sp2 { border-inline: 3px solid; }
  .sp3 { padding-inline-start: 7px; padding-left: 1px; }
</style>
</head>
<body>
<section>
  <div class="pi"><div class="k"></div></div>
  <div class="pi2"><div class="k"></div></div>
  <div class="pis"><div class="k"></div></div>
  <div class="pb"><div class="k"></div></div>
  <div class="pbs"><div class="k"></div></div>
</section>
<section>
  <div class="k mi"></div>
  <div class="k w mia"></div>
  <div class="k mis"></div>
  <div class="k mb"></div>
  <div class="k mbe"></div>
  <div class="k mbs"></div>
  <div class="k"></div>
</section>
<section>
  <div class="k bi"></div>
  <div class="k bb"></div>
  <div class="k bis"></div>
  <div class="k biw"></div>
  <div class="k bisn"></div>
  <div class="k bes"></div>
</section>
<section class="holder">
  <div class="k rel"></div>
  <div class="k abs1"></div>
  <div class="k abs2"></div>
  <div class="k abs3"></div>
</section>
<section>
  <div class="k w o1"></div>
  <div class="k w o2"></div>
  <div class="k w o3a o3b"></div>
  <div class="k w o4a o4b"></div>
  <div class="k w o5"></div>
  <div class="k w o6" id="o6"></div>
  <div class="k w o7"></div>
  <div class="k o8"></div>
  <div class="k o9"></div>
  <div class="k w o10" style="margin-inline-start: 25px"></div>
  <div class="k w o11"></div>
  <div class="k w o12"></div>
  <div class="k" style="--m: 15px 35px; margin-inline: var(--m)"></div>
  <div class="o13"><div class="k"></div></div>
  <div class="k o14"></div>
  <div class="k o15"></div>
  <div class="k"></div>
</section>
<section>
  <div><span class="sp1">x</span></div>
  <div><span class="sp2">x</span></div>
  <div><span class="sp3">x</span></div>
</section>
</body>
</html>
