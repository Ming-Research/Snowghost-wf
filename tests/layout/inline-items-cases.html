<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline item cases</title>
<style>
  body { font: 16px/20px serif; margin: 8px; }
  section { margin: 12px 0; border: 1px solid; padding: 4px; }
  .w300 { width: 300px; }
  .center { text-align: center; }
  .abs { position: absolute; }
  .mc { width: max-content; border: 1px solid; }
  .fl30 { float: left; width: 30px; height: 10px; }
  .ib { display: inline-block; height: 10px; }
  .ib50 { display: inline-block; width: 50px; height: 10px; }
</style>
</head>
<body>
<section class="w300">
  <p>Before <span class="abs">one</span> after.</p>
  <p>This paragraph is long enough to wrap onto a second line, where the box <span class="abs">two</span> sits.</p>
  <p>A forced break<br>then <span class="abs">three</span> here.</p>
  <p class="center">Centred <span class="abs">four</span> text.</p>
  <p>Inside <b>bold <span class="abs">five</span> text</b> too.</p>
</section>
<section>
  <div class="mc"><div class="fl30"></div>aaa<br>bbb</div>
  <div class="mc"><div class="fl30"></div>aaa<br>bbbbbbbbbbbb</div>
  <div class="mc">aaa<br><span class="fl30"></span>bb<br>cccccccccccc</div>
  <div class="mc">a<span class="fl30"></span>a<br>bbbbbbbbbbbb</div>
</section>
<section>
  <div style="width: 100px"><span class="ib50"></span> <span class="ib" style="width: 46px"></span></div>
  <div style="width: 100px"><span class="ib50"></span> <span class="ib" style="width: 46.015625px"></span></div>
  <div style="width: 100px"><span class="ib50"></span> <span class="ib" style="width: 46.03125px"></span></div>
  <div style="width: 53.734375px"><span>a</span><span>a</span><span>a</span><span>a</span><span>a</span><span>a</span> a</div>
  <div style="width: 53.734375px">aaaaaa a</div>
</section>
</body>
</html>
