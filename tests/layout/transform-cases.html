<!doctype html>
<html>
<head><meta charset="utf-8"><title>Translation rectangle scope</title>
<style>
body { margin:0; width:400px; font:16px/20px sans-serif }
section { width:400px; height:80px; position:relative }
div { margin:0; padding:0; border:0; width:80px; height:20px }
.child { width:20px; height:10px }
.float { float:left; width:80px; height:40px }
.alongside { overflow:hidden; width:auto; height:20px }
.scroller { overflow:auto; height:40px }
</style></head>
<body>
<!-- Translation overflow grows document scrollHeight; a scroll container contains its child's overflow. -->
<section id="centering"><div style="position:absolute;top:50%;transform:translateY(-50%)"></div></section>
<section id="pixels"><div style="transform:translate(10px,20px)"></div></section>
<section id="percent-border"><div style="padding:4px;border:2px solid;transform:translateX(25%)"></div></section>
<section id="three-d"><div style="transform:translate3d(5px,6px,7px)"></div></section>
<section id="individual"><div style="translate:4px 8px"></div></section>
<section id="nested"><div style="transform:translate(10px,20px)"><div class="child" style="transform:translate(3px,4px)"></div></div></section>
<section id="sibling"><div style="transform:translate(10px,20px)"></div><div class="child"></div></section>
<section id="float"><div class="float" style="transform:translate(10px,6px)"></div><div class="alongside"></div><div style="clear:both"></div></section>
<section id="list"><div style="transform:translateX(25%) translate(10px,2px) translateY(4px) translate3d(5px,6px,7px)"></div></section>
<section id="both"><div style="translate:4px 8px;transform:translate(10px,20px)"></div></section>
<section id="calc"><div style="transform:translate(calc(25% + 10px),calc(50% - 2px))"></div></section>
<section id="units"><div style="font-size:10px;transform:translate(1em,0.5rem)"></div></section>
<section id="descendants"><div style="transform:translate(10px,20px)"><span>Moved text</span><div class="child"></div></div></section>
<section id="property-percent"><div style="translate:25% -50%"></div></section>
<section id="none"><div style="transform:none;translate:none"></div></section>
<section id="fractional"><div style="transform:translate(.1px,.2px)"></div></section>
<section id="scroll-overflow"><div style="transform:translateY(2000px)"></div></section>
<section id="one-argument"><div style="transform:translate(7px)"></div></section>
<section id="individual-one"><div style="translate:6px"></div></section>
<section id="invalid-arity"><div style="transform:translate(8px,9px);transform:translate(1px,2px,3px)"></div></section>
<section id="invalid-z-percent"><div style="transform:translate(8px,9px);transform:translate3d(1px,2px,25%)"></div></section>
<section id="scroll-contained"><div class="scroller"><div class="child" style="transform:translateY(2000px)"></div></div></section>
<section id="relative-overflow-up"><div style="transform:translateY(-6000px)"><div style="position:relative;top:6000px"></div></div></section>
</body></html>
