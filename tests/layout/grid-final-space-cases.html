<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid natural and final constraints</title>
<style>
body { margin: 8px; font: 16px/20px serif; }
p { margin: 0; }
.grid { display: grid; width: 280px; grid-template-columns: 200px 80px; margin-bottom: 20px; }
.peer { height: 60px; }
.tail { height: 40px; }
.percent { height: 50%; }
.start { align-self: start; }
.inner { display: grid; grid-template-columns: 200px; grid-template-rows: 50% 50%; }
.inner .first { height: 40px; }
.restyle-context { display: flow-root; }
.restyle-context p { height: 60px; }
.restyle-context.half { height: 50%; }
.positioned { position: relative; }
.positioned .badge { position: absolute; bottom: 0; height: 10px; width: 30px; }
</style>
</head>
<body>
<!-- An unread percentage basis changes while an unforced item's layout inputs stay equal. -->
<div class="grid"><article class="start"><p>Unforced natural content.</p></article><aside class="peer"></aside></div>
<!-- The natural and final outer heights are both 60px; stretch makes the child's 50% definite. -->
<div class="grid"><article><p class="percent">Percentage descendant.</p><p class="tail">Tail.</p></article><aside class="peer"></aside></div>
<!-- A nested grid needs its definite row constraints even when its outer height is unchanged. -->
<div class="grid"><article class="inner"><p class="first">First row.</p><p>Second row.</p></article><aside class="peer"></aside></div>
<!-- Stretch changes the positioning basis without changing the line-breaking width. -->
<div class="grid"><article class="positioned"><p>Short natural content.</p><div class="badge">Badge</div></article><aside class="peer"></aside></div>
<!-- Reuse must retain a correct basis when this direct child context later acquires a percentage height. -->
<div class="grid"><article><section class="restyle-context"><p>Restyled direct context.</p></section></article><aside class="peer"></aside></div>
</body>
</html>
