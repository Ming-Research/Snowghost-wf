<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Font fallback cases</title>
<style>
  body { font: 16px/24px serif; margin: 8px; }
  section { margin: 12px 0; }
  pre { font-family: monospace; }
</style>
</head>
<body>
<section>
  <pre><span>&#x1100;&#x1161;</span> <span>&#xAC00;</span> <span>&#x1100;</span> <span>&#x1161;</span> <span>&#x1100;&#x1161;&#x11A8;</span> <span>&#xAC01;</span></pre>
  <p><span>&#x1100;&#x1161;</span> <span>&#xAC00;</span> <span>&#x1100;</span> <span>&#x1161;</span> <span>&#x1100;&#x1161;&#x11A8;</span> <span>&#xAC01;</span></p>
</section>
<section>
  <p><span>&#x212A;</span> <span>K</span> <span>&#x2126;</span> <span>&#x3A9;</span> <span>&#x212B;</span> <span>&#xC5;</span></p>
  <p><b><span>&#x212A;</span> <span>K</span> <span>&#x2126;</span> <span>&#x3A9;</span> <span>&#x212B;</span> <span>&#xC5;</span></b></p>
  <p style="font-family: 'DejaVu Serif'"><span>&#x212A;</span> <span>K</span> <span>&#x2126;</span> <span>&#x3A9;</span> <span>&#x212B;</span> <span>&#xC5;</span></p>
  <p><b><span>&#x212A; &#x212A;</span></b></p>
</section>
</body>
</html>
